    height:min(700px, 92vh);
    height:min(700px, 92dvh);
    background:linear-gradient(180deg,#221a13,#171009);
    border:1px solid #4a3a24;
    border-radius:6px;
    box-shadow:0 0 0 1px #08050280, 0 30px 70px -20px #000000cc, inset 0 0 60px #00000066;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  #app::before{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background:
      radial-gradient(circle at 15% 10%, #ffffff08 0%, transparent 30%),
      repeating-linear-gradient(0deg, #00000012 0 2px, transparent 2px 4px);
    mix-blend-mode:overlay;
    z-index:5;
  }
  h1,h2,h3{font-family:'Cinzel', serif; letter-spacing:0.03em; margin:0;}
  .title-font{font-family:'Cinzel Decorative', serif;}

  /* ---------- status bar ---------- */
  #statusbar{
    display:flex; align-items:center; gap:7px;
    padding:9px 44px 9px 10px;
    background:linear-gradient(180deg,#241b12,#1a130c);
    border-bottom:1px solid #4a3a24;
    font-size:13px;
    flex-shrink:0;
  }
  #statusbar .name{font-family:'Cinzel'; font-weight:700; color:var(--gold-bright); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  #statusbar .lvl{color:var(--parchment-dim); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  #statusbar .namewrap{flex-shrink:0; min-width:0; max-width:min(112px, 28vw); overflow:hidden;}
  .barwrap{flex:1; display:flex; flex-direction:column; gap:3px; min-width:80px;}
  .barrow{display:flex; align-items:center; gap:4px;}
  .barlabel{width:14px; flex-shrink:0; font-size:10.5px; color:var(--parchment-dim); font-family:'Cinzel';}
  .bar-outer{flex:1; min-width:22px; height:8px; background:#0f0b07; border:1px solid #4a3a24; border-radius:3px; overflow:hidden;}
  .bar-inner{height:100%; transition:width .4s ease;}
  .bar-hp{background:linear-gradient(90deg,var(--rust),var(--rust-bright));}
  .bar-mp{background:linear-gradient(90deg,#3d5c8c,#6f9adf);}
  .bar-exp{background:linear-gradient(90deg,var(--gold),var(--gold-bright));}
  .barval{font-size:10px; color:var(--parchment-dim); width:42px; flex-shrink:0; text-align:right;}
  #gold-display{color:var(--gold-bright); font-size:12px; white-space:nowrap; font-family:'Cinzel'; flex-shrink:0;}

  /* ---------- screens ---------- */
  .screen{display:none; flex-direction:column; flex:1; min-height:0;}
  .screen.active{display:flex; min-height:0;}

  /* ---------- title screen ---------- */
  #screen-title{
    align-items:center; justify-content:flex-start; text-align:center;
    padding:28px 24px 24px; gap:18px;
    overflow-y:auto;
    background:
      radial-gradient(ellipse at 50% 30%, #3a2c1c 0%, transparent 60%),
      var(--void);
    position:relative;
  }
  #screen-title > *{flex-shrink:0;}
  .torch-row{display:flex; gap:60px; margin-bottom:-10px;}

  #records-section{width:100%; max-width:380px; margin-top:4px;}
  .records-title{
    font-family:'Cinzel'; color:var(--gold); font-size:12.5px; letter-spacing:.05em;
    text-align:center; margin-bottom:6px; opacity:0.85;
  }
  #records-list{display:flex; flex-direction:column; gap:4px; max-height:150px; overflow-y:auto; padding:2px;}
  .record-row{
    display:flex; justify-content:space-between; gap:8px; align-items:center;
    background:#1e160dcc; border:1px solid #3a2c1c; border-radius:5px;
    padding:6px 10px; font-size:12px; color:var(--parchment-dim);
  }
  .record-row .rec-name{color:var(--parchment); font-family:'Cinzel'; font-weight:700; flex-shrink:0;}
  .record-row .rec-job{color:var(--gold-bright); flex-shrink:0;}
  .record-row .rec-stat{flex-shrink:0; white-space:nowrap;}
  .torch{width:14px; height:34px; position:relative;}
  .flame{
    width:14px; height:22px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 70%, #fff2c0, var(--ember) 55%, var(--rust) 90%);
    box-shadow:0 0 16px 4px #e0793a99, 0 0 40px 10px #d1543c44;
    animation:flicker 1.6s infinite ease-in-out;
    margin:0 auto;
  }
  .torch-stick{width:5px; height:16px; background:linear-gradient(#3a2c1c,#1d150d); margin:0 auto;}
  @keyframes flicker{
    0%,100%{transform:scaleY(1) scaleX(1) translateX(0); opacity:1;}
    25%{transform:scaleY(1.08) scaleX(0.94) translateX(-1px); opacity:.92;}
    50%{transform:scaleY(0.92) scaleX(1.05) translateX(1px); opacity:1;}
    75%{transform:scaleY(1.05) scaleX(0.97) translateX(-0.5px); opacity:.95;}
  }
  #screen-title h1{font-size:34px; color:var(--gold-bright); text-shadow:0 0 24px #e0793a55, 0 2px 0 #000; line-height:1.3;}
  #screen-title .subtitle{color:var(--parchment-dim); font-style:italic; font-size:15px; max-width:360px;}
  #name-input{
    font-family:'EB Garamond'; font-size:17px; text-align:center;
    background:#0f0b07; border:1px solid #5a4527; color:var(--parchment);
    padding:9px 14px; border-radius:3px; width:220px; outline:none;
    -webkit-user-select:text; user-select:text; -webkit-touch-callout:default;
  }
  #name-input:focus{border-color:var(--gold);}

  /* ---------- job select ----------
     직업 수가 늘어나도(예: 4개→5개) 줄 수가 그대로 유지되도록 3열로 배치한다.
     화면 전체(#screen-title)가 스크롤되므로 여기서는 별도 스크롤을 두지 않는다. */
  .job-select{
    display:flex; flex-wrap:wrap; justify-content:center; align-content:flex-start;
    gap:8px; width:100%; max-width:420px;
    flex-shrink:0;
  }
  .job-card{
    flex:0 0 calc((100% - 16px)/3);
    background:linear-gradient(180deg,#241b12,#1a130c);
    border:1px solid #4a3a24; border-radius:5px; padding:10px 6px;
    cursor:pointer; text-align:center; transition:all .12s;
  }
  .job-card:hover{border-color:var(--gold);}
  .job-card.selected{
    border-color:var(--gold-bright);
    box-shadow:0 0 0 1px var(--gold-bright), 0 0 16px #e6c34a44;
    background:linear-gradient(180deg,#3a2c1a,#241a0f);
  }
  .job-card .ji-icon{font-size:21px; line-height:1;}
  .job-card .ji-name{font-family:'Cinzel'; font-size:12.5px; color:var(--parchment); margin-top:5px; font-weight:600;}
  .job-card .ji-desc{font-size:9.5px; color:var(--parchment-dim); font-style:italic; margin-top:4px; line-height:1.35;}

  /* ---------- difficulty select ---------- */
  .difficulty-select{
    display:flex; gap:8px; width:100%; max-width:420px; flex-shrink:0;
  }
  .diff-card{
    flex:1; background:linear-gradient(180deg,#241b12,#1a130c);
    border:1px solid #4a3a24; border-radius:5px; padding:9px 6px;
    cursor:pointer; text-align:center; transition:all .12s;
  }
  .diff-card:hover{border-color:var(--gold);}
  .diff-card.selected{
    border-color:var(--gold-bright);
    box-shadow:0 0 0 1px var(--gold-bright), 0 0 16px #e6c34a44;
    background:linear-gradient(180deg,#3a2c1a,#241a0f);
  }
  .diff-card.locked{opacity:.45; cursor:pointer;}
  .diff-card.locked:hover{border-color:#4a3a24;}
  .diff-card .di-name{font-family:'Cinzel'; font-size:12.5px; color:var(--parchment); font-weight:600;}
  .diff-card .di-desc{font-size:9px; color:var(--parchment-dim); font-style:italic; margin-top:3px; line-height:1.3;}
  .diff-card.type-hardcore.selected{border-color:#ff6a5a; box-shadow:0 0 0 1px #ff6a5a, 0 0 16px #ff6a5a44;}

  /* ---------- buttons ---------- */
  .btn{
    font-family:'Cinzel'; font-size:14px; font-weight:600; letter-spacing:.02em;
    background:linear-gradient(180deg,#3a2c1a,#241a0f);
    border:1px solid #6b5230; color:var(--parchment);
    padding:12px 18px; border-radius:4px; cursor:pointer;
    box-shadow:inset 0 1px 0 #ffffff14, 0 3px 8px #00000055;
    transition:transform .12s, box-shadow .12s, border-color .12s, background .12s;
  }
  .btn:hover{border-color:var(--gold); background:linear-gradient(180deg,#4a3820,#2c2013); transform:translateY(-1px);}
  .btn:active{transform:translateY(1px); box-shadow:inset 0 1px 4px #00000066;}
  .btn:disabled{opacity:.35; cursor:not-allowed; transform:none;}
  .btn-primary{border-color:var(--gold); color:var(--gold-bright);}
  .btn-wide{width:100%;}
  .btn-danger{border-color:var(--rust-bright); color:#ffb9a3;}

  /* ---------- explore screen ---------- */
  #screen-explore{padding:20px; gap:16px; justify-content:flex-start; min-height:0;}
  .location-card{
    background:linear-gradient(180deg,#241b12,#1a130c);
    border:1px solid #4a3a24; border-radius:5px; padding:18px;
    text-align:center;
    flex-shrink:0;
  }
  .location-card .depth-tag{font-family:'Cinzel'; font-size:11px; color:var(--gold); letter-spacing:.1em; text-transform:uppercase;}
  .location-card h2{font-size:22px; color:var(--parchment); margin:6px 0 10px;}
  .location-card p{color:var(--parchment-dim); font-size:15px; line-height:1.6; font-style:italic; margin:0;}
  .explore-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; flex-shrink:0;}
  .explore-log{
    flex:1; min-height:0; background:#0f0b07aa; border:1px solid #3a2c1c;
    border-radius:4px; padding:12px 14px; font-size:14.5px; color:var(--parchment-dim);
    overflow-y:auto; line-height:1.7;
  }
  .explore-log .entry{margin-bottom:6px;}
  .explore-log .entry.gold{color:var(--gold-bright);}
  .explore-log .entry.warn{color:var(--rust-bright);}

  /* ---------- battle screen ---------- */
  #screen-battle{flex:1; min-height:0;}
  .archway{
    position:relative; margin:14px 16px 0; height:210px;
    background:
      radial-gradient(ellipse at 50% 30%, #3a2c1c66 0%, transparent 65%),
      linear-gradient(180deg,#0c0906,#171009);
    border:10px solid transparent;
    border-image:linear-gradient(180deg,#5a4527,#2c2013) 1;
    border-radius:110px 110px 8px 8px / 90px 90px 8px 8px;
    overflow:hidden;
    box-shadow:inset 0 0 50px #000000cc, inset 0 0 90px #000000aa;
  }
  .archway .torch-side{position:absolute; top:14px; width:12px; z-index:3;}
  .archway .torch-side.left{left:-2px;} .archway .torch-side.right{right:-2px;}
  .enemy-stage{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding-top:10px;
  }
  .enemy-stage svg{width:150px; height:150px; filter:drop-shadow(0 8px 14px #00000099);}
  .enemy-stage.hit svg{animation:hitshake .32s;}
  .enemy-stage.dying svg{animation:diefade .6s forwards;}
  @keyframes hitshake{
    0%,100%{transform:translate(0,0);} 20%{transform:translate(-6px,2px) rotate(-2deg);}
    40%{transform:translate(5px,-2px) rotate(2deg);} 60%{transform:translate(-4px,1px);} 80%{transform:translate(3px,0);}
  }
  @keyframes diefade{ to{ transform:translateY(30px) scale(0.7); opacity:0; filter:brightness(0.2);} }
  .dmg-pop{
    position:absolute; left:50%; top:38%; transform:translate(-50%,0);
    font-family:'Cinzel'; font-weight:700; font-size:26px; color:var(--rust-bright);
    text-shadow:0 0 10px #000, 0 0 18px #d1543c88;
    animation:popup .8s ease-out forwards; pointer-events:none; z-index:4;
  }
  .dmg-pop.heal{color:var(--forest-bright); text-shadow:0 0 10px #000, 0 0 18px #6fae7688;}
  .dmg-pop.miss{color:var(--parchment-dim); font-style:italic; font-size:19px;}
  .dmg-pop.poison{color:#9dd66a; text-shadow:0 0 10px #000, 0 0 18px #9dd66a88;}
  .dmg-pop.burn{color:var(--ember); text-shadow:0 0 10px #000, 0 0 18px #e0793a88;}
  .dmg-pop.bleed{color:#ff6a5a; text-shadow:0 0 10px #000, 0 0 18px #ff6a5a88;}
  @keyframes popup{
    0%{transform:translate(-50%,10px) scale(0.7); opacity:0;}
    25%{transform:translate(-50%,-6px) scale(1.1); opacity:1;}
    100%{transform:translate(-50%,-46px) scale(1); opacity:0;}
  }
  .dmg-pop.counter{color:#8fb4e8; text-shadow:0 0 10px #000, 0 0 18px #8fb4e888;}
  .dmg-pop.crit{font-size:31px; color:#ffe08a; text-shadow:0 0 10px #000, 0 0 22px #ffe08acc;}

  /* ---------- 스킬 / 상태이상 이펙트 ---------- */
  .slash-mark{
    position:absolute; top:50%; left:50%; width:150px; height:6px;
    background:linear-gradient(90deg, transparent, #fff6d6 20%, #fff 50%, #fff6d6 80%, transparent);
    box-shadow:0 0 10px #fff, 0 0 20px #d1543c;
    pointer-events:none; z-index:5; opacity:0;
    animation:slashcut .32s ease-out forwards;
  }
  @keyframes slashcut{
    0%{opacity:0; transform:translate(-50%,-50%) rotate(var(--ang,-30deg)) scaleX(0.2);}
    35%{opacity:1; transform:translate(-50%,-50%) rotate(var(--ang,-30deg)) scaleX(1.15);}
    100%{opacity:0; transform:translate(-50%,-50%) rotate(var(--ang,-30deg)) scaleX(1.3);}
  }
  .combo-count{
    position:absolute; left:50%; top:64%; transform:translate(-50%,0);
    font-family:'Cinzel'; font-weight:700; font-size:22px; color:#ffe08a;
    text-shadow:0 0 8px #000, 0 0 16px #ffe08acc; letter-spacing:.04em;
    pointer-events:none; z-index:5; animation:combopop .7s ease-out forwards; white-space:nowrap;
  }
  @keyframes combopop{
    0%{opacity:0; transform:translate(-50%,10px) scale(0.6);}
    30%{opacity:1; transform:translate(-50%,0) scale(1.15);}
    80%{opacity:1;}
    100%{opacity:0; transform:translate(-50%,-16px) scale(1);}
  }
  .status-fx{position:absolute; inset:0; pointer-events:none; z-index:2; opacity:0;}
  .status-fx.play{animation:statusflash .55s ease-out;}
  @keyframes statusflash{ 0%{opacity:0;} 30%{opacity:1;} 100%{opacity:0;} }
  .status-fx.poison{background:radial-gradient(ellipse at 50% 55%, #7ee06655 0%, transparent 70%);}
  .status-fx.burn{background:radial-gradient(ellipse at 50% 55%, #ff8a3a66 0%, transparent 70%);}
  .status-fx.bleed{background:radial-gradient(ellipse at 50% 55%, #ff4a4a55 0%, transparent 70%);}
  .enemy-stage.dot-poison{animation:poisonpulse 1.1s ease-in-out infinite;}
  .enemy-stage.dot-burn{animation:burnpulse .9s ease-in-out infinite;}
  .enemy-stage.dot-bleed{animation:bleedpulse 1.3s ease-in-out infinite;}
  @keyframes poisonpulse{ 0%,100%{filter:drop-shadow(0 0 0 #9dd66a00);} 50%{filter:drop-shadow(0 0 16px #9dd66a99);} }
  @keyframes burnpulse{ 0%,100%{filter:drop-shadow(0 0 0 #e0793a00);} 50%{filter:drop-shadow(0 0 16px #e0793a99);} }
  @keyframes bleedpulse{ 0%,100%{filter:drop-shadow(0 0 0 #ff6a5a00);} 50%{filter:drop-shadow(0 0 14px #ff6a5a88);} }
  .enemy-stage.elite{animation:elitepulse 1.6s ease-in-out infinite;}
  @keyframes elitepulse{ 0%,100%{filter:drop-shadow(0 0 4px #e6c34a55);} 50%{filter:drop-shadow(0 0 22px #e6c34aee);} }
  .elite-tag{
    display:inline-block; font-family:'Cinzel'; font-size:10.5px; letter-spacing:.06em;
    color:#1a130c; background:linear-gradient(180deg,#ffe9a0,#e6c34a);
    border-radius:8px; padding:1px 7px; margin-right:6px; vertical-align:middle;
    box-shadow:0 0 8px #e6c34a99;
  }

  .cast-burst{
    position:absolute; top:50%; left:50%; width:20px; height:20px; margin:-10px 0 0 -10px;
    border-radius:50%; border:3px solid var(--gold-bright); pointer-events:none; z-index:5;
    animation:castburst .55s ease-out forwards;
  }
  .cast-burst.heal{border-color:var(--forest-bright);}
  .cast-burst.def{border-color:#8fb4e8;}
  @keyframes castburst{ 0%{opacity:.9; transform:scale(0.3);} 100%{opacity:0; transform:scale(6);} }

  .fx-banner{
    position:absolute; left:50%; top:20%; transform:translate(-50%,0);
    font-family:'Cinzel'; font-weight:700; font-size:16px; color:var(--gold-bright);
    background:#1a130ce0; border:1px solid var(--gold); border-radius:5px; padding:5px 12px;
    text-shadow:0 1px 3px #000; pointer-events:none; z-index:6; white-space:nowrap;
    animation:bannerpop 1.1s ease-out forwards;
  }
  .fx-banner.guardian{color:#8fb4e8; border-color:#8fb4e8;}
  .fx-banner.phoenix{color:#ffb15a; border-color:#ffb15a;}
  .fx-banner.dodge{color:var(--parchment-dim); border-color:var(--parchment-dim);}
  .fx-banner.luckbad{color:#ff6a5a; border-color:#ff6a5a;}
  @keyframes bannerpop{
    0%{opacity:0; transform:translate(-50%,8px) scale(0.8);}
    20%{opacity:1; transform:translate(-50%,0) scale(1.05);}
    80%{opacity:1;}
    100%{opacity:0; transform:translate(-50%,-10px) scale(1);}
  }

  .enemy-status-badges{
    position:absolute; top:50%; right:6px; transform:translateY(-50%);
    display:flex; flex-direction:column; align-items:flex-end; gap:5px;
    max-width:104px; z-index:4; pointer-events:none;
  }
  .status-badge{
    font-family:'Cinzel'; font-size:10px; padding:2px 6px; border-radius:9px;
    background:#1a130cd0; border:1px solid #4a3a24; color:var(--parchment-dim);
    white-space:nowrap; animation:badgein .25s ease-out;
  }
  .status-badge.poison{color:#9dd66a; border-color:#9dd66a88;}
  .status-badge.burn{color:var(--ember); border-color:#e0793a88;}
  .status-badge.bleed{color:#ff6a5a; border-color:#ff6a5a88;}
  @keyframes badgein{ from{opacity:0; transform:translateY(-4px) scale(0.8);} to{opacity:1; transform:translateY(0) scale(1);} }

  .enemy-name-bar{
    position:absolute; top:8px; left:0; right:0; text-align:center; z-index:3;
  }
  .enemy-name-bar .ename{font-family:'Cinzel'; font-size:13.5px; color:var(--parchment); text-shadow:0 1px 3px #000; letter-spacing:.02em;}
  .enemy-hp-outer{
    width:130px; height:6px; margin:4px auto 0; background:#0f0b07; border:1px solid #4a3a24; border-radius:3px; overflow:hidden;
  }
  .enemy-hp-inner{height:100%; background:linear-gradient(90deg,var(--rust),var(--rust-bright)); transition:width .4s;}

  .battle-lower{padding:12px 14px 16px; display:flex; flex-direction:column; gap:10px; flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .msgbox{
    background:linear-gradient(180deg,#e9dcc0,#dccba0);
    color:var(--ink); border:2px solid #6b5230; border-radius:4px;
    padding:10px 14px; font-size:15px; min-height:48px; line-height:1.5;
    box-shadow:inset 0 0 0 1px #ffffff40, 0 4px 10px #00000066;
    flex-shrink:0;
  }
  .msgbox .m-line{margin:0;}
  .msgbox .m-line + .m-line{margin-top:2px; opacity:.65; font-size:13.5px;}

  #bt-command-area{display:flex; flex-direction:column; flex:1; min-height:0;}
  .cmd-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; flex-shrink:0;}
  .cmd-btn{
    font-family:'Cinzel'; font-size:14.5px; font-weight:600;
    background:linear-gradient(180deg,#3a2c1a,#241a0f); border:1px solid #6b5230;
    color:var(--parchment); border-radius:4px; padding:13px 10px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:all .12s; min-height:46px;
  }
  .cmd-btn:hover{border-color:var(--gold); background:linear-gradient(180deg,#4a3820,#2c2013);}
  .cmd-btn:disabled{opacity:.3; cursor:not-allowed;}
  .cmd-btn .icon{font-size:16px;}

  .sublist{display:flex; flex-direction:column; gap:6px; flex:1; min-height:96px; max-height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .sub-item{
    display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
    background:#1a130c; border:1px solid #3a2c1c; border-radius:4px;
    padding:9px 12px; cursor:pointer; font-size:14px; min-height:44px; flex-shrink:0;
  }
  .sub-item:hover{border-color:var(--gold);}
  .sub-item .si-info{flex:1; min-width:0;}
  .sub-item .si-name{font-family:'Cinzel'; font-size:13.5px; color:var(--parchment); display:block;}
  .sub-item .si-desc{color:var(--parchment-dim); font-size:12px; font-style:italic; display:block; margin-top:2px; white-space:normal; overflow-wrap:break-word; line-height:1.4;}
  .sub-item .si-cost{color:#8fb4e8; font-size:12px; flex-shrink:0; margin-left:8px; padding-top:1px;}
  .sub-item.disabled{opacity:.35; cursor:not-allowed;}
  .back-row{display:flex; justify-content:flex-end; flex-shrink:0; padding-top:2px;}
  .link-btn{background:none; border:none; color:var(--parchment-dim); font-family:'Cinzel'; font-size:12.5px; cursor:pointer; text-decoration:underline; padding:4px;}
  .link-btn:hover{color:var(--gold-bright);}

  #sound-toggle{
    position:absolute; top:8px; right:8px; z-index:40;

  }
  #sound-toggle:hover{border-color:var(--gold); color:var(--gold-bright);}
  #sound-toggle.muted{color:#6b5b45;}

  /* ---------- shop ---------- */
  .shop-overlay{
    position:absolute; inset:0; background:#0a0705ee; z-index:20;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .shop-panel{
    width:100%; background:linear-gradient(180deg,#241b12,#170f08);

  .shop-item .si-info{flex:1; min-width:0;}
  .shop-item .si-info .si-name{display:block;}
  .shop-item .si-info .si-desc{display:block; margin-top:2px;}
  .item-desc{
    margin-top:5px; font-size:11.5px; color:#a89a7a; line-height:1.5;

  .item-desc-rare{
    margin-top:6px; padding:6px 8px; border-radius:4px;

  .item-desc-epic{
    margin-top:6px; padding:6px 8px; border-radius:4px;

  .buy-btn{font-family:'Cinzel'; font-size:12.5px; background:#3a2c1a; border:1px solid var(--gold); color:var(--gold-bright); padding:6px 12px; border-radius:3px; cursor:pointer; flex-shrink:0;}
  .buy-btn:disabled{opacity:.3; cursor:not-allowed;}

  .relic-grid{display:flex; flex-direction:column; gap:10px;}
  .relic-card{
    display:flex; flex-direction:column; gap:4px; text-align:left;
    background:#1e160dcc; border:1px solid #4a3a24; border-radius:8px;

  }
  .relic-card:hover{transform:translateY(-2px); border-color:var(--gold-bright);}
  .relic-card:disabled{cursor:not-allowed; opacity:.55; transform:none;}
  .relic-card:disabled:hover{transform:none; border-color:#4a3a24;}
  .relic-lock-msg{
    text-align:center; color:var(--gold-bright); font-size:12px; font-family:'Cinzel';
    letter-spacing:.03em; margin:0 0 10px; animation:lockpulse 1.1s ease-in-out infinite;
  }
  @keyframes lockpulse{ 0%,100%{opacity:.55;} 50%{opacity:1;} }
  .relic-panel{ animation:relicIn .35s ease; }
  @keyframes relicIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .relic-card .relic-type{
    font-family:'Cinzel'; font-size:11px; letter-spacing:.08em; text-transform:uppercase;

  .relic-card.type-blessing .relic-type{color:#ffe9a8; background:#4a3a12;}
  .relic-card.type-contract .relic-type{color:#ffb98f; background:#4a2a12;}
  .relic-card.type-curse .relic-type{color:#d99fff; background:#2e1240;}
  .relic-card.type-wild .relic-type{color:#8fe8dd; background:#0f3a36;}
  .relic-card.type-blessing{border-color:#c99a3f; box-shadow:0 0 14px #c99a3f33;}
  .relic-card.type-contract{border-color:#b86a3f;}

  .relic-card .relic-name{font-family:'Cinzel'; font-weight:700; font-size:15px; color:var(--gold-bright);}
  .relic-card .relic-desc{font-size:13px; color:var(--parchment-dim);}
  .relic-card .relic-desc .relic-pos{color:#8fd66a;}
  .relic-card .relic-desc .relic-neg{color:#ff6a5a;}

  #relicdex-section{width:100%; max-width:380px; margin-top:4px;}
  #relicdex-list{display:flex; flex-direction:column; gap:4px; max-height:150px; overflow-y:auto; padding:2px;}
  .relicdex-row{
    display:flex; justify-content:space-between; gap:8px; align-items:center;
    background:#1e160dcc; border:1px solid #3a2c1c; border-radius:5px;
    padding:6px 10px; font-size:12px; color:var(--parchment-dim);
  }
  .relicdex-row.locked{opacity:.5; font-style:italic;}

  /* ---------- gameover / victory ---------- */
  #screen-gameover, #screen-levelup, #screen-ending{
    align-items:center; justify-content:center; text-align:center; gap:16px; padding:30px;
  }
  #screen-gameover h1{color:var(--rust-bright); font-size:28px;}
  #screen-gameover p{color:var(--parchment-dim); font-size:15px; line-height:1.7;}
  #screen-ending{
    background:radial-gradient(ellipse at 50% 20%, #3a2c1c 0%, transparent 65%), var(--void);
  }
  #screen-ending h1{color:var(--gold-bright); font-size:30px; text-shadow:0 0 26px #e6c34a66, 0 2px 0 #000;}
  #screen-ending p{color:var(--parchment-dim); font-size:15px; line-height:1.8; max-width:400px;}
  #screen-ending .ending-btns{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}

  .toast{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:#1a130ce8; border:1px solid var(--gold); border-radius:6px;
    padding:20px 28px; text-align:center; z-index:30; box-shadow:0 10px 40px #000000cc;
    animation:toastin .3s ease;
  }
  @keyframes toastin{from{opacity:0; transform:translate(-50%,-50%) scale(0.85);} to{opacity:1; transform:translate(-50%,-50%) scale(1);}}
  .toast h3{color:var(--gold-bright); margin-bottom:8px; font-size:19px;}
  .toast p{color:var(--parchment); margin:3px 0; font-size:14px;}
  .toast-epic{
    border:1px solid var(--epic); box-shadow:0 10px 40px #000000cc, 0 0 26px #ff7a3c55;
  }
  .set-progress-box{
    background:#3a1f0f22; border:1px solid var(--epic); border-radius:4px;
    padding:6px 8px; margin-bottom:6px; font-size:11.5px; color:var(--parchment-dim); line-height:1.6;
  }

  ::-webkit-scrollbar{width:7px;}
  ::-webkit-scrollbar-thumb{background:#4a3a24; border-radius:4px;}
  ::-webkit-scrollbar-track{background:#0f0b07;}
</style>
</head>

<script>
(function(){
  "use strict";

  /* ============ 사운드 엔진 (Web Audio API로 실시간 합성 — 외부 음원 파일 없음) ============ */
  const Sound = (function(){
    let ctx = null, master = null, bgmGain = null, sfxGain = null;
    let muted = false;
    let bgmTimer = null, bgmStep = 0, bgmMode = 'explore'; // 'explore' | 'battle' | 'off'

    try{
      const saved = window.localStorage ? window.localStorage.getItem('lc_muted') : null;
      if(saved === '1') muted = true;
    }catch(e){ /* ignore */ }

    function ensureCtx(){
      if(!ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = 1; master.connect(ctx.destination);
        bgmGain = ctx.createGain(); bgmGain.gain.value = 0.16; bgmGain.connect(master);
        sfxGain = ctx.createGain(); sfxGain.gain.value = 0.55; sfxGain.connect(master);
      }
      if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
      return ctx;
    }

    function noiseBuffer(c, dur){
      const n = Math.max(1, Math.floor(c.sampleRate*dur));
      const buf = c.createBuffer(1, n, c.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n); // 살짝 감쇠하는 노이즈
      return buf;
    }

    // ---- 개별 효과음 ----
    function slash(){
      const c = ensureCtx(); if(!c || muted) return;
      const t = c.currentTime;
      const src = c.createBufferSource(); src.buffer = noiseBuffer(c, 0.16);
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.1;
      bp.frequency.setValueAtTime(4200, t); bp.frequency.exponentialRampToValueAtTime(600, t+0.14);
      const g = c.createGain(); g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.7, t+0.008); g.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
      src.connect(bp); bp.connect(g); g.connect(sfxGain);
      src.start(t); src.stop(t+0.17);
    }
    function multiSlash(n){
      for(let i=0;i<Math.max(1,n||2);i++) setTimeout(slash, i*130);
    }
    function bomb(){
      const c = ensureCtx(); if(!c || muted) return;
      const t = c.currentTime;
      const osc = c.createOscillator(); osc.type = 'sine';
      osc.frequency.setValueAtTime(140, t); osc.frequency.exponentialRampToValueAtTime(32, t+0.38);
      const og = c.createGain(); og.gain.setValueAtTime(0.85, t); og.gain.exponentialRampToValueAtTime(0.001, t+0.42);
      osc.connect(og); og.connect(sfxGain); osc.start(t); osc.stop(t+0.42);

      const src = c.createBufferSource(); src.buffer = noiseBuffer(c, 0.55);
      const lp = c.createBiquadFilter(); lp.type = 'lowpass';
      lp.frequency.setValueAtTime(2200, t); lp.frequency.exponentialRampToValueAtTime(120, t+0.55);
      const ng = c.createGain(); ng.gain.setValueAtTime(0.55, t); ng.gain.exponentialRampToValueAtTime(0.001, t+0.55);
      src.connect(lp); lp.connect(ng); ng.connect(sfxGain);
      src.start(t); src.stop(t+0.55);
    }
    function magic(){
      const c = ensureCtx(); if(!c || muted) return;
      const t = c.currentTime;
      [0, 0.04].forEach((delay, i)=>{
        const osc = c.createOscillator(); osc.type = i===0?'triangle':'sine';
        const start = 520 + i*180;
        osc.frequency.setValueAtTime(start, t+delay);
        osc.frequency.exponentialRampToValueAtTime(start*2.1, t+delay+0.22);
        const g = c.createGain(); g.gain.setValueAtTime(0.0001, t+delay);
        g.gain.exponentialRampToValueAtTime(0.32, t+delay+0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t+delay+0.3);
        osc.connect(g); g.connect(sfxGain);
        osc.start(t+delay); osc.stop(t+delay+0.32);
      });
    }
    function heal(){
      const c = ensureCtx(); if(!c || muted) return;
      const t = c.currentTime;
      [0,0.09,0.18].forEach((delay,i)=>{
        const osc = c.createOscillator(); osc.type = 'sine';
        osc.frequency.setValueAtTime([523,659,784][i], t+delay);
        const g = c.createGain(); g.gain.setValueAtTime(0.0001, t+delay);
        g.gain.exponentialRampToValueAtTime(0.28, t+delay+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t+delay+0.35);
        osc.connect(g); g.connect(sfxGain);
        osc.start(t+delay); osc.stop(t+delay+0.36);
      });
    }
    function guard(){
      const c = ensureCtx(); if(!c || muted) return;
      const t = c.currentTime;
      const osc = c.createOscillator(); osc.type = 'square';
      osc.frequency.setValueAtTime(180, t);
      const g = c.createGain(); g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+0.2);
      const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 900;
      osc.connect(lp); lp.connect(g); g.connect(sfxGain);
      osc.start(t); osc.stop(t+0.2);
    }
    function buff(){
      const c = ensureCtx(); if(!c || muted) return;
      const t = c.currentTime;
      const osc = c.createOscillator(); osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, t); osc.frequency.exponentialRampToValueAtTime(660, t+0.3);
      const g = c.createGain(); g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t+0.05); g.gain.exponentialRampToValueAtTime(0.0001, t+0.32);
      const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 1800;
      osc.connect(lp); lp.connect(g); g.connect(sfxGain);
      osc.start(t); osc.stop(t+0.33);
    }
    function hit(){
      const c = ensureCtx(); if(!c || muted) return;
      const t = c.currentTime;
      const osc = c.createOscillator(); osc.type='triangle';
      osc.frequency.setValueAtTime(160, t); osc.frequency.exponentialRampToValueAtTime(60, t+0.18);
      const g = c.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.2);
      osc.connect(g); g.connect(sfxGain); osc.start(t); osc.stop(t+0.2);
    }
    function poisonHit(){
      const c = ensureCtx(); if(!c || muted) return;
      const t = c.currentTime;
      const src = c.createBufferSource(); src.buffer = noiseBuffer(c, 0.22);
      const bp = c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=4;
      const g = c.createGain(); g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.3, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+0.22);
      src.connect(bp); bp.connect(g); g.connect(sfxGain); src.start(t); src.stop(t+0.22);
    }
    function coin(){
      const c = ensureCtx(); if(!c || muted) return;
      const t = c.currentTime;
      [0,0.06].forEach((delay,i)=>{
        const osc = c.createOscillator(); osc.type='square';
        osc.frequency.setValueAtTime(i===0?988:1318, t+delay);
        const g = c.createGain(); g.gain.setValueAtTime(0.0001, t+delay);
        g.gain.exponentialRampToValueAtTime(0.16, t+delay+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+delay+0.18);
        osc.connect(g); g.connect(sfxGain); osc.start(t+delay); osc.stop(t+delay+0.19);
      });
    }
    function fail(){
      const c = ensureCtx(); if(!c || muted) return;
      const t = c.currentTime;
      const osc = c.createOscillator(); osc.type='sawtooth';
      osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(90, t+0.3);
      const g = c.createGain(); g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.32);
      osc.connect(g); g.connect(sfxGain); osc.start(t); osc.stop(t+0.32);
    }
    function potion(){
      const c = ensureCtx(); if(!c || muted) return;
      const t = c.currentTime;
      [0,0.05,0.1].forEach((delay,i)=>{
        const osc = c.createOscillator(); osc.type='sine';
        osc.frequency.setValueAtTime(700-i*90, t+delay);
        const g = c.createGain(); g.gain.setValueAtTime(0.0001, t+delay);
        g.gain.exponentialRampToValueAtTime(0.2, t+delay+0.015); g.gain.exponentialRampToValueAtTime(0.0001, t+delay+0.12);
        osc.connect(g); g.connect(sfxGain); osc.start(t+delay); osc.stop(t+delay+0.13);
      });
    }
    function click(){
      const c = ensureCtx(); if(!c || muted) return;
      const t = c.currentTime;
      const osc = c.createOscillator(); osc.type='square'; osc.frequency.setValueAtTime(700, t);
      const g = c.createGain(); g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.05);
      osc.connect(g); g.connect(sfxGain); osc.start(t); osc.stop(t+0.05);
    }
    function levelUp(){
      const c = ensureCtx(); if(!c || muted) return;
      const t = c.currentTime;
      [0,0.1,0.2,0.32].forEach((delay,i)=>{
        const osc = c.createOscillator(); osc.type='triangle';
        osc.frequency.setValueAtTime([523,659,784,1047][i], t+delay);
        const g = c.createGain(); g.gain.setValueAtTime(0.0001, t+delay);
        g.gain.exponentialRampToValueAtTime(0.3, t+delay+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+delay+0.4);
        osc.connect(g); g.connect(sfxGain); osc.start(t+delay); osc.stop(t+delay+0.4);
      });
    }
    function victory(){
      const c = ensureCtx(); if(!c || muted) return;
      const t = c.currentTime;
      [[0,523],[0.14,659],[0.28,784],[0.42,1047],[0.56,1319]].forEach(([delay,freq])=>{
        const osc = c.createOscillator(); osc.type='triangle'; osc.frequency.setValueAtTime(freq, t+delay);
        const g = c.createGain(); g.gain.setValueAtTime(0.0001, t+delay);
        g.gain.exponentialRampToValueAtTime(0.32, t+delay+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+delay+0.5);
        osc.connect(g); g.connect(sfxGain); osc.start(t+delay); osc.stop(t+delay+0.5);
      });
    }
    function gameOver(){
      const c = ensureCtx(); if(!c || muted) return;
      const t = c.currentTime;
      [[0,392],[0.22,349],[0.44,261]].forEach(([delay,freq])=>{
        const osc = c.createOscillator(); osc.type='sine'; osc.frequency.setValueAtTime(freq, t+delay);
        const g = c.createGain(); g.gain.setValueAtTime(0.0001, t+delay);
        g.gain.exponentialRampToValueAtTime(0.3, t+delay+0.04); g.gain.exponentialRampToValueAtTime(0.0001, t+delay+0.7);
        osc.connect(g); g.connect(sfxGain); osc.start(t+delay); osc.stop(t+delay+0.7);
      });
    }

    // 상태이상 부여음: burn=폭발음, poison=산성 지글거림, bleed=베인 소리
    function statusApply(type){
      if(type==='burn') bomb();
      else if(type==='poison') poisonHit();
      else if(type==='bleed') slash();
    }

    // ---- 배경음(BGM): 저음 드론 + 간헐적 아르페지오를 실시간 스케줄링하는 루프 ----
    const SCALE_EXPLORE = [220, 261.6, 293.7, 329.6, 392, 440]; // A minor 계열, 잔잔하게
    const SCALE_BATTLE   = [220, 246.9, 277.2, 329.6, 369.9, 440]; // 살짝 긴장감 있는 스케일
    let droneOsc = [];

    function stopDrone(){
      droneOsc.forEach(o=>{ try{ o.stop(); }catch(e){} });
      droneOsc = [];
    }
    function startDrone(){
      const c = ensureCtx(); if(!c) return;
      stopDrone();
      const t = c.currentTime;
      const freqs = bgmMode==='battle' ? [110, 164.8] : [110, 146.8];
      freqs.forEach((f,i)=>{
        const osc = c.createOscillator(); osc.type = i===0?'sine':'triangle';
        osc.frequency.setValueAtTime(f, t);
        const g = c.createGain(); g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(i===0?0.5:0.28, t+2.2);
        const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = bgmMode==='battle'?1400:900;
        osc.connect(lp); lp.connect(g); g.connect(bgmGain);
        osc.start(t);
        droneOsc.push(osc); droneOsc.push(g);
      });
    }
    function scheduleBgmStep(){
      const c = ensureCtx(); if(!c || bgmMode==='off') return;
      const scale = bgmMode==='battle' ? SCALE_BATTLE : SCALE_EXPLORE;
      const interval = bgmMode==='battle' ? 900 : 1500;
      // 확률적으로 짧은 아르페지오 음을 하나 얹어 심심하지 않게 한다(음소거 시엔 건너뜀)
      if(!muted && Math.random() < (bgmMode==='battle'?0.55:0.35)){
        const t = c.currentTime;
        const freq = scale[Math.floor(Math.random()*scale.length)] * (Math.random()<0.5?2:1);
        const osc = c.createOscillator(); osc.type='sine'; osc.frequency.setValueAtTime(freq, t);
        const g = c.createGain(); g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.1, t+0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.9);
        osc.connect(g); g.connect(bgmGain);
        osc.start(t); osc.stop(t+0.95);
      }
      bgmTimer = setTimeout(scheduleBgmStep, interval);
    }
    function setBgmMode(mode){
      if(bgmMode === mode) return;
      bgmMode = mode;
      const c = ensureCtx(); if(!c) return;
      if(mode==='off'){
        stopDrone();
        if(bgmTimer) clearTimeout(bgmTimer);
        return;
      }
      startDrone();
      if(bgmTimer) clearTimeout(bgmTimer);
      scheduleBgmStep();
    }
    function ensureBgmRunning(){
      // 최초 사용자 입력 시 AudioContext를 깨우고 현재 모드에 맞는 BGM을 시작한다
      const c = ensureCtx(); if(!c) return;
      if(droneOsc.length===0 && bgmMode!=='off') startDrone();
      if(!bgmTimer && bgmMode!=='off') scheduleBgmStep();
    }

    function setMuted(v){
      muted = v;
      if(master) master.gain.value = muted ? 0 : 1;
      try{ if(window.localStorage) window.localStorage.setItem('lc_muted', muted?'1':'0'); }catch(e){}
    }
    function toggleMuted(){ setMuted(!muted); return muted; }
    function isMuted(){ return muted; }

    return {
      ensureCtx, ensureBgmRunning, setBgmMode,
      slash, multiSlash, bomb, magic, heal, guard, buff, hit, poisonHit, coin, fail, potion, click,
      levelUp, victory, gameOver, statusApply,
      setMuted, toggleMuted, isMuted,
    };
  })();

  /* ============ 저장/불러오기 ============ */
  const SAVE_KEY = 'savegame';
  // Claude 아티팩트 환경(window.storage)이 있으면 그것을 쓰고,
  // 독립 실행(파일로 열거나 호스팅된 페이지)인 경우 localStorage로 대체한다.
  function hasArtifactStorage(){
    return typeof window !== 'undefined' && window.storage
      && typeof window.storage.set === 'function'
      && typeof window.storage.get === 'function';
  }
  function hasLocalStorage(){
    try{
      if(typeof window === 'undefined' || !window.localStorage) return false;
      const t = '__lc_test__';
      window.localStorage.setItem(t, '1');
      window.localStorage.removeItem(t);
      return true;
    }catch(e){ return false; }
  }
  function storageAvailable(){
    return hasArtifactStorage() || hasLocalStorage();
  }

  // 짧은 시간 안에 saveGame()이 여러 번 호출되어도 실제 저장 요청은
  // 한 번만(디바운스) 나가도록 하고, 동시에 여러 요청이 겹치지 않게 큐잉한다.
  let saveDebounceTimer = null;
  let saveInFlight = false;
  let saveQueuedAgain = false;

  function saveGame(){
    if(!player) return;
    if(!storageAvailable()) return;
    if(saveDebounceTimer) clearTimeout(saveDebounceTimer);
    saveDebounceTimer = setTimeout(performSave, 400);
  }

  async function performSave(attempt){
    attempt = attempt || 1;
    if(saveInFlight){ saveQueuedAgain = true; return; }
    saveInFlight = true;
    const payload = JSON.stringify({player, depth, town, inBossDen, bossDenFloor});
    try{
      if(hasArtifactStorage()){
        await window.storage.set(SAVE_KEY, payload, false);
      } else if(hasLocalStorage()){
        window.localStorage.setItem(SAVE_KEY, payload);
      }
    }catch(e){
      const msg = e && e.message ? e.message : e;
      if(attempt < 3){
        // 서버 일시 오류일 수 있으므로 잠시 후 재시도
        saveInFlight = false;
        setTimeout(()=>performSave(attempt+1), 600*attempt);
        return;
      }
      console.warn('저장을 사용할 수 없습니다(재시도 실패):', msg);
    } finally {
      saveInFlight = false;
    }
    if(saveQueuedAgain){
      saveQueuedAgain = false;
      saveDebounceTimer = setTimeout(performSave, 400);
    }
  }

  async function loadGame(){
    if(!storageAvailable()) return null;
    try{
      if(hasArtifactStorage()){
        const res = await window.storage.get(SAVE_KEY, false);
        if(res && res.value) return JSON.parse(res.value);
      } else if(hasLocalStorage()){
        const raw = window.localStorage.getItem(SAVE_KEY);
        if(raw) return JSON.parse(raw);
      }
    }catch(e){ /* 저장 데이터 없음, 정상 */ }
    return null;
  }
  async function deleteSave(){
    if(!storageAvailable()) return;
    try{
      if(hasArtifactStorage()) await window.storage.delete(SAVE_KEY, false);
      else if(hasLocalStorage()) window.localStorage.removeItem(SAVE_KEY);
    }catch(e){ /* ignore */ }
  }

  // ---------- 이전 모험 기록(엔딩을 본 캐릭터들의 발자취) ----------
  const RECORDS_KEY = 'gamerecords';
  async function loadRecords(){
    if(!storageAvailable()) return [];
    try{
      if(hasArtifactStorage()){
        const res = await window.storage.get(RECORDS_KEY, false);
        if(res && res.value) return JSON.parse(res.value);
      } else if(hasLocalStorage()){
        const raw = window.localStorage.getItem(RECORDS_KEY);
        if(raw) return JSON.parse(raw);
      }
    }catch(e){ /* 기록 없음, 정상 */ }
    return [];
  }
  async function addRecord(record){
    const records = await loadRecords();
    records.push(record);
    while(records.length > 30) records.shift();
    const payload = JSON.stringify(records);
    try{
      if(hasArtifactStorage()) await window.storage.set(RECORDS_KEY, payload, false);
      else if(hasLocalStorage()) window.localStorage.setItem(RECORDS_KEY, payload);
    }catch(e){ /* ignore */ }
    return records;
  }

  const RELICDEX_KEY = 'relicdex';
  async function loadRelicDex(){
    if(!storageAvailable()) return [];
    try{
      if(hasArtifactStorage()){
        const res = await window.storage.get(RELICDEX_KEY, false);
        if(res && res.value) return JSON.parse(res.value);
      } else if(hasLocalStorage()){
        const raw = window.localStorage.getItem(RELICDEX_KEY);
        if(raw) return JSON.parse(raw);
      }
    }catch(e){ /* 기록 없음, 정상 */ }
    return [];
  }
  async function addToRelicDex(id){
    const dex = await loadRelicDex();
    if(dex.includes(id)) return dex;
    dex.push(id);
    const payload = JSON.stringify(dex);
    try{
      if(hasArtifactStorage()) await window.storage.set(RELICDEX_KEY, payload, false);
      else if(hasLocalStorage()) window.localStorage.setItem(RELICDEX_KEY, payload);
    }catch(e){ /* ignore */ }
    return dex;
  }

  function getItemDef(id){
    return EQUIPMENT[id] || RARE_EQUIPMENT[id] || EPIC_EQUIPMENT[id];
  }

  function statsText(stats){
    return Object.entries(stats).map(([k,v])=>`${STAT_LABELS[k]||k} ${v>0?'+':''}${v}`).join(', ');
  }

  function applyEquipStats(stats){
    if(stats.atk) player.atk += stats.atk;
    if(stats.def) player.def += stats.def;
    if(stats.mag) player.mag += stats.mag;
    if(stats.spd) player.spd += stats.spd;
    if(stats.maxhp){ player.maxhp += stats.maxhp; player.hp = Math.min(player.maxhp, Math.max(0, player.hp + stats.maxhp)); }
    if(stats.maxmp){ player.maxmp += stats.maxmp; player.mp = Math.min(player.maxmp, Math.max(0, player.mp + stats.maxmp)); }
  }
  function unapplyEquipStats(stats){
    if(stats.atk) player.atk -= stats.atk;
    if(stats.def) player.def -= stats.def;
    if(stats.mag) player.mag -= stats.mag;
    if(stats.spd) player.spd -= stats.spd;
    if(stats.maxhp){ player.maxhp -= stats.maxhp; player.hp = Math.min(player.maxhp, Math.max(0, player.hp - stats.maxhp)); }
    if(stats.maxmp){ player.maxmp -= stats.maxmp; player.mp = Math.min(player.maxmp, Math.max(0, player.mp - stats.maxmp)); }
  }

  function equipItem(itemId){
    const item = getItemDef(itemId);
    if(!item) return;
    if(!player.equipOwned.includes(itemId)) return;
    const slot = item.slot;
    const current = player.equipment[slot];
    if(current === itemId) return;
    const prevCounts = getEpicSetCounts();
    if(current) unapplyEquipStats(getItemDef(current).stats);
    applyEquipStats(item.stats);
    player.equipment[slot] = itemId;
    renderStatus();
    checkEpicSetToast(prevCounts);
    saveGame();
  }
  function unequipItem(slot){
    const current = player.equipment[slot];
    if(!current) return;
    const prevCounts = getEpicSetCounts();
    unapplyEquipStats(getItemDef(current).stats);
    player.equipment[slot] = null;
    renderStatus();
    checkEpicSetToast(prevCounts);
    saveGame();
  }
  function checkEpicSetToast(prevCounts){
    const newCounts = getEpicSetCounts();
    Object.keys(EPIC_SETS).forEach(setId=>{
      const prev = prevCounts[setId]||0;
      const now = newCounts[setId]||0;
      if(now===prev) return;
      if(now===2 && prev<2) showEpicSetToast(setId, 2);
      else if(now===3 && prev<3) showEpicSetToast(setId, 3);
    });
  }
  function showEpicSetToast(setId, tier){
    const set = EPIC_SETS[setId];
    const t = document.createElement('div');
    t.className = 'toast toast-epic';
    if(tier===2){
      t.innerHTML = `<h3 style="color:var(--epic-bright);">✦ ${set.name} — 2/3</h3><p><b>${set.set2Name}</b></p><p>${set.set2Desc}</p>`;
    } else {
      t.innerHTML = `<h3 style="color:var(--epic-bright);">✦✦✦ SET COMPLETE</h3><p style="color:var(--epic-bright);"><b>${set.name}</b></p><p><b>${set.set3Name}</b></p><p>${set.set3Desc}</p>`;
    }
    document.getElementById('app').appendChild(t);
    setTimeout(()=>t.remove(), 3200);
  }

  function equippedSpecials(){
    return Object.values(player.equipment).filter(Boolean).map(id=>{
      const def = getItemDef(id);
      return def && def.special;
    }).filter(Boolean);
  }
  function getSpecialSum(key){
    return equippedSpecials().reduce((sum,sp)=> sum + (typeof sp[key]==='number' ? sp[key] : 0), 0);
  }
  function hasSpecial(key){
    return equippedSpecials().some(sp=>sp[key]);
  }
  function getDotBoostRatio(type){
    let total = 0;
    equippedSpecials().forEach(sp=>{
      if(!sp.dotBoost) return;
      if(typeof sp.dotBoost === 'number') total += sp.dotBoost;
      else if(sp.dotBoost[type]) total += sp.dotBoost[type];
    });
    return total;
  }
  function getReviveRatio(){
    let best = 0;
    equippedSpecials().forEach(sp=>{ if(sp.reviveOnce && sp.reviveOnce>best) best = sp.reviveOnce; });
    return best || 0.3;
  }
  function applyPassiveLifesteal(dmg){
    const pct = getSpecialSum('lifestealPct') * epicLifestealMult();
    if(pct<=0) return 0;
    const healed = Math.min(player.maxhp-player.hp, Math.round(dmg*pct));
    if(healed>0) player.hp += healed;
    return healed;
  }

  /* ---------- 에픽 세트 효과 ---------- */
  function getEpicSetCounts(){
    const counts = {};
    Object.values(player.equipment).forEach(id=>{
      if(!id) return;
      const def = EPIC_EQUIPMENT[id];
      if(!def) return;
      counts[def.setId] = (counts[def.setId]||0)+1;
    });
    return counts;
  }
  function epicSetTier(setId){
    const c = getEpicSetCounts()[setId] || 0;
    return c>=3 ? 3 : (c>=2 ? 2 : 0);
  }
  function mechExplosionReady(){
    if(!enemy || !enemy.dots) return false;
    const types = ['burn','poison','bleed'];
    return types.every(t=> enemy.dots.some(d=>d.type===t && d.turns>0));
  }
  function epicLifestealMult(){
    const pt = epicSetTier('paladin');
    return (pt>=3 && battleFlags && battleFlags.paladinAwoken) ? 2 : 1;
  }
  function checkPaladinAwoken(){
    const pt = epicSetTier('paladin');
    if(pt<3 || !battleFlags) return;
    if(player.maxhp>0 && (player.hp/player.maxhp)<=0.5) battleFlags.paladinAwoken = true;
  }
  // 물리 공격/스킬이 적중할 때마다 도적 3세트 처형 카운트를 쌓는다
  function rogueRegisterHit(isPhys){
    const rt = epicSetTier('rogue');
    if(rt<3 || !isPhys || !battleFlags) return;
    battleFlags.execCount = (battleFlags.execCount||0)+1;
    if(battleFlags.execCount>=3){
      battleFlags.execCount = 0;
      battleFlags.execReady = true;
    }
  }
  // 체력 50% 이하에서 20% 확률로 한 번 더 공격하는 전사 3세트 효과
  function maybeWarriorExtraHit(){
    const wt = epicSetTier('warrior');
    if(wt<3) return false;
    const hpRatio = player.maxhp>0 ? player.hp/player.maxhp : 1;
    if(hpRatio>0.5) return false;
    return Math.random() < 0.2;
  }
  // 운 스킬(coinflip/gamble/finalcard)의 도박사 세트 상태를 확인한다
  function epicLuckPre(s){
    const jt = epicSetTier('jester');
    const info = {jt, wasArmed:false};
    if(!s.luck || !battleFlags) return info;
    if(jt>=3 && battleFlags.jackpotArmed) info.wasArmed = true;
    return info;
  }
  function epicLuckApplyChance(chance, info){
    if(info && info.wasArmed) return Math.max(chance, 0.9);
    return chance;
  }
  function epicLuckPost(success, info){
    if(!info || !battleFlags) return;
    const jt = info.jt;
    if(success){
      if(jt>=2) battleFlags.gambleStacks = Math.min(2, (battleFlags.gambleStacks||0)+1);
      if(jt>=3){
        if(info.wasArmed){
          battleFlags.jackpotArmed = false;
          battleFlags.jackpotGauge = 0;
        } else {
          battleFlags.jackpotGauge = (battleFlags.jackpotGauge||0)+1;
          if(battleFlags.jackpotGauge>=3) battleFlags.jackpotArmed = true;
        }
      }
    } else {
      battleFlags.gambleStacks = 0;
      if(info.wasArmed){
        battleFlags.jackpotArmed = false;
        battleFlags.jackpotGauge = 0;
      }
    }
  }
  // 모든 피해 계산의 마지막 단계에서 곱해지는 에픽 세트 배율
  function getEpicSetMult(ctx){
    ctx = ctx || {};
    let mult = 1;
    const hpRatio = player.maxhp>0 ? player.hp/player.maxhp : 1;
    const mpRatio = player.maxmp>0 ? player.mp/player.maxmp : 1;
    const isPhys = ctx.type==='basic' || ctx.type==='physkill';
    const isMagic = ctx.type==='magicskill';

    // 전사 — 멸망한 거인의 유산
    const wt = epicSetTier('warrior');
    if(wt>=2 && isPhys && hpRatio<=0.5) mult *= 1.25;
    if(wt>=3 && isPhys && hpRatio<=0.5) mult *= 1.6;

    // 마법사 — 별을 삼킨 대현자
    const mt = epicSetTier('mage');
    if(mt>=2 && isMagic && mpRatio>=0.5) mult *= 1.25;
    if(mt>=3 && isMagic && (ctx.mpCost||0)>=10){
      mult *= 1.7;
      if(mpRatio<=0.3) mult *= 1.4;
      if(enemy) applyDot({type:'burn', basis:'mag', ratio:0.22, turns:3, label:'별의 화상'});
    }

    // 도적 — 밤을 걷는 학살자
    const rt = epicSetTier('rogue');
    if(rt>=2 && isPhys && enemy && player.spd>enemy.spd) mult *= 1.25;
    if(rt>=3 && isPhys && battleFlags && battleFlags.execReady){
      mult *= 2.0;
      if(enemy && enemy.maxhp>0 && (enemy.hp/enemy.maxhp)<=0.3) mult *= 2.0;
      battleFlags.execReady = false;
    }

    // 성기사 — 최후의 성전
    const pt = epicSetTier('paladin');
    if(pt>=2 && hpRatio<=0.5) mult *= 1.25;
    if(pt>=3 && battleFlags && battleFlags.paladinAwoken){
      mult *= 1.5;
      if(hpRatio<=0.25 && !battleFlags.paladinUltUsed){
        mult *= 2.0;
        battleFlags.paladinUltUsed = true;
      }
    }

    // 메카닉 — 종말기계 Mk.Ω
    const mct = epicSetTier('mechanic');
    if(mct>=2 && enemy){
      const activeTypes = new Set((enemy.dots||[]).filter(d=>d.turns>0).map(d=>d.type)).size;
      const capped = Math.min(3, activeTypes);
      if(capped>0) mult *= (1+capped*0.15);
    }
    if(mct>=3 && enemy && mechExplosionReady() && battleFlags){
      mult *= 1.8;
      battleFlags.mechExplodeTriggered = true;
    }

    // 도박사 — 운명의 마지막 패
    const jt = epicSetTier('jester');
    if(ctx.luck && battleFlags){
      if(jt>=2){
        const stacks = battleFlags.gambleStacks||0;
        if(stacks>0) mult *= (1+0.3*stacks);
      }
      if(jt>=3 && battleFlags.jackpotArmed) mult *= 2.5;
    }

    return mult;
  }
  // 메카닉 3세트 폭발 등, 배율이 아닌 고정 추가 피해를 처리한다
  function getEpicFlatBonus(){
    let bonus = 0;
    if(battleFlags && battleFlags.mechExplodeTriggered){
      battleFlags.mechExplodeTriggered = false;
      const types = ['burn','poison','bleed'];
      let total = 0;
      (enemy.dots||[]).forEach(d=>{
        if(types.includes(d.type) && d.turns>0){
          total += d.dmgPerTurn * d.turns;
          d.turns = 0;
        }
      });
      bonus += Math.round(total*1.6);
      updateStatusBadges();
    }
    return bonus;
  }

  function getEffectiveEnemyDef(base){
    let pierce = 0;
    const hpRatio = player.maxhp>0 ? player.hp/player.maxhp : 1;
    if(epicSetTier('warrior')>=3 && hpRatio<=0.5) pierce += 0.3;
    if(epicSetTier('paladin')>=3 && battleFlags && battleFlags.paladinAwoken) pierce += 0.4;
    if(epicSetTier('rogue')>=3 && battleFlags && battleFlags.execReady) pierce += 0.5;
    if(epicSetTier('mechanic')>=3 && mechExplosionReady()) pierce += 0.5;
    if(epicSetTier('jester')>=3 && battleFlags && battleFlags.jackpotArmed) pierce += 0.6;
    if(pierce<=0) return base;
    return Math.max(0, Math.round(base*(1-Math.min(0.9, pierce))));
  }
  function getRelicSum(key){
    return (player.relics||[]).reduce((sum,id)=>{
      const r = RELICS[id];
      return sum + (r && typeof r.effect[key]==='number' ? r.effect[key] : 0);
    }, 0);
  }
  function hasRelicFlag(key){
    return (player.relics||[]).some(id=>{ const r = RELICS[id]; return r && r.effect[key]; });
  }
  // 거꾸로 된 왕관: 체력이 75% 이상이면 피해가 오히려 줄고, 낮아질수록 피해가 가속도로 커진다.
  function getLowHpScalingMult(){
    if(!hasRelicFlag('lowHpScalingDmg')) return 1;
    const ratio = player.maxhp>0 ? player.hp/player.maxhp : 1;
    if(ratio>=0.75) return Math.max(0.7, 1 - (ratio-0.75)*0.6);
    const missing = 0.75-ratio;
    return 1 + missing*missing*2.5;
  }
  // 죽음의 모래시계: 전투 시작 후 제한 턴 이내면 피해가 오른다.
  function getHourglassMult(){
    const limit = getRelicSum('turnLimitTurns');
    if(limit<=0) return 1;
    const turn = (battleFlags && battleFlags.hourglassTurn) || 0;
    return turn<=limit ? (1+getRelicSum('turnLimitDmgBonus')) : 1;
  }
  function applyOutgoingDamageMods(dmg, ctx){
    ctx = ctx || {};
    let mult = 1;
    mult *= getEpicSetMult(ctx);
    mult *= (1 + getRelicSum('dmgPctMult'));
    if(ctx.type==='basic') mult *= (1 + getRelicSum('basicAtkPctMult'));
    if(enemy && enemy.isBoss) mult *= (1 + getRelicSum('bossDmgPctMult'));
    mult *= getLowHpScalingMult();
    mult *= getHourglassMult();
    let result = Math.max(1, Math.round(dmg*mult));
    result += getEpicFlatBonus();
    return Math.max(1, result);
  }

  // ---------- 유물 (특정 층의 유물 제단에서 3개 중 1개 선택, 획득 즉시 적용 · 런 종료까지 유지) ----------
  // 유물은 장비 슬롯을 쓰지 않으며 증강과 달리 "빌드 자체를 바꾸는" 규칙형 아이템이다.
  // atkPct/defPct/magPct/maxhpPct/maxmpPct/spdFlat/mpZero 는 획득 즉시 스탯에 반영되고,
  // 나머지 키(dmgPctMult/basicAtkPctMult/bossDmgPctMult/dmgTakenPctMult/hpLockPct/killHealPct/
  // potionEffMult/potionLocked/skillLocked/lowHpScalingDmg/noPostBattleHeal/turnLimit*/killAtkStack/
  // hideDepth/goldPctMult/rareDropPctBonus/extraActionBySpd)는 전투 파이프라인에 전부 연결되어 실제로 작동한다.
  // (extraActionBySpd는 enemyTurn()을 래퍼+enemyTurnReal()로 분리해 연결했다.)
  const RELICS = {
    relic_goldenheart:  {type:'blessing', name:'황금 심장',     desc:'최대 HP +15%', effect:{maxhpPct:0.15}},
    relic_ironwill:     {type:'blessing', name:'강철의 의지',   desc:'방어력 +12%', effect:{defPct:0.12}},
    relic_manastream:   {type:'blessing', name:'마나의 샘',     desc:'최대 마나 +18%', effect:{maxmpPct:0.18}},
    relic_blackcrown:   {type:'blessing', name:'검은 왕관',     desc:'보스/진보스 상대 최종 피해 +12%', effect:{bossDmgPctMult:0.12}},

    relic_bloodoath:    {type:'contract', name:'피의 서약',     desc:'<span class="relic-neg">전투를 시작할 때 항상 체력이 최대 HP의 50%로 맞춰진다.</span> <span class="relic-pos">대신 공격/피해량 +35%.</span>', effect:{hpLockPct:0.5, dmgPctMult:0.35}},
    relic_emptybowl:    {type:'contract', name:'빈 그릇',       desc:'<span class="relic-neg">최대 MP가 0이 되어 스킬을 쓸 수 없다.</span> <span class="relic-pos">대신 일반 공격 피해 +80%.</span>', effect:{mpZero:true, basicAtkPctMult:0.80}},
    relic_glassheart:   {type:'contract', name:'유리 심장',     desc:'<span class="relic-neg">받는 피해 +40%.</span> <span class="relic-pos">모든 공격 피해 +60%.</span>', effect:{dmgTakenPctMult:0.40, dmgPctMult:0.60}},
    relic_hungryring:   {type:'contract', name:'굶주린 반지',   desc:'<span class="relic-pos">적 처치 시 HP를 회복한다.</span> <span class="relic-neg">대신 포션 회복 효율이 크게 줄어든다.</span>', effect:{killHealPct:0.10, potionEffMult:-0.5}},
    relic_hourglass:    {type:'contract', name:'죽음의 모래시계', desc:'<span class="relic-pos">전투 시작 후 3턴 안에 적을 처치하면 가한 피해가 크게 오른다.</span> <span class="relic-neg">3턴이 지나면 매 턴 최대체력의 5%만큼 피해를 입는다.</span>', effect:{turnLimitTurns:3, turnLimitDmgBonus:0.4, turnLimitPenaltyPct:0.05}},
    relic_deadledger:   {type:'contract', name:'망자의 장부',   desc:'<span class="relic-pos">적을 처치할 때마다 공격력이 영구히 오른다.</span> <span class="relic-neg">전투에서 도망치면 그동안 쌓은 보너스가 모두 사라진다.</span>', effect:{killAtkStack:true, stackAtkPerKill:1}},
    relic_brokencompass:{type:'contract', name:'깨진 나침반',   desc:'<span class="relic-neg">현재 깊이를 알 수 없게 된다.</span> <span class="relic-pos">대신 골드와 희귀 아이템 획득 확률이 오른다.</span>', effect:{hideDepth:true, goldPctMult:0.25, rareDropPctBonus:0.03}},

    relic_heartlessdoll:{type:'curse', name:'심장 없는 인형', desc:'최대 HP가 절반으로 줄어든다.', effect:{maxhpPct:-0.5}},
    relic_leadfeet:     {type:'curse', name:'납으로 된 발',   desc:'속도가 크게 감소한다.', effect:{spdFlat:-8}},
    relic_hungrycorridor:{type:'curse', name:'굶주린 회랑',   desc:'포션을 쓸 수 없고, 레벨업으로도 체력·마나가 가득 차지 않는다.', effect:{noPostBattleHeal:true, potionLocked:true}},
    relic_silentoath:   {type:'curse', name:'침묵의 서약',   desc:'스킬을 사용할 수 없게 된다.', effect:{skillLocked:true}},

    relic_witchclock:   {type:'wild', name:'마녀의 시계',   desc:'속도가 15 이상이면 매 턴 확률적으로(15↑10%, 20↑20%, 25↑30%) 적에게 턴을 넘기지 않고 한 번 더 행동한다.', effect:{extraActionBySpd:true}},
    relic_reversecrown: {type:'wild', name:'거꾸로 된 왕관', desc:'체력이 75% 이상이면 피해가 줄고, 낮을수록 가한 피해가 가속도로 커진다.', effect:{lowHpScalingDmg:true}},
  };
  // 일반 유물 제단에서는 저주형을 제외한 유물만 등장한다(저주형은 별도의 저주 제단 전용).
  const RELIC_ALTAR_POOL = Object.keys(RELICS).filter(id=>RELICS[id].type!=='curse');
  const RELIC_ALTAR_FLOORS = [6,12,18,24,36,42,48];
  const CURSE_ALTAR_POOL = Object.keys(RELICS).filter(id=>RELICS[id].type==='curse');
  const CURSE_ALTAR_FLOORS = [9,21,33,44];

  // 저주를 감수할수록 보상이 커진다: 저주 1개 → 골드/드랍 +10%, 2개 이상 → +25%, 3개 이상 → 에픽 확률 추가 보너스.
  // 저주형은 유물 슬롯을 차지하지 않는다 — 저주는 페널티 그 자체가 대가이므로,
  // 슬롯까지 깎아먹으면 이중 페널티가 되어 저주 제단을 기피하게 만들기 때문.
  function getRelicSlotUsage(){
    return (player.relics||[]).filter(id=>{ const r=RELICS[id]; return r && r.type!=='curse'; }).length;
  }

  function getCurseCount(){
    return (player.relics||[]).filter(id=>{ const r=RELICS[id]; return r && r.type==='curse'; }).length;
  }
  function getCurseRewardMult(){
    const c = getCurseCount();
    if(c>=2) return 0.25;
    if(c>=1) return 0.10;
    return 0;
  }
  function getCurseEpicBonus(){
    return getCurseCount()>=3 ? 0.05 : 0;
  }

  function getRelicDef(id){ return RELICS[id]; }

  // atkPct/defPct/magPct/maxhpPct/maxmpPct/spdFlat/mpZero 는 획득 즉시 스탯에 반영한다.
  // 슬롯 교체로 유물을 버릴 때 정확히 되돌릴 수 있도록, 실제로 변한 값(before/after 차이)을
  // player.relicAppliedDeltas[id]에 기록해둔다 — 퍼센트 기반 효과라 나중에 그대로 역산할 수 없기 때문.
  function applyRelicEffect(id){
    const relic = RELICS[id];
    if(!relic) return;
    const before = {atk:player.atk, def:player.def, mag:player.mag, maxhp:player.maxhp, hp:player.hp, maxmp:player.maxmp, mp:player.mp, spd:player.spd};
    const e = relic.effect;
    if(e.atkPct) player.atk = Math.max(1, player.atk + Math.round(player.atk*e.atkPct));
    if(e.defPct) player.def = Math.max(0, player.def + Math.round(player.def*e.defPct));
    if(e.magPct) player.mag = Math.max(0, player.mag + Math.round(player.mag*e.magPct));
    if(e.maxhpPct){
      const d = Math.round(player.maxhp*e.maxhpPct);
      player.maxhp = Math.max(1, player.maxhp+d);
      player.hp = Math.max(1, Math.min(player.maxhp, player.hp+d));
    }
    if(e.maxmpPct){
      const d = Math.round(player.maxmp*e.maxmpPct);
      player.maxmp = Math.max(0, player.maxmp+d);
      player.mp = Math.max(0, Math.min(player.maxmp, player.mp+d));
    }
    if(e.spdFlat) player.spd += e.spdFlat;
    if(e.mpZero){ player.maxmp = 0; player.mp = 0; }
    const delta = {};
    Object.keys(before).forEach(k=>{ const diff = player[k]-before[k]; if(diff!==0) delta[k]=diff; });
    player.relicAppliedDeltas = player.relicAppliedDeltas || {};
    player.relicAppliedDeltas[id] = delta;
  }

  // 유물 슬롯이 가득 찼을 때, 보유 중인 유물 하나를 버리고 스탯을 정확히 되돌린다.
  function removeRelic(id){
    const idx = player.relics.indexOf(id);
    if(idx<0) return false;
    const delta = (player.relicAppliedDeltas && player.relicAppliedDeltas[id]) || {};
    if(delta.atk) player.atk = Math.max(1, player.atk - delta.atk);
    if(delta.def) player.def = Math.max(0, player.def - delta.def);
    if(delta.mag) player.mag = Math.max(0, player.mag - delta.mag);
    if(delta.maxhp) player.maxhp = Math.max(1, player.maxhp - delta.maxhp);
    if(delta.hp) player.hp = Math.max(1, player.hp - delta.hp);
    if(delta.maxmp) player.maxmp = Math.max(0, player.maxmp - delta.maxmp);
    if(delta.mp) player.mp = Math.max(0, player.mp - delta.mp);
    if(delta.spd) player.spd -= delta.spd;
    player.hp = Math.max(1, Math.min(player.hp, player.maxhp));
    player.mp = Math.max(0, Math.min(player.mp, player.maxmp));
    player.relics.splice(idx,1);
    if(player.relicAppliedDeltas) delete player.relicAppliedDeltas[id];
    return true;
  }

  function rollRelicChoices(){
    const pool = RELIC_ALTAR_POOL.filter(id=>!player.relics.includes(id));
    const shuffled = pool.slice();
    for(let i=shuffled.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, 3);
  }

  function finalizeRelicPick(id, isMystery){
    const r = RELICS[id];
    applyRelicEffect(id);
    player.relics.push(id);
    addToRelicDex(id);
    renderStatus();
    saveGame();
    if(isMystery){
      addLog('✦ 알 수 없는 유물을 손에 넣었다… 무엇인지는 [유물] 화면에서 확인할 수 있다.', 'gold');
    } else if(r.type==='curse'){
      addLog(`☠ 저주 [${r.name}]을(를) 받아들였다… (이후 보상이 늘어난다)`, 'warn');
    } else {
      addLog(`✦ 유물 [${r.name}]을(를) 손에 넣었다!`, 'gold');
    }
  }

  // 유물 슬롯이 가득 찬 상태에서 새 유물을 고르면, 먼저 내려놓을 유물을 선택하게 한다.
  // (한 번 열리면 반드시 하나를 내려놓아야 하며, 취소할 수 없다.)
  function showRelicSwapPrompt(newId, altarOverlay, isMystery){
    const newR = RELICS[newId];
    const typeLabel = {blessing:'축복', contract:'계약', curse:'저주', wild:'변칙'};
    const nameForPrompt = isMystery ? '알 수 없는 유물' : newR.name;
    const overlay = document.createElement('div');
    overlay.className = 'shop-overlay';
    overlay.id = 'relic-swap-overlay';
    const panel = document.createElement('div');
    panel.className = 'shop-panel relic-panel';
    panel.innerHTML = `<h3>유물 슬롯이 가득 찼다</h3>
      <p style="text-align:center;color:var(--parchment-dim);font-size:12.5px;font-style:italic;margin:-4px 0 10px;">[${nameForPrompt}]을(를) 담으려면, 지니고 있는 유물 하나를 내려놓아야 한다.</p>
      <div class="relic-grid">
      ${player.relics.map(id=>{
        const r = RELICS[id];
        return `<button class="relic-card type-${r.type}" data-id="${id}">
          <div class="relic-type">${typeLabel[r.type]}</div>
          <div class="relic-name">${r.name}</div>
          <div class="relic-desc">${r.desc}</div>
        </button>`;
      }).join('')}
      </div>`;
    overlay.appendChild(panel);
    document.getElementById('app').appendChild(overlay);

    panel.querySelectorAll('.relic-card').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const discardId = btn.dataset.id;
        const discardR = RELICS[discardId];
        removeRelic(discardId);
        addLog(`[${discardR.name}]을(를) 내려놓았다.`, 'warn');
        finalizeRelicPick(newId, isMystery);
        overlay.remove();
        if(altarOverlay) altarOverlay.remove();
      });
    });
  }

  function showRelicAltar(atDepth){
    const choices = rollRelicChoices();
    if(!choices.length) return; // 고를 수 있는 신규 유물이 더 없다
    const typeLabel = {blessing:'축복', contract:'계약', curse:'저주', wild:'변칙'};
    const mysteryIdx = choices.length>=2 ? Math.floor(Math.random()*choices.length) : -1;
    const overlay = document.createElement('div');
    overlay.className = 'shop-overlay';
    overlay.id = 'relic-overlay';
    const panel = document.createElement('div');
    panel.className = 'shop-panel relic-panel relic-panel-locked';
    const slotUsage = getRelicSlotUsage();
    const slotNote = slotUsage>=player.relicSlots
      ? `<p style="text-align:center;color:#ff9a7a;font-size:12px;margin:0 0 8px;">유물 슬롯(${player.relicSlots})이 가득 찼다. 새 유물을 고르면 하나를 내려놓아야 한다.</p>`
      : `<p style="text-align:center;color:var(--parchment-dim);font-size:12px;margin:0 0 8px;">유물 슬롯 ${slotUsage}/${player.relicSlots}</p>`;
    const skipsLeft = Math.max(0, (player.relicSkipsMax||0) - (player.relicSkipsUsed||0));
    panel.innerHTML = `<h3>✦ 유물 제단 ✦</h3>
      <p style="text-align:center;color:var(--parchment-dim);font-size:12.5px;font-style:italic;margin:-4px 0 6px;">세 개의 유물이 그대를 기다리고 있다. 하나를 선택하라.</p>
      ${slotNote}
      <p class="relic-lock-msg" id="relic-lock-msg">내용을 살펴보는 중…</p>
      <div class="relic-grid">
      ${choices.map((id,i)=>{
        if(i===mysteryIdx){
          return `<button class="relic-card type-mystery" data-id="${id}" disabled>
            <div class="relic-type">？？？</div>
            <div class="relic-name">알 수 없는 유물</div>
            <div class="relic-desc">무엇이 담겨 있는지는 손에 넣기 전까지 알 수 없다.</div>
          </button>`;
        }
        const r = RELICS[id];
        return `<button class="relic-card type-${r.type}" data-id="${id}" disabled>
          <div class="relic-type">${typeLabel[r.type]}</div>
          <div class="relic-name">${r.name}</div>
          <div class="relic-desc">${r.desc}</div>
        </button>`;
      }).join('')}
      </div>
      <div style="text-align:center; margin-top:10px;">
        <button class="link-btn" id="relic-skip-btn" disabled>${skipsLeft>0 ? `고르지 않는다 (남은 횟수 ${skipsLeft}회)` : '고르지 않는다 (더 이상 사용 불가)'}</button>
      </div>`;
    overlay.appendChild(panel);
    document.getElementById('app').appendChild(overlay);

    const LOCK_MS = 1500;
    setTimeout(()=>{
      panel.classList.remove('relic-panel-locked');
      panel.querySelectorAll('.relic-card').forEach(btn=>{ btn.disabled = false; });
      const skipBtn = panel.querySelector('#relic-skip-btn');
      if(skipBtn && skipsLeft>0) skipBtn.disabled = false;
      const msg = panel.querySelector('#relic-lock-msg');
      if(msg) msg.remove();
    }, LOCK_MS);

    panel.querySelectorAll('.relic-card').forEach((btn,i)=>{
      btn.addEventListener('click', ()=>{
        if(btn.disabled) return;
        const id = btn.dataset.id;
        const isMystery = (i===mysteryIdx);
        if(getRelicSlotUsage() >= player.relicSlots){
          showRelicSwapPrompt(id, overlay, isMystery);
          return;
        }
        finalizeRelicPick(id, isMystery);
        overlay.remove();
      });
    });

    const skipBtn = panel.querySelector('#relic-skip-btn');
    if(skipBtn){
      skipBtn.addEventListener('click', ()=>{
        if(skipBtn.disabled) return;
        if((player.relicSkipsUsed||0) >= (player.relicSkipsMax||0)) return;
        player.relicSkipsUsed = (player.relicSkipsUsed||0) + 1;
        saveGame();
        overlay.remove();
        addLog('제단을 뒤로하고 발길을 돌렸다.', 'warn');
      });

  // 저주 제단: 유물 제단과 달리 단 하나의 저주만 제시하며, 받아들일지 떠날지 직접 선택한다.
  function showCurseAltar(atDepth){
    const pool = CURSE_ALTAR_POOL.filter(id=>!player.relics.includes(id));
    if(!pool.length) return; // 이미 모든 저주를 갖고 있다
    const id = pool[Math.floor(Math.random()*pool.length)];
    const r = RELICS[id];
    const overlay = document.createElement('div');
    overlay.className = 'shop-overlay';
    overlay.id = 'curse-overlay';
    const panel = document.createElement('div');
    panel.className = 'shop-panel relic-panel relic-panel-locked';
    panel.innerHTML = `<h3 style="color:#d99fff;">☠ 피로 물든 제단 ☠</h3>
      <p style="text-align:center;color:var(--parchment-dim);font-size:12.5px;font-style:italic;margin:-4px 0 10px;">이 제단에서 저주를 가져가면, 그것은 두 번 다시 떼어낼 수 없다.<br>대신 저주를 짊어질수록 이후의 보상이 커진다.</p>
      <p class="relic-lock-msg" id="curse-lock-msg">내용을 살펴보는 중…</p>
      <div class="relic-grid">
        <button class="relic-card type-curse" id="curse-card" disabled>
          <div class="relic-type">저주</div>
          <div class="relic-name">${r.name}</div>
          <div class="relic-desc">${r.desc}</div>
        </button>
      </div>
      <div style="text-align:center; margin-top:10px; display:flex; gap:8px; justify-content:center;">
        <button class="btn" id="curse-decline">떠난다</button>
        <button class="btn btn-danger" id="curse-accept" disabled>받아들인다</button>
      </div>`;
    overlay.appendChild(panel);
    document.getElementById('app').appendChild(overlay);

    const LOCK_MS = 1500;
    setTimeout(()=>{
      panel.classList.remove('relic-panel-locked');
      const acceptBtn = panel.querySelector('#curse-accept');
      if(acceptBtn) acceptBtn.disabled = false;
      const msg = panel.querySelector('#curse-lock-msg');
      if(msg) msg.remove();
    }, LOCK_MS);

    panel.querySelector('#curse-decline').addEventListener('click', ()=>{
      overlay.remove();
      addLog('제단에서 풍기는 불길한 기운을 뒤로하고 떠났다.', 'warn');
    });
    panel.querySelector('#curse-accept').addEventListener('click', ()=>{
      if(panel.querySelector('#curse-accept').disabled) return;
      finalizeRelicPick(id);
      overlay.remove();
    });
  }

  function findEquipmentForDepth(){
    const pool = Object.keys(EQUIPMENT).filter(id=>EQUIPMENT[id].minDepth<=depth && !player.equipOwned.includes(id));

    return pool[Math.floor(Math.random()*pool.length)];
  }
