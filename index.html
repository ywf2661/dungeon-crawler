  function renderRecords(records){
    const section = document.getElementById('records-section');
    const box = document.getElementById('records-list');
    if(!records || !records.length){ section.style.display='none'; return; }
    section.style.display='block';
    box.innerHTML = '';
    records.slice().reverse().forEach(r=>{
      const row = document.createElement('div');
      row.className = 'record-row';
      const left = document.createElement('span');
      left.className = 'rec-name';
      left.textContent = r.name;
      const job = document.createElement('span');
      job.className = 'rec-job';
      job.textContent = r.jobLabel;
      const diffLabel = {easy:'쉬움', normal:'보통', hardcore:'하드코어'}[r.difficulty] || '쉬움';
      const stat = document.createElement('span');
      stat.className = 'rec-stat';
      stat.textContent = `${diffLabel} · Lv.${r.level} · 사망 ${r.deathCount}회`;
      row.appendChild(left); row.appendChild(job); row.appendChild(stat);
      box.appendChild(row);
    });
  }

  async function showRelicDex(){
    const discovered = await loadRelicDex();
    const ids = Object.keys(RELICS);
    const typeLabel = {blessing:'축복', contract:'계약', curse:'저주', wild:'변칙'};
    const overlay = document.createElement('div');
    overlay.className = 'shop-overlay';
    overlay.id = 'relicdex-overlay';
    const panel = document.createElement('div');
    panel.className = 'shop-panel';
    panel.innerHTML = `<h3>📖 유물 도감</h3>
      <p style="text-align:center;color:var(--parchment-dim);font-size:12.5px;margin:-4px 0 10px;">발견: ${discovered.length} / ${ids.length}</p>
      <div id="relicdex-list"></div>
      <div style="text-align:center; margin-top:10px;"><button class="btn" id="relicdex-close">닫기</button></div>`;
    overlay.appendChild(panel);
    document.getElementById('app').appendChild(overlay);
    const box = panel.querySelector('#relicdex-list');
    ids.forEach(id=>{
      const found = discovered.includes(id);
      const r = RELICS[id];
      const row = document.createElement('div');
      row.className = 'relicdex-row' + (found?'':' locked');
      if(found){
        row.innerHTML = `<span style="color:var(--gold-bright); font-family:'Cinzel';">${r.name}</span><span>${typeLabel[r.type]}</span>`;
      } else {
        row.innerHTML = `<span>？？？</span><span>🔒</span>`;
      }
      box.appendChild(row);
    });
    panel.querySelector('#relicdex-close').addEventListener('click', ()=> overlay.remove());
  }

  // 현재 보유 중인 유물 목록 (탐험 화면에서 언제든 확인 가능)
  function showMyRelics(){
    const typeLabel = {blessing:'축복', contract:'계약', curse:'저주', wild:'변칙'};
    const overlay = document.createElement('div');
    overlay.className = 'shop-overlay';
    overlay.id = 'myrelics-overlay';
    const panel = document.createElement('div');
    panel.className = 'shop-panel relic-panel';
    const held = (player.relics||[]);
    const body = held.length
      ? `<div class="relic-grid">` + held.map(id=>{
          const r = RELICS[id];
          if(!r) return '';
          return `<div class="relic-card type-${r.type}" style="cursor:default;">
            <div class="relic-type">${typeLabel[r.type]}</div>
            <div class="relic-name">${r.name}</div>
            <div class="relic-desc">${r.desc}</div>
          </div>`;
        }).join('') + `</div>`
      : `<p style="text-align:center;color:var(--parchment-dim);font-size:13px;font-style:italic;padding:10px 0;">아직 손에 넣은 유물이 없다.</p>`;
    panel.innerHTML = `<h3>✦ 보유 중인 유물 ✦</h3>
      <p style="text-align:center;color:var(--parchment-dim);font-size:12px;margin:-4px 0 10px;">유물 슬롯 ${getRelicSlotUsage()}/${player.relicSlots} <span style="opacity:.7;">(저주는 슬롯을 차지하지 않는다)</span></p>
      ${body}
      <div style="text-align:center; margin-top:10px;"><button class="btn" id="myrelics-close">닫기</button></div>`;
    overlay.appendChild(panel);
    document.getElementById('app').appendChild(overlay);
    panel.querySelector('#myrelics-close').addEventListener('click', ()=> overlay.remove());
  }

  function init(){
    town = true; depth = 0; battleOver=false; subMode=null;
    inBossDen = false; bossDenFloor = 0;
    renderJobSelect();
    renderDifficultySelect();

    // 사운드 토글 버튼 — 최초 클릭 시 AudioContext를 깨워 브라우저 자동재생 제한을 해제한다
    const soundBtn = document.getElementById('sound-toggle');
    function refreshSoundBtn(){
      const m = Sound.isMuted();
      soundBtn.textContent = m ? '🔇' : '🔊';
      soundBtn.classList.toggle('muted', m);
    }
    refreshSoundBtn();
    soundBtn.addEventListener('click', ()=>{
      Sound.ensureCtx();
      Sound.toggleMuted();
      refreshSoundBtn();
      if(!Sound.isMuted()){ Sound.click(); Sound.ensureBgmRunning(); }
    });
    // 화면 어디를 처음 눌러도 오디오가 자연스럽게 깨어나도록 한 번만 걸어둔다
    const wakeAudioOnce = ()=>{ Sound.ensureCtx(); Sound.ensureBgmRunning(); document.removeEventListener('pointerdown', wakeAudioOnce); };
    document.addEventListener('pointerdown', wakeAudioOnce, {once:true});

    document.getElementById('btn-start').addEventListener('click', ()=>startGame(false));
    document.getElementById('btn-continue').addEventListener('click', startGame.bind(null, true));
    document.getElementById('btn-delete-save').addEventListener('click', async ()=>{
      await deleteSave();
      document.getElementById('continue-info').style.display='none';
      document.getElementById('btn-continue').style.display='none';
      document.getElementById('btn-delete-save').style.display='none';
    });
    document.getElementById('btn-relicdex').addEventListener('click', ()=>{ showRelicDex(); });
    document.getElementById('btn-restart').addEventListener('click', ()=>{
      // player는 이미 쓰러진 시점에 마을로 옮겨져 체력이 회복되고 골드가 절반이 되었다.
      showScreen('explore');
      renderStatus();
      renderExplore(['다시 회랑 어귀에 섰다. 소지품과 체력이 정비되었다.']);
      saveGame();
    });
    document.getElementById('btn-ending-title').addEventListener('click', async ()=>{
      const job = getJob(player);
      const hybrid = getHybrid(player);
      const jobLabel = hybrid ? `${hybrid.icon} ${hybrid.name}` : `${job.icon} ${job.name}`;
      const record = {
        name: player.name, jobLabel, level: player.level,
        deathCount: player.deathCount||0, ts: Date.now(),
        difficulty: player.difficulty||'easy',
      };
      await addRecord(record);
      await deleteSave();
      window.__savedGame = null;
      document.getElementById('continue-info').style.display='none';
      document.getElementById('btn-continue').style.display='none';
      document.getElementById('btn-delete-save').style.display='none';
      document.getElementById('statusbar').style.display='none';
      showScreen('title');
      loadRecords().then(records=>{
        renderRecords(records);
        normalUnlocked = records.length > 0;
        hardcoreUnlocked = records.some(r=> r.difficulty==='normal' || r.difficulty==='hardcore');
        renderDifficultySelect();
      });
    });
    document.getElementById('btn-advance').addEventListener('click', onAdvance);
    document.getElementById('btn-rest').addEventListener('click', onRest);
    document.getElementById('btn-shop').addEventListener('click', openShop);
    document.getElementById('btn-equip').addEventListener('click', openEquipment);
    document.getElementById('btn-relics').addEventListener('click', showMyRelics);
    document.getElementById('btn-town').addEventListener('click', onReturnTown);
    document.getElementById('btn-bossden').addEventListener('click', enterBossDen);
    document.getElementById('cmd-attack').addEventListener('click', ()=>{ Sound.click(); playerAttack(); });
    document.getElementById('cmd-skill').addEventListener('click', ()=>{ Sound.click(); openSub('skill'); });
    document.getElementById('cmd-item').addEventListener('click', ()=>{ Sound.click(); openSub('item'); });
    document.getElementById('cmd-run').addEventListener('click', ()=>{ Sound.click(); playerRun(); });
    document.getElementById('cmd-back').addEventListener('click', ()=>{ Sound.click(); closeSub(); });
    document.getElementById('name-input').addEventListener('keydown', e=>{ if(e.key==='Enter') startGame(false); });

    loadGame().then(saved=>{
      if(saved && saved.player){
        window.__savedGame = saved;
        const savedJob = getJob(saved.player);
        const savedHybrid = getHybrid(saved.player);
        const jobLabel = savedHybrid ? `${savedHybrid.icon} ${savedHybrid.name}` : `${savedJob.icon} ${savedJob.name}`;
        document.getElementById('continue-info').textContent =
          `${saved.player.name} · ${jobLabel} · Lv.${saved.player.level} · ${saved.town?'마을':'깊이 '+saved.depth}`;
        document.getElementById('continue-info').style.display='block';
        document.getElementById('btn-continue').style.display='inline-block';
        document.getElementById('btn-delete-save').style.display='inline-block';
      }
    }).catch(e=>{ console.warn('불러오기 실패(무시):', e); });

    loadRecords().then(records=>{
      renderRecords(records);
      normalUnlocked = records.length > 0;
      hardcoreUnlocked = records.some(r=> r.difficulty==='normal' || r.difficulty==='hardcore');
      renderDifficultySelect();
    }).catch(e=>{ console.warn('기록 불러오기 실패(무시):', e); });
  }

  function startGame(isContinue){
    if(isContinue && window.__savedGame){
      const saved = window.__savedGame;
      player = saved.player; depth = saved.depth; town = saved.town;
      inBossDen = saved.inBossDen||false; bossDenFloor = saved.bossDenFloor||0;
      if(player.job2===undefined) player.job2 = null;
      if(player.jobChosenAt10===undefined) player.jobChosenAt10 = false;
      if(!player.equipment) player.equipment = {weapon:null, armor:null, accessory:null};
      if(!player.equipOwned) player.equipOwned = [];
      if(!player.relics) player.relics = [];
      if(!player.relicSlots) player.relicSlots = 2;
      if(!player.relicAltarsSeen) player.relicAltarsSeen = [];
      if(player.relicSkipsUsed===undefined) player.relicSkipsUsed = 0;
      if(player.relicSkipsMax===undefined) player.relicSkipsMax = 2;
      if(player.ledgerStack===undefined) player.ledgerStack = 0;
      if(!player.curseAltarsSeen) player.curseAltarsSeen = [];
      if(!player.relicAppliedDeltas) player.relicAppliedDeltas = {};
      if(player.difficulty===undefined) player.difficulty = 'easy';
      if(player.buffCounterTurns===undefined) player.buffCounterTurns = 0;
      if(player.buffCounterChance===undefined) player.buffCounterChance = 0;
      if(player.fateBoostChance===undefined) player.fateBoostChance = 0;
      if(player.fateBoostMult===undefined) player.fateBoostMult = 0;
      if(player.endingSeen===undefined) player.endingSeen = false;
      if(player.deathCount===undefined) player.deathCount = 0;
      if(player.level>=10 && !player.jobChosenAt10) player.jobAdvancePending = true;
      document.getElementById('statusbar').style.display='flex';
      showScreen('explore');
      renderStatus();
      renderExplore(['모험을 이어간다.']);
      return;
    }
    const nameInput = document.getElementById('name-input').value.trim();
    player = newPlayer(nameInput, selectedJobId, selectedDifficulty);
    depth = 0; town = true; enemy = null; battleOver = false; subMode = null;
    inBossDen = false; bossDenFloor = 0;
    battleFlags = {guardian:false, phoenix:false, firstStrikeUsed:false, execCount:0, execReady:false, gambleStacks:0, jackpotGauge:0, jackpotArmed:false, paladinAwoken:false, paladinUltUsed:false, mechExplodeTriggered:false, hourglassTurn:0, witchClockUsedThisTurn:false};
    document.getElementById('statusbar').style.display='flex';
    showScreen('explore');
    renderStatus();
    renderExplore(['회랑 어귀에 첫 발을 내디뎠다.']);
    saveGame();
  }

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('screen-'+id).classList.add('active');
    if(id==='explore'){
      scheduleJobAdvancementCheck();
      Sound.setBgmMode('explore');
    } else if(id==='battle'){
      Sound.setBgmMode('battle');
    } else if(id==='title' || id==='gameover'){
      Sound.setBgmMode('explore');
    }
  }

  function isBattleActive(){
    const el = document.getElementById('screen-battle');
    return !!(el && el.classList.contains('active'));
  }

  // 레벨10 전직 안내를 안전하게 예약한다. 전투 중이면 절대 띄우지 않고,
  // 탐험 화면으로 돌아올 때마다 다시 확인해 결국 한 번은 반드시 뜨도록 한다.
  function scheduleJobAdvancementCheck(){
    if(!player || player.jobChosenAt10 || !player.jobAdvancePending) return;
    setTimeout(()=>{
      if(!player || player.jobChosenAt10 || !player.jobAdvancePending) return;
      if(isBattleActive()) return; // 다음 탐험 화면 진입 시 다시 시도된다.
      if(document.getElementById('jobadv-overlay')) return;
      showJobAdvancement();
    }, 1600);
  }

  function renderStatus(){
    // 빈 그릇(mpZero) 저주: 레벨업/전직 등 어떤 경로로 최대MP가 늘어나든 항상 0으로 되돌린다.
    if(player && hasRelicFlag('mpZero')){
      player.maxmp = 0; player.mp = 0;
    }
    const job = getJob(player);
    const hybrid = getHybrid(player);
    document.getElementById('sb-name').textContent = player.name;
    document.getElementById('sb-lvl').textContent = hybrid
      ? `Lv.${player.level} · ${hybrid.icon} ${hybrid.name}`
      : `Lv.${player.level} · ${job.icon} ${job.name}`;
    document.getElementById('sb-hp-bar').style.width = Math.max(0,(player.hp/player.maxhp*100))+'%';
    document.getElementById('sb-hp-val').textContent = `${Math.max(0,player.hp)}/${player.maxhp}`;
    document.getElementById('sb-mp-bar').style.width = Math.max(0,(player.mp/player.maxmp*100))+'%';
    document.getElementById('sb-mp-val').textContent = `${Math.max(0,player.mp)}/${player.maxmp}`;
    document.getElementById('gold-display').textContent = '💰 '+player.gold;
  }

  function currentLocation(){
    return LOCATIONS.find(l=>depth<=l.max) || LOCATIONS[LOCATIONS.length-1];
  }

  function renderExplore(newLines){
    const loc = currentLocation();
    if(inBossDen){
      document.getElementById('ex-depth-tag').textContent = '보스소굴 '+bossDenFloor+'층';
      document.getElementById('ex-loc-name').textContent = '심연의 투기장';
      document.getElementById('ex-loc-desc').textContent = '오직 강자만이 다음 상대와 마주할 수 있는 곳. 돌아가지 않는 한, 쉼 없이 다음 보스가 나타난다.';
    } else {
      const depthLabel = (!town && hasRelicFlag('hideDepth')) ? '깊이 ???' : ('깊이 '+depth);
      document.getElementById('ex-depth-tag').textContent = town ? '마을' : depthLabel;
      document.getElementById('ex-loc-name').textContent = town ? '안식의 마을' : loc.name;
      document.getElementById('ex-loc-desc').textContent = town ? '따뜻한 화롯불과 상인들의 목소리가 들린다. 이곳에서는 안전하다.' : loc.desc;
    }
    document.getElementById('btn-advance').style.display = 'block';
    document.getElementById('btn-advance').textContent = inBossDen ? '⚔ 다음 상대와 맞서다' : (town ? '➡ 던전으로 출발' : '➡ 나아가다');
    document.getElementById('btn-town').style.display = town ? 'none' : 'block';
    const bossDenBtn = document.getElementById('btn-bossden');
    if(bossDenBtn) bossDenBtn.style.display = (!inBossDen && player && (player.level||1) >= 15) ? 'block' : 'none';
    const logEl = document.getElementById('ex-log');
    if(newLines){
      newLines.forEach(l=>{
        const div = document.createElement('div');
        div.className = 'entry' + (l.cls?(' '+l.cls):'');
        div.textContent = l.text || l;
        logEl.appendChild(div);
      });
      while(logEl.children.length > 60){ logEl.removeChild(logEl.firstChild); }
      logEl.scrollTop = logEl.scrollHeight;
    }
  }

  function addLog(text, cls){
    const logEl = document.getElementById('ex-log');
    const div = document.createElement('div');
    div.className = 'entry'+(cls?(' '+cls):'');
    div.textContent = text;
    logEl.appendChild(div);
    while(logEl.children.length > 60){ logEl.removeChild(logEl.firstChild); }
    logEl.scrollTop = logEl.scrollHeight;
  }

  function onRest(){
    if(town){
      player.hp = player.maxhp; player.mp = player.maxmp;
      renderStatus();
      addLog('마을의 화로 곁에서 몸을 녹였다. 체력과 마력이 전부 회복되었다.', 'gold');
      saveGame();
    } else {
      const cost = Math.round(30 + depth*4);
      if(player.gold < cost){ addLog(`휴식을 취하기엔 금화가 부족하다. (${cost}G 필요)`, 'warn'); return; }
      player.gold -= cost;
      player.hp = player.maxhp; player.mp = player.maxmp;
      renderStatus();
      addLog(`${cost}G를 들여 마련한 화롯불 곁에서 완전히 몸을 추슬렀다. (HP/MP 완전 회복)`, 'gold');
      saveGame();
    }
  }

  function onReturnTown(){
    town = true; depth = 0;
    inBossDen = false; bossDenFloor = 0;
    player.hp = player.maxhp; player.mp = player.maxmp;
    renderStatus();
    renderExplore(['마을로 돌아왔다. 상처가 아물고 기운이 되살아난다.']);
    saveGame();
  }

  function enterBossDen(){
    if(inBossDen) return;
    if((player.level||1) < 15){
      addLog('아직 보스소굴에 들어갈 준비가 되지 않았다. (레벨 15 필요)', 'warn');
      return;
    }
    showBossDenConfirm();
  }

  function showBossDenConfirm(){
    const fromDungeon = !town;
    const overlay = document.createElement('div');
    overlay.className = 'shop-overlay';
    overlay.id = 'bossden-confirm-overlay';
    const panel = document.createElement('div');
    panel.className = 'shop-panel';
    panel.innerHTML = `
      <h3 style="color:var(--rust-bright);">보스소굴</h3>
      <p style="text-align:center;color:var(--parchment-dim);font-size:13px;line-height:1.7;margin-bottom:14px;">
        오직 강자만이 살아남는 곳. 발을 들이면 매 스테이지마다 강력한 보스와 연이어 맞서야 한다.<br>
        ${fromDungeon ? '<b style="color:var(--gold-bright);">지금 탐험 중인 깊이의 진행은 사라진다.</b><br>' : ''}
        <b style="color:var(--gold-bright);">보스소굴로 진입하시겠습니까?</b>
      </p>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button class="btn" id="bossden-confirm-cancel">돌아간다</button>
        <button class="btn btn-danger" id="bossden-confirm-go">진입한다</button>
      </div>`;
    overlay.appendChild(panel);
    document.getElementById('app').appendChild(overlay);
    panel.querySelector('#bossden-confirm-cancel').addEventListener('click', ()=>overlay.remove());
    panel.querySelector('#bossden-confirm-go').addEventListener('click', ()=>{
      overlay.remove();
      proceedEnterBossDen();
    });
  }

  function proceedEnterBossDen(){
    const fromDungeon = !town;
    town = false; inBossDen = true; depth = 40; bossDenFloor = 0;
    renderExplore([fromDungeon
      ? '탐험을 중단하고 보스소굴로 향한다. 위압감이 온몸을 짓누른다. 이 안에서는 오직 강자만이 살아남는다.'
      : '보스소굴 깊은 곳에서 흘러나오는 위압감이 온몸을 짓누른다. 이 안에서는 오직 강자만이 살아남는다.']);
    saveGame();
  }

  function proceedBossDenAdvance(){
    bossDenFloor += 1;
    document.getElementById('ex-depth-tag').textContent = '보스소굴 '+bossDenFloor+'층';
    document.getElementById('ex-loc-name').textContent = '심연의 투기장';
    document.getElementById('ex-loc-desc').textContent = '오직 강자만이 다음 상대와 마주할 수 있는 곳. 돌아가지 않는 한, 쉼 없이 다음 보스가 나타난다.';
    saveGame();
    addLog('공기가 무겁게 가라앉는다… 다음 상대가 기다리고 있다.', 'warn');
    setTimeout(()=>startBattle(true), 400);
  }

  function onAdvance(){
    if(inBossDen){
      proceedBossDenAdvance();
      return;
    }
    if(town){
      town = false;
      renderExplore(['다시 어둠 속 회랑으로 발을 들였다.']);
      saveGame();
      return;
    }
    if(depth === 49 && !player.endingSeen){
      showFinalFloorConfirm();
      return;
    }
    proceedAdvance();
  }

  function showFinalFloorConfirm(){
    const flawless = (player.deathCount||0) === 0;
    const overlay = document.createElement('div');
    overlay.className = 'shop-overlay';
    overlay.id = 'final-confirm-overlay';
    const panel = document.createElement('div');
    panel.className = 'shop-panel';
    panel.innerHTML = `
      <h3 style="color:var(--rust-bright);">회랑의 끝</h3>
      <p style="text-align:center;color:var(--parchment-dim);font-size:13px;line-height:1.7;margin-bottom:14px;">
        문 너머에서 압도적인 기운이 느껴진다. 이곳을 지나면 되돌아올 수 없다.<br>
        ${flawless ? '<b style="color:var(--gold-bright);">단 한 번도 무릎 꿇지 않은 그대에게만, 문 너머의 기운이 어딘가 다르게 느껴진다.</b><br>' : ''}
        <b style="color:var(--gold-bright);">정말로 이 회랑의 끝으로 들어가겠는가?</b>
      </p>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button class="btn" id="final-confirm-cancel">돌아간다</button>
        <button class="btn btn-danger" id="final-confirm-go">들어간다</button>
      </div>`;
    overlay.appendChild(panel);
    document.getElementById('app').appendChild(overlay);
    panel.querySelector('#final-confirm-cancel').addEventListener('click', ()=>overlay.remove());
    panel.querySelector('#final-confirm-go').addEventListener('click', ()=>{
      overlay.remove();
      proceedAdvance();
    });
  }

  function proceedAdvance(){
    depth += 1;
    const loc = currentLocation();
    document.getElementById('ex-depth-tag').textContent = '깊이 '+depth;
    document.getElementById('ex-loc-name').textContent = loc.name;
    document.getElementById('ex-loc-desc').textContent = loc.desc;
    saveGame();

    const isFinalFloor = depth === 50 && !player.endingSeen;
    const isBossFloor = depth>0 && depth % 5 === 0;
    const isRelicFloor = RELIC_ALTAR_FLOORS.includes(depth) && !(player.relicAltarsSeen||[]).includes(depth);
    const isCurseFloor = CURSE_ALTAR_FLOORS.includes(depth) && !(player.curseAltarsSeen||[]).includes(depth);
    const roll = Math.random();

    if(isFinalFloor){
      const isTrueFinal = (player.deathCount||0) === 0;
      addLog(isTrueFinal
        ? '한 번도 무릎 꿇지 않은 자에게만 열리는 문이, 조용히 그 모습을 드러낸다…'
        : '심장이 터질 듯 두근거린다… 이곳이 회랑의 끝이다.', 'warn');
      setTimeout(()=>startBattle(true, true, isTrueFinal), 400);
      return;
    }
    if(isBossFloor){
      addLog('공기가 무겁게 가라앉는다… 강력한 기척이 느껴진다!', 'warn');
      setTimeout(()=>startBattle(true), 400);
      return;
    }
    if(isRelicFloor){
      addLog('낯선 제단이 어둠 속에서 은은한 빛을 낸다…', 'gold');
      player.relicAltarsSeen.push(depth);
      saveGame();
      setTimeout(()=>showRelicAltar(depth), 500);
      return;
    }
    if(isCurseFloor){
      addLog('피비린내가 감도는 제단이 어둠 속에 웅크리고 있다…', 'warn');
      player.curseAltarsSeen.push(depth);
      saveGame();
      setTimeout(()=>showCurseAltar(depth), 500);
      return;
    }
    if(roll < 0.68){
      addLog('그림자 속에서 무언가 튀어나왔다!', 'warn');
      setTimeout(()=>startBattle(false), 350);
      return;
    }
    const findRoll = Math.random();
    if(findRoll < 0.35){
      const g = 4 + Math.floor(Math.random()*10) + depth;
      player.gold += g;
      renderStatus();
      addLog(`바닥에서 금화 ${g}G를 주웠다.`, 'gold');
    } else if(findRoll < 0.55){
      player.inv.potion += 1;
      addLog('낡은 배낭 속에서 물약을 발견했다. (물약 +1)', 'gold');
    } else if(findRoll < 0.68){
      const foundId = findEquipmentForDepth();
      if(foundId){
        player.equipOwned.push(foundId);
        const item = EQUIPMENT[foundId];
        addLog(`먼지 쌓인 상자에서 [${item.name}]을(를) 발견했다! (${statsText(item.stats)})`, 'gold');
        saveGame();
      } else {
        const g = 4 + Math.floor(Math.random()*10) + depth;
        player.gold += g;
        renderStatus();
        addLog(`바닥에서 금화 ${g}G를 주웠다.`, 'gold');
      }
    } else {
      addLog('조용히 발걸음을 옮겼다. 아무 일도 일어나지 않았다.');
    }
    saveGame();
  }

  /* ============ 상점 ============ */
  const SHOP_ITEMS = [
    {key:'potion', name:'물약', desc:'HP 40 회복', price:25},
    {key:'hipotion', name:'상급 물약', desc:'HP 110 회복', price:65},
    {key:'ether', name:'에테르', desc:'MP 30 회복', price:45},
  ];
  function openShop(){
    const overlay = document.createElement('div');
    overlay.className = 'shop-overlay';
    overlay.id = 'shop-overlay';
    const panel = document.createElement('div');
    panel.className = 'shop-panel';
    const discountMult = 1;
    const dprice = p => Math.max(1, Math.round(p*discountMult));
    const equipPool = Object.keys(EQUIPMENT).filter(id=>EQUIPMENT[id].minDepth<=depth+1);
    panel.innerHTML = `<h3>떠돌이 상인</h3>`
      + `<div style="font-family:Cinzel; color:var(--gold); font-size:12.5px; letter-spacing:.05em; margin:4px 0 2px;">소모품</div>`
      + SHOP_ITEMS.map(it=>`
      <div class="shop-item">
        <div class="si-info">
          <span class="si-name" style="font-family:Cinzel;color:var(--parchment);">${it.name} <span style="color:var(--parchment-dim); font-size:12px;">(보유 ${player.inv[it.key]})</span></span>
          <span class="si-desc" style="color:var(--parchment-dim); font-size:12.5px; font-style:italic;">${it.desc}</span>
        </div>
        <button class="buy-btn" data-kind="item" data-key="${it.key}" data-price="${dprice(it.price)}" ${player.gold<dprice(it.price)?'disabled':''}>${dprice(it.price)}G 구매</button>
      </div>
    `).join('')
      + `<div style="font-family:Cinzel; color:var(--gold); font-size:12.5px; letter-spacing:.05em; margin:14px 0 2px;">장비</div>`
      + (equipPool.length ? equipPool.map(id=>{
        const it = EQUIPMENT[id];
        const owned = player.equipOwned.includes(id);
        const price = dprice(it.price);
        return `
      <div class="shop-item">
        <div class="si-info">
          <span class="si-name" style="font-family:Cinzel;color:var(--parchment);">[${SLOT_LABELS[it.slot]}] ${it.name}</span>
          <span class="si-desc" style="color:var(--parchment-dim); font-size:12.5px; font-style:italic;">${it.desc} (${statsText(it.stats)})</span>
        </div>
        <button class="buy-btn" data-kind="equip" data-key="${id}" data-price="${price}" ${(owned||player.gold<price)?'disabled':''}>${owned?'보유중':price+'G 구매'}</button>
      </div>` ;
      }).join('') : `<div style="color:var(--parchment-dim); font-size:13px; font-style:italic; text-align:center; padding:8px;">아직 팔 만한 장비가 없다.</div>`)
      + `<div style="text-align:center; margin-top:10px;"><button class="btn" id="shop-close">떠나기</button></div>`;
    overlay.appendChild(panel);
    document.getElementById('app').appendChild(overlay);
    panel.querySelectorAll('.buy-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        const kind=b.dataset.kind, key=b.dataset.key, price=+b.dataset.price;
        if(player.gold<price) return;
        if(kind==='item'){
          player.gold -= price; player.inv[key]+=1;
          renderStatus();
          addLog(`${SHOP_ITEMS.find(s=>s.key===key).name}을(를) 구매했다.`,'gold');
        } else {
          if(player.equipOwned.includes(key)) return;
          player.gold -= price; player.equipOwned.push(key);
          renderStatus();
          addLog(`[${EQUIPMENT[key].name}]을(를) 구매했다. 장비 화면에서 장착할 수 있다.`,'gold');
        }
        saveGame();
        overlay.remove(); openShop();
      });
    });
    panel.querySelector('#shop-close').addEventListener('click', ()=>overlay.remove());
  }

  /* ============ 장비 관리 ============ */
  function renderSetProgressHTML(){
    const counts = getEpicSetCounts();
    const ownedSetIds = Object.keys(EPIC_SETS).filter(id=>
      player.equipOwned.some(oid=>EPIC_EQUIPMENT[oid] && EPIC_EQUIPMENT[oid].setId===id)
    );
    if(!ownedSetIds.length) return '';
    return `<div style="font-family:Cinzel; color:var(--epic-bright); font-size:12.5px; letter-spacing:.05em; margin:10px 0 6px;">✦ 에픽 세트 진행도</div>` +
      ownedSetIds.map(id=>{
        const set = EPIC_SETS[id];
        const equippedCount = counts[id]||0;
        const items = Object.keys(EPIC_EQUIPMENT).filter(k=>EPIC_EQUIPMENT[k].setId===id);
        const rows = items.map(k=>{
          const owned = player.equipOwned.includes(k);
          const equipped = Object.values(player.equipment).includes(k);
          const mark = equipped ? '■' : (owned?'▣':'□');
          return `${EPIC_EQUIPMENT[k].name} ${mark}`;
        }).join('&nbsp;&nbsp;');
        const tierNote = equippedCount>=3 ? `<span style="color:var(--epic-bright);"> — SET COMPLETE (${set.set3Name})</span>`
          : equippedCount>=2 ? `<span style="color:var(--epic-bright);"> — ${set.set2Name} 발동중</span>` : '';
        return `<div class="set-progress-box">
          <b style="color:var(--epic-bright);">${set.name}</b> (${equippedCount}/3 장착)${tierNote}<br>${rows}
        </div>`;
      }).join('');
  }

  function openEquipment(){
    const overlay = document.createElement('div');
    overlay.className = 'shop-overlay';
    overlay.id = 'equip-overlay';
    const panel = document.createElement('div');
    panel.className = 'shop-panel';
    const slots = ['weapon','armor','accessory'];
    panel.innerHTML = `<h3>장비 정비</h3>` + renderSetProgressHTML() + slots.map(slot=>{
      const equippedId = player.equipment[slot];
      const owned = player.equipOwned.filter(id=>getItemDef(id).slot===slot && id!==equippedId);
      const equippedDef = equippedId ? getItemDef(equippedId) : null;
      const equippedRow = equippedId
        ? `<div class="shop-item">
            <div class="si-info">
              <span class="si-name" style="font-family:Cinzel;color:${equippedDef.epic?'var(--epic-bright)':'var(--gold-bright)'};">★ ${equippedDef.epic?'✦✦ ':(equippedDef.rare?'✨ ':'')}${equippedDef.name}</span>
              <span class="si-desc" style="color:var(--parchment-dim); font-size:12.5px; font-style:italic;">${statsText(equippedDef.stats)}</span>
              <div class="${equippedDef.epic?'item-desc-epic':(equippedDef.rare?'item-desc-rare':'item-desc')}">${equippedDef.desc}</div>
            </div>
            <button class="buy-btn" data-action="unequip" data-slot="${slot}">해제</button>
          </div>`
        : `<div class="shop-item"><div class="si-info"><span class="si-desc" style="color:var(--parchment-dim); font-size:12.5px; font-style:italic;">장착한 ${SLOT_LABELS[slot]}이(가) 없다.</span></div></div>`;
      const ownedRows = owned.map(id=>{
        const def = getItemDef(id);
        return `
          <div class="shop-item">
            <div class="si-info">
              <span class="si-name" style="font-family:Cinzel;color:${def.epic?'var(--epic-bright)':(def.rare?'var(--violet)':'var(--parchment)')};">${def.epic?'✦✦ ':(def.rare?'✨ ':'')}${def.name}</span>
              <span class="si-desc" style="color:var(--parchment-dim); font-size:12.5px; font-style:italic;">${statsText(def.stats)}</span>
              <div class="${def.epic?'item-desc-epic':(def.rare?'item-desc-rare':'item-desc')}">${def.desc}</div>
            </div>
            <button class="buy-btn" data-action="equip" data-item="${id}">장착</button>
          </div>`;
      }).join('');
      return `<div style="font-family:Cinzel; color:var(--gold); font-size:12.5px; letter-spacing:.05em; margin:10px 0 2px;">${SLOT_LABELS[slot]}</div>${equippedRow}${ownedRows}`;
    }).join('') + `<div style="text-align:center; margin-top:10px;"><button class="btn" id="equip-close">닫기</button></div>`;
    overlay.appendChild(panel);
    document.getElementById('app').appendChild(overlay);
    panel.querySelectorAll('[data-action="equip"]').forEach(b=>{
      b.addEventListener('click', ()=>{ equipItem(b.dataset.item); overlay.remove(); openEquipment(); });
    });
    panel.querySelectorAll('[data-action="unequip"]').forEach(b=>{
      b.addEventListener('click', ()=>{ unequipItem(b.dataset.slot); overlay.remove(); openEquipment(); });
    });
    panel.querySelector('#equip-close').addEventListener('click', ()=>overlay.remove());
  }

  /* ============ 전투 ============ */
  // 회랑의 최종보스는 고정된 몬스터가 아니라, 플레이어가 고를 수 있는 6개 직업 중
  // 하나의 모습을 한 "타락한 용사"로 매번 랜덤하게 등장한다.
  const FINAL_BOSS_BY_JOB = {
    warrior:  {name:'잠식된 전사 용사',   type:'herowarrior',  hp:250, atk:23, def:14, spd:7,  exp:600, gold:[350,450], skills:['heroWarriorSmite']},
    mage:     {name:'잠식된 마법사 용사', type:'heromage',     hp:210, atk:26, def:9,  spd:8,  exp:600, gold:[350,450], skills:['heroMageBurst']},
    rogue:    {name:'잠식된 도적 용사',   type:'herorogue',    hp:220, atk:24, def:10, spd:13, exp:600, gold:[350,450], skills:['heroRogueSlash']},
    paladin:  {name:'잠식된 성기사 용사', type:'heropaladin',  hp:260, atk:20, def:16, spd:6,  exp:600, gold:[350,450], skills:['heroPaladinSmite','heal']},
    mechanic: {name:'잠식된 메카닉 용사', type:'heromechanic', hp:230, atk:22, def:12, spd:9,  exp:600, gold:[350,450], skills:['heroMechanicBlast']},
    jester:   {name:'잠식된 도박사 용사',   type:'herojester',   hp:215, atk:24, def:10, spd:11, exp:600, gold:[350,450], skills:['heroJesterGamble']},
  };
  // 단 한 번도 쓰러지지 않고(deathCount===0) 50층에 도달했을 때만 등장하는 진짜 최종보스.
  // 일반 최종보스(잠식된 OO 용사)보다, 그리고 여느 보스들보다도 훨씬 강하다.
  const TRUE_FINAL_BOSS = {
    name:'회랑의 시조', type:'progenitor', hp:460, atk:32, def:22, spd:10,
    exp:1200, gold:[600,800], skills:['trueBossJudgment','heal'],
  };
  function pickFinalBossJob(){
    const ids = JOBS.map(j=>j.id);
    return ids[Math.floor(Math.random()*ids.length)];
  }

  // 난이도에 따라 몬스터 스탯을 조금씩(보통) 또는 크게(하드코어) 강화한다.
  function getDifficultyMonsterMult(){
    const d = player && player.difficulty;
    if(d==='hardcore') return {hp:1.28, atk:1.22, def:1.12};
    if(d==='normal') return {hp:1.12, atk:1.10, def:1.05};
    return {hp:1, atk:1, def:1};
  }
  function scaleEnemyForDifficulty(e){
    const m = getDifficultyMonsterMult();
    if(m.hp!==1){ e.maxhp = Math.max(1, Math.round(e.maxhp*m.hp)); e.hp = e.maxhp; }
    if(m.atk!==1) e.atk = Math.max(1, Math.round(e.atk*m.atk));
    if(m.def!==1) e.def = Math.max(0, Math.round(e.def*m.def));
    return e;
  }
  function pickEnemy(isBoss, isFinal, isTrueFinal){
    if(isTrueFinal){
      const base = TRUE_FINAL_BOSS;
      const scale = 1 + depth*0.05;
      return scaleEnemyForDifficulty({
        type: base.type, name: base.name, isBoss:true, isFinal:true, isTrueFinal:true,
        maxhp: Math.round(base.hp*scale), hp: Math.round(base.hp*scale),
        atk: Math.round(base.atk*scale*0.8),
        def: Math.round(base.def + depth*0.12),
        spd: base.spd,
        exp: base.exp,
        gold: base.gold,
        skills: base.skills, guarding:false,
      });
    }
    if(isFinal){
      const jobId = pickFinalBossJob();
      const base = FINAL_BOSS_BY_JOB[jobId];
      const scale = 1 + depth*0.05;
      return scaleEnemyForDifficulty({
        type: base.type, name: base.name, isBoss:true, isFinal:true, finalJobId: jobId,
        maxhp: Math.round(base.hp*scale), hp: Math.round(base.hp*scale),
        atk: Math.round(base.atk*scale*0.8),
        def: Math.round(base.def + depth*0.12),
        spd: base.spd,
        exp: base.exp,
        gold: base.gold,
        skills: base.skills, guarding:false,
      });
    }
    const pool = (isBoss?BOSSES:MONSTERS).filter(m=>depth>=m.minDepth);
    const base = pool[Math.floor(Math.random()*pool.length)] || (isBoss?BOSSES[0]:MONSTERS[0]);
    const scale = 1 + depth*0.06;
    // 엘리트: 보스가 아닌 일반 몬스터 중 낮은 확률로 강화판이 등장한다. 처치 시 유물이 확정으로 주어진다.
    const isElite = !isBoss && depth>=3 && Math.random()<0.10;
    const eliteMult = isElite ? {hp:1.8, atk:1.35, def:1.3, reward:2.2} : {hp:1, atk:1, def:1, reward:1};
    const skills = isElite ? base.skills.concat(['eliteFerocity']) : base.skills;
    return scaleEnemyForDifficulty({
      type: base.type, name: (isElite?'정예 ':'')+base.name, isBoss, isElite,
      maxhp: Math.round(base.hp*scale*eliteMult.hp), hp: Math.round(base.hp*scale*eliteMult.hp),
      atk: Math.round((base.atk*scale*0.8 + depth*0.4)*eliteMult.atk),
      def: Math.round((base.def + depth*0.15)*eliteMult.def),
      spd: base.spd,
      exp: Math.round(base.exp*(1+depth*0.08)*eliteMult.reward),
      gold: [Math.round(base.gold[0]*(1+depth*0.08)*eliteMult.reward), Math.round(base.gold[1]*(1+depth*0.08)*eliteMult.reward)],
      skills, guarding:false,
    });
  }

  function startBattle(isBoss, isFinal, isTrueFinal){
    enemy = pickEnemy(isBoss, isFinal, isTrueFinal);
    battleOver = false; subMode = null;
    battleFlags = {guardian:false, phoenix:false, firstStrikeUsed:false, execCount:0, execReady:false, gambleStacks:0, jackpotGauge:0, jackpotArmed:false, paladinAwoken:false, paladinUltUsed:false, mechExplodeTriggered:false, hourglassTurn:0, witchClockUsedThisTurn:false};
    checkPaladinAwoken();
    const hpLockPct = getRelicSum('hpLockPct');
    if(hpLockPct>0 && player.maxhp>0){
      player.hp = Math.max(1, Math.round(player.maxhp*hpLockPct));
    }
    showScreen('battle');
    document.getElementById('bt-ename').innerHTML =
      (enemy.isElite ? '<span class="elite-tag">⚔ 정예</span>' : '')
      + (isTrueFinal?'👑 ':(isFinal?'☠️ ':(isBoss?'💀 ':'')))
      + enemy.name;
    document.getElementById('bt-stage').innerHTML = svgMonster(enemy.type);
    document.getElementById('bt-stage').className='enemy-stage'+(enemy.isElite?' elite':'');
    updateEnemyHpBar();
    updateStatusBadges();
    setBattleMsg(isTrueFinal ? `${enemy.name}이(가) 마침내 진정한 모습을 드러낸다!` : (isFinal ? `${enemy.name}이(가) 마침내 모습을 드러냈다!` : (isBoss ? `${enemy.name}이(가) 앞을 가로막는다!` : (enemy.isElite ? `심상치 않은 기운이 감돈다… ${enemy.name}이(가) 나타났다!` : `${enemy.name}이(가) 나타났다!`))), '');
    resetCommandUI();
    renderStatus();
  }

  function openSub(mode){
    subMode = mode;
    document.getElementById('cmd-main').style.display='none';
    document.getElementById('cmd-back-row').style.display='flex';
    const sub = document.getElementById('cmd-sub');
    sub.style.display='flex';
    sub.innerHTML='';

      const avail = player.skills.filter(k=>SKILLDB[k]);
      if(avail.length===0){ sub.innerHTML = '<div class="sub-item disabled">배운 스킬이 없다</div>'; }
      avail.forEach(k=>{
        const s = SKILLDB[k];
        const mpCost = s.mp;
        const canUse = player.mp>=mpCost;
        const div = document.createElement('div');
        div.className = 'sub-item'+(canUse?'':' disabled');
        div.innerHTML = `<div class="si-info"><div class="si-name">${s.name}</div><div class="si-desc">${s.desc}</div></div><div class="si-cost">MP ${mpCost}</div>`;
        if(canUse) div.addEventListener('click', ()=>{ closeSub(); playerSkill(k); });
        sub.appendChild(div);
      });

  function checkBattleEnd(){
    if(enemy.hp<=0){
      battleOver = true;
      setCommandsEnabled(false);
      document.getElementById('bt-stage').classList.add('dying');
      let g = enemy.gold[0]+Math.floor(Math.random()*(enemy.gold[1]-enemy.gold[0]+1));
      const curseRewardMult = getCurseRewardMult();
      const goldBoost = getSpecialSum('goldBoost') + getRelicSum('goldPctMult') + curseRewardMult;
      if(goldBoost>0) g = Math.round(g*(1+goldBoost));
      player.gold += g;
      const killHealPct = getRelicSum('killHealPct');
      if(killHealPct>0 && player.hp>0 && player.hp<player.maxhp){
        player.hp = Math.min(player.maxhp, player.hp + Math.max(1, Math.round(player.maxhp*killHealPct)));
      }
      if(hasRelicFlag('killAtkStack')){
        const stackAmt = Math.max(1, Math.round(getRelicSum('stackAtkPerKill')));
        player.atk += stackAmt;
        player.ledgerStack = (player.ledgerStack||0) + stackAmt;
      }
      const leveled = grantExp(enemy.exp);
      const isFinalKill = !!enemy.isFinal;
      if(leveled.includes(10) && !player.jobChosenAt10){
        player.jobAdvancePending = true;
      }
      let rareDropId = null;
      if(!isFinalKill){
        let rareChance = enemy.isBoss ? 0.12 : 0.035;
        rareChance *= (1 + getSpecialSum('rareDropBoost') + getRelicSum('rareDropPctBonus') + curseRewardMult);
        if(Math.random() < rareChance) rareDropId = findRareDropForDepth();
        if(rareDropId) player.equipOwned.push(rareDropId);
      }
      // 에픽 드랍은 rareDropBoost의 영향을 받지 않는 별도 확률 판정이지만,
      // 네잎클로버처럼 rareDropBoost 특성을 가진 장비를 착용 중이면 별도로 크게 상승하고,
      // 저주를 3개 이상 짊어졌다면(피 값을 치른 대가로) 추가 보너스가 붙는다.
      // 최종 진보스는 엔딩 처리(isFinalKill) 이전에 먼저 보상을 지급한다
      let epicDropId = null;
      const hasCloverLuck = hasSpecial('rareDropBoost');
      let epicChance;
      if(enemy.isFinal) epicChance = 0.05;
      else if(enemy.isBoss) epicChance = hasCloverLuck ? 0.50 : 0.03;
      else epicChance = hasCloverLuck ? 0.03 : 0.005;
      epicChance += getCurseEpicBonus();
      if(Math.random() < epicChance) epicDropId = findEpicDropForDepth();
      if(epicDropId) player.equipOwned.push(epicDropId);
      Sound.victory();
      renderStatus();
      setTimeout(()=>{
        setBattleMsg(`${enemy.name}을(를) 쓰러뜨렸다!`, `EXP +${enemy.exp}  골드 +${g}`);
        setTimeout(()=>{
          if(isFinalKill){
            player.endingSeen = true;
            if(epicDropId){
              showEpicDropToast(EPIC_EQUIPMENT[epicDropId]);
              setTimeout(()=> showEnding(!!enemy.isTrueFinal), 1300);
            } else {
              showEnding(!!enemy.isTrueFinal);
            }
            return;
          }
          showScreen('explore');
          const lines = [{text:`${enemy.name}을(를) 물리쳤다. (EXP +${enemy.exp}, 골드 +${g})`, cls:'gold'}];
          if(rareDropId){
            const item = RARE_EQUIPMENT[rareDropId];
            lines.push({text:`✨ 희귀 아이템 [${item.name}]을(를) 손에 넣었다! (${statsText(item.stats)})`, cls:'gold'});
          }
          if(epicDropId){
            const eitem = EPIC_EQUIPMENT[epicDropId];
            lines.push({text:`✦✦ 에픽 아이템 [${eitem.name}]을(를) 손에 넣었다! (${statsText(eitem.stats)})`, cls:'gold'});
          }
          if(enemy.isElite){
            lines.push({text:`⚔ 정예를 쓰러뜨린 대가로, 유물의 힘이 그대를 부른다…`, cls:'gold'});
          }
          renderExplore(lines);
          if(leveled.length) leveled.forEach(lv=> setTimeout(()=>showLevelUpToast(lv), 150));
          if(rareDropId) setTimeout(()=>showRareDropToast(RARE_EQUIPMENT[rareDropId]), 150*leveled.length + 200);
          if(epicDropId) setTimeout(()=>showEpicDropToast(EPIC_EQUIPMENT[epicDropId]), 150*leveled.length + (rareDropId?500:200));
          if(enemy.isElite) setTimeout(()=>showRelicAltar(), 150*leveled.length + (rareDropId?500:200) + (epicDropId?500:200) + 500);
          saveGame();
        }, 1300);
      }, 500);
      return true;
    }
    if(player.hp<=0){
      battleOver = true;
      setCommandsEnabled(false);
      setBattleMsg(`${player.name}은(는) 쓰러지고 말았다…`, '');
      Sound.gameOver();
      player.deathCount = (player.deathCount||0) + 1;
      setTimeout(()=>{
        showScreen('gameover');
        if(player.difficulty==='hardcore'){
          document.getElementById('go-summary').textContent =
            `깊이 ${depth}까지 도달했으나, 하드코어의 규칙에 따라 모든 것이 처음으로 되돌아간다. `
            + `레벨 1, 1층부터 다시 시작한다. 그러나 손에 넣은 유물만은 그대로 남는다.`;
          const oldRelics = (player.relics||[]).slice();
          const oldRelicSlots = player.relicSlots;
          const oldAltarsSeen = (player.relicAltarsSeen||[]).slice();
          const oldCurseSeen = (player.curseAltarsSeen||[]).slice();
          const oldEquipOwned = (player.equipOwned||[]).slice();
          const oldDeathCount = player.deathCount;
          const oldSkipsUsed = player.relicSkipsUsed;
          const name = player.name, jobId = player.job, diff = player.difficulty;

          player = newPlayer(name, jobId, diff);
          player.relicSlots = oldRelicSlots;
          player.relicAltarsSeen = oldAltarsSeen;
          player.curseAltarsSeen = oldCurseSeen;
          player.equipOwned = oldEquipOwned;
          player.deathCount = oldDeathCount;
          player.relicSkipsUsed = oldSkipsUsed;
          oldRelics.forEach(id=> applyRelicEffect(id));
          player.relics = oldRelics.slice();
        } else {
          document.getElementById('go-summary').textContent =
            `깊이 ${depth}까지 도달했다. 레벨 ${player.level}, 소지금 ${player.gold}G. 마을 사람들이 그대를 구해내어 마을로 옮겼다.`;
          player.gold = Math.floor(player.gold*0.5);
          player.hp = player.maxhp; player.mp = player.maxmp;
        }
        depth = 0; town = true; inBossDen = false; bossDenFloor = 0;
        saveGame();
      }, 900);
      return true;
    }
    return false;
  }

  function grantExp(amount){
    const job = getJob(player);
    const hybrid = getHybrid(player);
    player.exp += amount;
    const levelsGained = [];
    while(player.exp >= player.expNext){
      player.exp -= player.expNext;
      player.level += 1;
      player.expNext = Math.round(player.expNext*1.28 + 6);
      player.maxhp += 9; player.maxmp += 4;
      player.atk += 2; player.def += 1; player.mag += 2; player.spd += 1;
      if(hasRelicFlag('noPostBattleHeal')){
        player.hp = Math.min(player.hp, player.maxhp);
        player.mp = Math.min(player.mp, player.maxmp);
      } else {
        player.hp = player.maxhp; player.mp = player.maxmp;
      }
      const unlockKey = job.skillLevels[player.level];
      if(unlockKey && !player.skills.includes(unlockKey)) player.skills.push(unlockKey);
      const hybridKey = hybrid && hybrid.skills[player.level];
      if(hybridKey && !player.skills.includes(hybridKey)) player.skills.push(hybridKey);
      levelsGained.push(player.level);
    }
    return levelsGained;
  }

  function resolveJobAdvancement(secondJobId){
    player.jobChosenAt10 = true;
    player.jobAdvancePending = false;
    const chosenSecond = secondJobId || player.job;
    const isSelfPick = chosenSecond === player.job;
    player.job2 = chosenSecond;
    if(isSelfPick){
      player.maxhp += 16; player.maxmp += 8;
      player.atk += 3; player.def += 3; player.mag += 3; player.spd += 3;
    } else {
      const secondJob = JOBS.find(j=>j.id===chosenSecond);
      const m = secondJob.statMods;
      player.maxhp += 10 + Math.round((m.maxhp||0)*0.5);
      player.maxmp += 4 + Math.round((m.maxmp||0)*0.5);
      player.atk += Math.round((m.atk||0)*0.5);
      player.def += Math.round((m.def||0)*0.5);
      player.mag += Math.round((m.mag||0)*0.5);
      player.spd += Math.round((m.spd||0)*0.5);
    }
    if(hasRelicFlag('noPostBattleHeal')){
      player.hp = Math.min(player.hp, player.maxhp);
      player.mp = Math.min(player.mp, player.maxmp);
    } else {
      player.hp = player.maxhp; player.mp = player.maxmp;
    }
    const hybrid = getHybrid(player);
    const skillKey = hybrid && hybrid.skills[10];
    if(skillKey && !player.skills.includes(skillKey)) player.skills.push(skillKey);
    renderStatus();
    if(hybrid){
      addLog(`${player.name}은(는) ${hybrid.icon} ${hybrid.name}(으)로 각성했다! 새로운 스킬 「${SKILLDB[skillKey].name}」을(를) 익혔다.`, 'gold');
    }
    saveGame();
  }

  // 마녀의 시계: 속도가 높을수록 적에게 턴을 넘기지 않고 한 번 더 행동할 확률이 생긴다.
  // (한 턴에 최대 1회. 22곳에 흩어진 enemyTurn() 호출부를 그대로 두기 위해, 여기서 래퍼로 가로챈다.)
  function getWitchClockExtraChance(){
    if(!hasRelicFlag('extraActionBySpd')) return 0;
    const spd = player.spd||0;
    if(spd>=25) return 0.30;
    if(spd>=20) return 0.20;
    if(spd>=15) return 0.10;
    return 0;
  }
  function enemyTurn(){
    if(battleOver) return;
    if(battleFlags && !battleFlags.witchClockUsedThisTurn){
      const chance = getWitchClockExtraChance();
      if(chance>0 && Math.random()<chance){
        battleFlags.witchClockUsedThisTurn = true;
        resetCommandUI();
        popDamage('추가 행동!', 'heal');
        playCastBurst();
        Sound.buff();
        setBattleMsg(`${player.name}의 몸이 시간을 앞질러 움직인다!`, '마녀의 시계가 한 번 더 행동할 기회를 준다!');
        return;
      }
    }
    if(battleFlags) battleFlags.witchClockUsedThisTurn = false;
    enemyTurnReal();
  }
  function enemyTurnReal(){
    if(battleOver) return;
    if(battleFlags){
      battleFlags.hourglassTurn = (battleFlags.hourglassTurn||0) + 1;
      const limit = getRelicSum('turnLimitTurns');
      if(limit>0 && battleFlags.hourglassTurn>limit){
        const penaltyPct = getRelicSum('turnLimitPenaltyPct');
        if(penaltyPct>0 && player.hp>0){
          const selfDmg = Math.max(1, Math.round(player.maxhp*penaltyPct));
          player.hp = Math.max(0, player.hp-selfDmg);
          popDamage('-'+selfDmg, 'bleed');
          setBattleMsg('모래가 다 흘러내렸다…', `모래시계의 저주로 ${selfDmg}의 피해를 입었다.`);
          renderStatus();
          if(checkBattleEnd()) return;
        }
      }
    }
    const activeDots = (enemy.dots||[]).filter(d=>d.turns>0);
    if(activeDots.length){
      processDotsSequentially(activeDots, 0);
    } else {
      enemyAction();
    }
  }
  function processDotsSequentially(dots, idx){
    if(idx >= dots.length){
      enemy.dots = (enemy.dots||[]).filter(d=>d.turns>0);
      updateStatusBadges();
      if(checkBattleEnd()) return;
      enemyAction();
      return;
    }
    setTimeout(()=>{
      const d = dots[idx];
      enemy.hp = Math.max(0, enemy.hp - d.dmgPerTurn);
      updateEnemyHpBar(); shakeEnemy(); popDamage('-'+d.dmgPerTurn, d.type);
      playStatusFx(d.type);
      Sound.poisonHit();
      setBattleMsg(`${enemy.name}이(가) ${d.label}(으)로 ${d.dmgPerTurn}의 피해를 입었다!`, '');
      d.turns -= 1;
      updateStatusBadges();
      if(checkBattleEnd()) return;
      processDotsSequentially(dots, idx+1);
    }, 500);
  }
  function enemyAction(){
    setTimeout(()=>{
      let skillKey = null;
      if(enemy.skills.length && Math.random()<0.4){
        skillKey = enemy.skills[Math.floor(Math.random()*enemy.skills.length)];
      }
      if(skillKey==='heal' && enemy.hp < enemy.maxhp*0.5){
        const h = Math.round(enemy.maxhp*0.2);
        enemy.hp = Math.min(enemy.maxhp, enemy.hp+h);
        updateEnemyHpBar();
        popDamage('+'+h,'heal');
        setBattleMsg(`${enemy.name}이(가) 상처를 치유했다!`, `HP +${h}`);
        finishEnemyTurn();
        return;
      }
      let dmg;
      let label = `${enemy.name}의 공격!`;
      if(skillKey==='smash'){ dmg = Math.round(enemy.atk*1.6); label = `${enemy.name}이(가) 강타를 날린다!`; }
      else if(skillKey==='bite'){ dmg = Math.round(enemy.atk*1.4); label = `${enemy.name}이(가) 물어뜯는다!`; }
      else if(skillKey==='curse'){ dmg = Math.round(enemy.atk*1.3); label = `${enemy.name}이(가) 저주를 건다!`; }
      else if(skillKey==='heroWarriorSmite'){ dmg = Math.round(enemy.atk*2.0); label = `${enemy.name}이(가) 필멸의 참격을 내리찍는다!`; }
      else if(skillKey==='heroMageBurst'){ dmg = Math.round(enemy.atk*2.2); label = `${enemy.name}이(가) 멸망의 화염구를 쏘아보낸다!`; }
      else if(skillKey==='heroRogueSlash'){ dmg = Math.round(enemy.atk*1.9); label = `${enemy.name}이(가) 그림자처럼 스며들어 베어낸다!`; }
      else if(skillKey==='heroPaladinSmite'){ dmg = Math.round(enemy.atk*1.7); label = `${enemy.name}이(가) 심판의 빛을 내려찍는다!`; }
      else if(skillKey==='heroMechanicBlast'){ dmg = Math.round(enemy.atk*1.8); label = `${enemy.name}이(가) 장치를 기폭시킨다!`; }
      else if(skillKey==='heroJesterGamble'){
        if(Math.random()<0.5){ dmg = Math.round(enemy.atk*3.0); label = `${enemy.name}의 동전이 앞면으로 떨어진다! 회심의 일격!`; }
        else { dmg = 0; label = `${enemy.name}의 동전이 뒷면으로 떨어진다…`; }
      }
      else if(skillKey==='trueBossJudgment'){ dmg = Math.round(enemy.atk*1.9); label = `${enemy.name}이(가) 태초의 심판을 내리찍는다!`; }
      else if(skillKey==='krakenGrip'){ dmg = Math.round(enemy.atk*1.75); label = `${enemy.name}이(가) 촉수로 온몸을 옥죈다!`; }
      else if(skillKey==='ironCrush'){ dmg = Math.round(enemy.atk*1.9); label = `${enemy.name}이(가) 쇳덩이 같은 주먹을 내리찍는다!`; }
      else if(skillKey==='wraithWail'){ dmg = Math.round(enemy.atk*1.55); label = `${enemy.name}의 귀곡성이 정신을 뒤흔든다!`; }
      else if(skillKey==='eliteFerocity'){ dmg = Math.round(enemy.atk*2.1); label = `${enemy.name}이(가) 정예의 위압적인 기세로 짓쳐든다!`; }
      else { dmg = enemy.atk + Math.floor(Math.random()*3)-1; }

      if(dmg<=0){
        setBattleMsg(label, `공격이 완전히 빗나갔다!`);
        if(checkBattleEnd()) return;
        resetCommandUI();
        return;
      }

      const dodgeChance = getSpecialSum('dodgeChance');
      if(dodgeChance>0 && Math.random()<dodgeChance){
        playBanner('회피!','dodge');
        setBattleMsg(label, `${player.name}이(가) 재빠르게 공격을 피했다!`);
        if(checkBattleEnd()) return;
        resetCommandUI();
        return;
      }

      let mitigated = Math.max(1, dmg - player.def);
      if(player.buffDefTurns > 0){
        mitigated = Math.max(1, Math.round(mitigated * player.buffDefMult));
        player.buffDefTurns -= 1;
        if(player.buffDefTurns <= 0){ player.buffDefTurns = 0; player.buffDefMult = 1; }
      }
      if(player.guardingNextHit){ mitigated = Math.round(mitigated*0.4); player.guardingNextHit=false; }

      let counterOathChance = 0;
      if(player.buffCounterTurns > 0){
        counterOathChance = player.buffCounterChance || 0;
        player.buffCounterTurns -= 1;
        if(player.buffCounterTurns <= 0){ player.buffCounterTurns = 0; player.buffCounterChance = 0; }
      }

      let reduceMult = 1;
      if(epicSetTier('paladin')>=2 && player.maxhp>0 && (player.hp/player.maxhp)>0.5){
        reduceMult -= 0.15;
      }
      reduceMult += getRelicSum('dmgTakenPctMult');
      reduceMult = Math.max(0.15, reduceMult);
      if(reduceMult!==1) mitigated = Math.max(1, Math.round(mitigated*reduceMult));

      let extraMsg = '';
      if(mitigated >= player.hp && battleFlags && !battleFlags.guardian && hasSpecial('guardianShield')){
        mitigated = 0;
        battleFlags.guardian = true;
        playBanner('완전 방어!','guardian');
        extraMsg += ' 수호자의 부적이 치명적인 일격을 완전히 막아냈다!';
      }

      player.hp = Math.max(0, player.hp - mitigated);
      checkPaladinAwoken();
      if(mitigated>0) Sound.hit();

      if(player.hp<=0 && battleFlags && !battleFlags.phoenix && hasSpecial('reviveOnce')){
        const ratio = getReviveRatio();
        player.hp = Math.max(1, Math.round(player.maxhp*ratio));
        battleFlags.phoenix = true;
        playBanner('부활!','phoenix');
        extraMsg += ` 불사조의 깃털이 타올라 되살아났다! (HP ${player.hp})`;
      }

      renderStatus();
      setBattleMsg(label, `${player.name}은(는) ${mitigated}의 피해를 입었다.${extraMsg}`);

      const counterChance = getSpecialSum('counterChance') + counterOathChance;
      if(player.hp>0 && counterChance>0 && Math.random()<counterChance){
        setTimeout(()=>{
          const counterDmg = Math.max(1, Math.round(effectiveAtk()*0.5) - getEffectiveEnemyDef(enemy.def));
          enemy.hp = Math.max(0, enemy.hp-counterDmg);
          updateEnemyHpBar(); shakeEnemy(); popDamage('-'+counterDmg,'counter');
          Sound.slash();
          setBattleMsg(`${player.name}의 반격!`, `${counterDmg}의 피해로 되갚아주었다!`);
          if(checkBattleEnd()) return;
          resetCommandUI();
        }, 400);
        return;
      }

      if(checkBattleEnd()) return;
      resetCommandUI();
    }, 700);
  }
  function finishEnemyTurn(){
    if(checkBattleEnd()) return;
    resetCommandUI();
  }

  function applyDot(spec){
    if(!spec) return;
    const basisVal = spec.basis==='atk' ? effectiveAtk() : player.mag;
    let dmgPerTurn = Math.max(1, Math.round(basisVal*spec.ratio));
    const boost = getDotBoostRatio(spec.type);
    if(boost>0) dmgPerTurn = Math.round(dmgPerTurn*(1+boost));
    if(!enemy.dots) enemy.dots = [];
    // 같은 종류의 상태이상은 갱신(덮어쓰기), 다른 종류는 함께 누적되어 동시에 적용된다
    const existing = enemy.dots.find(d=>d.type===spec.type);
    if(existing){
      existing.turns = spec.turns; existing.dmgPerTurn = dmgPerTurn; existing.label = spec.label;
    } else {
      enemy.dots.push({type:spec.type, turns:spec.turns, dmgPerTurn, label:spec.label});
    }
    playStatusFx(spec.type);
    Sound.statusApply(spec.type);
    updateStatusBadges();
  }
  // 스킬에 정의된 단일 dot(s.dot) 또는 다중 dot(s.dots) 배열을 모두 함께 적용하고,
  // 부여된 상태이상 이름들을 메시지용 문자열로 반환한다
  function applySkillDots(s){
    const specs = s.dots ? s.dots : (s.dot ? [s.dot] : []);
    specs.forEach(applyDot);
    return specs.map(sp=>sp.label).join(', ');
  }

  function applySkillModifiers(dmg, s){
    let d = dmg;
    let triggered = false;
    if(s.executeBonus && enemy.maxhp>0 && (enemy.hp/enemy.maxhp) <= s.executeBonus.vsHpPct){
      d = Math.round(d * s.executeBonus.mult); triggered = true;
    }
    if(s.executeVsStatus && enemy.dots && enemy.dots.some(dt=>dt.type===s.executeVsStatus && dt.turns>0)){
      d = Math.round(d * (s.executeVsStatusMult || 1.4)); triggered = true;
    }
    if(s.statusSynergyBonus){
      const activeTypes = new Set(((enemy && enemy.dots) ? enemy.dots : []).filter(dt=>dt.turns>0).map(dt=>dt.type)).size;
      if(activeTypes > 0){
        d = Math.round(d * (1 + activeTypes*s.statusSynergyBonus));
        triggered = true;
      }
    }
    if(s.selfHpBonusMax){
      const missingRatio = 1 - (player.hp/player.maxhp);
      d = Math.round(d * (1 + missingRatio*s.selfHpBonusMax));
    }
    return {value: Math.max(1, d), triggered};
  }

  function effectiveAtk(){
    let a = player.atk;
    if(player.buffAtkTurns > 0) a = Math.round(a * (player.buffAtkMult||1));
    return a;
  }
  function consumeAtkBuff(){
    if(player.buffAtkTurns > 0){
      player.buffAtkTurns -= 1;
      if(player.buffAtkTurns <= 0){ player.buffAtkTurns = 0; player.buffAtkMult = 1; }
    }
  }

  function playerAttack(){
    if(battleOver) return;
    setCommandsEnabled(false);
    const edef = getEffectiveEnemyDef(enemy.def);
    let dmg = Math.max(1, effectiveAtk() + Math.floor(Math.random()*4)-1 - edef);
    dmg = applyOutgoingDamageMods(dmg, {type:'basic'});
    consumeAtkBuff();
    enemy.hp = Math.max(0, enemy.hp-dmg);
    updateEnemyHpBar(); shakeEnemy(); popDamage('-'+dmg);
    Sound.slash();
    const healed = applyPassiveLifesteal(dmg);
    rogueRegisterHit(true);
    let msg2 = `${enemy.name}에게 ${dmg}의 피해를 입혔다.`;
    if(healed>0) msg2 += ` HP ${healed} 흡수.`;

    if(enemy.hp>0 && maybeWarriorExtraHit()){
      const edef3 = getEffectiveEnemyDef(enemy.def);
      let extraDmg = Math.max(1, effectiveAtk() + Math.floor(Math.random()*4)-1 - edef3);
      extraDmg = applyOutgoingDamageMods(extraDmg, {type:'basic'});
      enemy.hp = Math.max(0, enemy.hp-extraDmg);
      updateEnemyHpBar(); popDamage('-'+extraDmg);
      msg2 += ` 거인강림의 힘으로 한 번 더 몰아쳐 ${extraDmg}의 추가 피해!`;
    }

    const doubleChance = getSpecialSum('doubleStrikeChance');
    if(enemy.hp>0 && doubleChance>0 && Math.random()<doubleChance){
      renderStatus();
      setBattleMsg(`${player.name}의 공격!`, msg2);
      setTimeout(()=>{
        const edef2 = getEffectiveEnemyDef(enemy.def);
        let dmg2 = Math.max(1, effectiveAtk() + Math.floor(Math.random()*4)-1 - edef2);
        dmg2 = applyOutgoingDamageMods(dmg2, {type:'basic'});
        enemy.hp = Math.max(0, enemy.hp-dmg2);
        updateEnemyHpBar(); shakeEnemy(); spawnSlashMark(1); popDamage('-'+dmg2);
        Sound.slash();
        const healed2 = applyPassiveLifesteal(dmg2);
        rogueRegisterHit(true);
        renderStatus();
        let msg3 = `번개처럼 한 번 더 베어 ${dmg2}의 피해를 입혔다!`;
        if(healed2>0) msg3 += ` HP ${healed2} 흡수.`;
        setBattleMsg(`${player.name}의 연속 공격!`, msg3);
        if(checkBattleEnd()) return;
        enemyTurn();
      }, 260);
      return;
    }

    renderStatus();
    setBattleMsg(`${player.name}의 공격!`, msg2);
    if(checkBattleEnd()) return;
    enemyTurn();
  }

  function playerSkill(key){
    if(battleOver) return;
    if(hasRelicFlag('skillLocked')){
      setBattleMsg('침묵이 목소리를 삼킨다…', '스킬을 사용할 수 없다!');
      return;
    }
    const s = SKILLDB[key];
    const mpCost = s.mp;
    if(player.mp < mpCost) return;
    setCommandsEnabled(false);
    player.mp -= mpCost;

    if(s.type==='guard'){
      player.guardingNextHit = true;
      renderStatus();
      playCastBurst('def');
      Sound.guard();
      setBattleMsg(`${player.name}은(는) 방어 태세를 취했다.`, '다음 공격의 피해가 크게 줄어든다.');
      enemyTurn();
      return;
    }

    if(s.type==='buff'){
      player.buffAtkTurns = 3;
      player.buffAtkMult = 1.45;
      renderStatus();
      playCastBurst();
      Sound.buff();
      setBattleMsg(`${player.name}은(는) ${s.name}을(를) 외쳤다!`, '3회의 공격 동안 공격력이 크게 오른다.');
      enemyTurn();
      return;
    }

    if(s.type==='defbuff'){
      player.buffDefTurns = s.turns || 3;
      player.buffDefMult = s.mult || 0.6;
      renderStatus();
      playCastBurst('def');
      Sound.guard();
      setBattleMsg(`${player.name}은(는) ${s.name}을(를) 시전했다!`, `${player.buffDefTurns}턴 동안 받는 피해가 크게 줄어든다.`);
      enemyTurn();
      return;
    }

    if(s.type==='dualbuff'){
      player.buffAtkTurns = s.turns || 3;
      player.buffAtkMult = s.atkMult || 1.25;
      player.buffDefTurns = s.turns || 3;
      player.buffDefMult = s.defMult || 0.8;
      renderStatus();
      playCastBurst('def');
      Sound.buff();
      setBattleMsg(`${player.name}은(는) ${s.name}을(를) 시전했다!`, `${s.turns||3}턴간 공격력이 오르고 받는 피해가 줄어든다.`);
      enemyTurn();
      return;
    }

    if(s.type==='counterbuff'){
      player.buffCounterTurns = s.turns || 3;
      player.buffCounterChance = s.chance || 0.4;
      renderStatus();
      playCastBurst('def');
      Sound.guard();
      setBattleMsg(`${player.name}은(는) ${s.name}을(를) 맹세했다!`, `${s.turns||3}턴간 적의 공격에 ${Math.round((s.chance||0.4)*100)}% 확률로 즉시 반격한다.`);
      enemyTurn();
      return;
    }

    if(s.type==='heal'){
      const heal = Math.round(player.maxhp*s.mult*0.6 + player.mag*0.5);
      player.hp = Math.min(player.maxhp, player.hp+heal);
      renderStatus();
      popDamageOnPlayerArea();
      Sound.heal();
      setBattleMsg(`${player.name}은(는) ${s.name}을(를) 시전했다.`, `HP ${heal} 회복.`);
      if(checkBattleEnd()) return;
      enemyTurn();
      return;
    }

    if(s.type==='multihit'){
      const magicBased = !!s.magic;
      const atkBase = magicBased ? player.mag : effectiveAtk();
      const edef = getEffectiveEnemyDef(enemy.def);
      const defFactor = magicBased ? Math.round(edef*0.5) : edef;
      const rawParts = [];
      for(let i=0;i<s.hits;i++){
        rawParts.push(Math.max(1, Math.round(atkBase*s.mult) - defFactor + Math.floor(Math.random()*3)-1));
      }
      const baseRawTotal = rawParts.reduce((a,b)=>a+b,0);
      const boostedTotal = applyOutgoingDamageMods(baseRawTotal, {type: magicBased?'magicskill':'physkill', mpCost});
      const mod = applySkillModifiers(boostedTotal, s);
      const scale = mod.value / baseRawTotal;
      const parts = rawParts.map(d=>Math.max(1, Math.round(d*scale)));
      const total = parts.reduce((a,b)=>a+b,0);
      if(!magicBased) consumeAtkBuff();
      rogueRegisterHit(!magicBased);
      // 한 타씩 순차적으로 베어내는 연출
      setBattleMsg(`${player.name}은(는) ${s.name}을(를) 시전했다!`, '연속 공격 중...');
      parts.forEach((hitDmg, i)=>{
        setTimeout(()=>{
          enemy.hp = Math.max(0, enemy.hp-hitDmg);
          updateEnemyHpBar(); shakeEnemy(); spawnSlashMark(i);
          if(magicBased) Sound.magic(); else Sound.slash();
          popDamage('-'+hitDmg, (mod.triggered && i===parts.length-1) ? 'crit' : undefined);
        }, i*220);
      });
      setTimeout(()=>{
        renderStatus();
        playComboFinish(parts.length);
        let msg2 = `${parts.join(' + ')} = 총 ${total}의 피해!`;
        if(mod.triggered) msg2 = '급소를 꿰뚫었다! '+msg2;
        const dotLabels1 = applySkillDots(s);
        if(dotLabels1) msg2 += ` ${dotLabels1} 효과 부여!`;
        setBattleMsg(`${player.name}의 ${s.name}!`, msg2);
        if(checkBattleEnd()) return;
        enemyTurn();
      }, parts.length*220 + 250);
      return;
    }

    if(s.type==='drain'){
      const atkBased = s.basis==='atk';
      const basisVal = atkBased ? effectiveAtk() : player.mag;
      const edef = getEffectiveEnemyDef(enemy.def);
      let dmg = Math.max(1, Math.round(basisVal*s.mult) - Math.round(edef*0.5));
      dmg = applyOutgoingDamageMods(dmg, {type: atkBased?'physkill':'magicskill', mpCost});
      const mod = applySkillModifiers(dmg, s);
      dmg = mod.value;
      const healed = Math.min(player.maxhp-player.hp, Math.round(dmg*s.drainRatio*epicLifestealMult()));
      if(atkBased) consumeAtkBuff();
      rogueRegisterHit(atkBased);
      enemy.hp = Math.max(0, enemy.hp-dmg);
      player.hp = Math.min(player.maxhp, player.hp+healed);
      updateEnemyHpBar(); shakeEnemy(); popDamage('-'+dmg, mod.triggered?'crit':undefined);
      if(atkBased) Sound.slash(); else Sound.magic();
      Sound.heal();
      playCastBurst('heal');
      renderStatus();
      let msg2 = `${dmg}의 피해를 주고 ${healed} 만큼 흡수했다.`;
      if(mod.triggered) msg2 = '급소를 꿰뚫었다! '+msg2;
      const dotLabels2 = applySkillDots(s);
      if(dotLabels2) msg2 += ` ${dotLabels2} 효과 부여!`;
      setBattleMsg(`${player.name}은(는) ${s.name}을(를) 시전했다!`, msg2);
      if(checkBattleEnd()) return;
      enemyTurn();
      return;
    }

    if(s.type==='coinflip'){
      const fateChance = player.fateBoostChance||0, fateMult = player.fateBoostMult||0;
      if(fateChance || fateMult){ player.fateBoostChance=0; player.fateBoostMult=0; }
      const epicLuck = epicLuckPre(s);
      const chance = epicLuckApplyChance(Math.min(0.95, (s.chance||0.5) + fateChance), epicLuck);
      const success = Math.random() < chance;
      const magicBased = !!s.magic;
      const base = magicBased ? player.mag : effectiveAtk();
      const edef = getEffectiveEnemyDef(enemy.def);
      const defMitigation = magicBased ? Math.round(edef*0.5) : Math.round(edef*(1-(s.defPierce||0)));
      if(!magicBased) consumeAtkBuff();
      if(success){
        const critMult = (s.critMult||2.0) + fateMult;
        let dmg = Math.max(1, Math.round(base*(s.mult||1.0)*critMult) - defMitigation);
        dmg = applyOutgoingDamageMods(dmg, {type: magicBased?'magicskill':'physkill', mpCost, luck:true});
        const mod = applySkillModifiers(dmg, s);
        dmg = mod.value;
        enemy.hp = Math.max(0, enemy.hp-dmg);
        updateEnemyHpBar(); shakeEnemy(); popDamage('-'+dmg, 'crit');
        rogueRegisterHit(!magicBased);
        Sound.coin();
        playBanner('대성공!');
        let healed = 0;
        if(s.lifesteal){
          healed = Math.min(player.maxhp-player.hp, Math.round(dmg*s.lifesteal*epicLifestealMult()));
          player.hp = Math.min(player.maxhp, player.hp+healed);
        }
        epicLuckPost(true, epicLuck);
        renderStatus();
        let msg2 = `운이 따랐다! ${enemy.name}에게 ${dmg}의 피해를 입혔다.`;
        const dotLabels = applySkillDots(s);
        if(dotLabels) msg2 += ` ${dotLabels} 효과 부여!`;
        if(healed>0) msg2 += ` HP ${healed} 흡수.`;
        setBattleMsg(`${player.name}의 ${s.name}!`, msg2);
      } else {
        epicLuckPost(false, epicLuck);
        popDamage('빗나감!', 'miss');
        Sound.fail();
        playBanner('실패...', 'luckbad');
        renderStatus();
        setBattleMsg(`${player.name}의 ${s.name}!`, '운이 따르지 않았다... 완전히 빗나갔다.');
      }
      if(checkBattleEnd()) return;
      enemyTurn();
      return;
    }

    if(s.type==='fateshift'){
      player.fateBoostChance = s.chanceBonus||0.3;
      player.fateBoostMult = s.multBonus||0.5;
      let msg2 = '다음 운 스킬의 성공 확률과 배율이 크게 오른다.';
      if(s.defBuffTurns){
        player.buffDefTurns = s.defBuffTurns;
        player.buffDefMult = s.defBuffMult||0.8;
        msg2 += ` ${s.defBuffTurns}턴간 받는 피해도 줄어든다.`;
      }
      if(s.selfHealRatio){
        const heal = Math.round(player.maxhp*s.selfHealRatio);
        player.hp = Math.min(player.maxhp, player.hp+heal);
        msg2 += ` HP ${heal} 회복.`;
      }
      renderStatus();
      playCastBurst();
      Sound.buff();
      setBattleMsg(`${player.name}은(는) ${s.name}을(를) 시전했다!`, msg2);
      enemyTurn();
      return;
    }

    if(s.type==='dicecast'){
      const roll = 1 + Math.floor(Math.random()*6);
      const diceMults = s.diceMults || [0.6,1.1,1.7,2.4,3.2,4.5];
      const mult = diceMults[roll-1];
      const epicLuck = epicLuckPre(s);
      const edef = getEffectiveEnemyDef(enemy.def);
      let dmg = Math.max(1, Math.round(effectiveAtk()*mult) - edef);
      dmg = applyOutgoingDamageMods(dmg, {type:'physkill', mpCost, luck:true});
      consumeAtkBuff();
      rogueRegisterHit(true);
      const success = roll>=4;
      epicLuckPost(success, epicLuck);
      enemy.hp = Math.max(0, enemy.hp-dmg);
      updateEnemyHpBar(); shakeEnemy();
      popDamage('-'+dmg, roll===6?'crit':undefined);
      Sound.slash();
      const diceFace = ['⚀','⚁','⚂','⚃','⚄','⚅'][roll-1];
      playBanner(roll===6 ? `${diceFace} 잭팟!` : `${diceFace} 눈 ${roll}`);
      renderStatus();
      let msg2 = `주사위 눈이 ${roll}이(가) 나왔다! ${enemy.name}에게 ${dmg}의 피해를 입혔다.`;
      if(roll===6) msg2 = `주사위가 6을 가리켰다! 운명이 그대의 손을 들어준다! ${enemy.name}에게 ${dmg}의 짜릿한 피해를 입혔다!`;
      else if(roll===1) msg2 = `주사위가 1... 초라한 눈이지만, 그래도 공격은 공격이다. ${enemy.name}에게 ${dmg}의 피해를 입혔다.`;
      setBattleMsg(`${player.name}의 ${s.name}!`, msg2);
      if(checkBattleEnd()) return;
      enemyTurn();
      return;
    }

    if(s.type==='gamble'){
      const staked = player.mp + mpCost; // 시전 직전까지 갖고 있던 MP 전액을 판돈으로 건다
      player.mp = 0;
      const fateChance = player.fateBoostChance||0, fateMult = player.fateBoostMult||0;
      if(fateChance || fateMult){ player.fateBoostChance=0; player.fateBoostMult=0; }
      const epicLuck = epicLuckPre(s);
      const chance = epicLuckApplyChance(Math.min(0.9, (s.chance||0.5) + fateChance), epicLuck);
      const success = Math.random() < chance;
      consumeAtkBuff();
      if(success){
        const mult = (s.mult||3.6) + fateMult;
        const edef = getEffectiveEnemyDef(enemy.def);
        let dmg = Math.max(1, Math.round(effectiveAtk()*mult) - edef) + Math.round(staked*1.5);
        dmg = applyOutgoingDamageMods(dmg, {type:'physkill', luck:true});
        enemy.hp = Math.max(0, enemy.hp-dmg);
        updateEnemyHpBar(); shakeEnemy(); popDamage('-'+dmg, 'crit');
        rogueRegisterHit(true);
        epicLuckPost(true, epicLuck);
        Sound.coin();
        playBanner('대박!');
        renderStatus();
        let msg2 = `도박에 성공했다! MP ${staked}을(를) 태워 ${enemy.name}에게 ${dmg}의 폭발적인 피해를 입혔다!`;
        const dotLabels = applySkillDots(s);
        if(dotLabels) msg2 += ` ${dotLabels} 효과 부여!`;
        setBattleMsg(`${player.name}의 ${s.name}!`, msg2);
        if(checkBattleEnd()) return;
        enemyTurn();
        return;
      } else {
        epicLuckPost(false, epicLuck);
        const selfDmg = epicLuck.wasArmed ? 0 : Math.min(player.hp-1, Math.max(6, Math.round(staked*(s.selfMult||2.2))));
        if(selfDmg>0) player.hp -= selfDmg;
        renderStatus();
        if(selfDmg>0) popDamageOnPlayerArea('-'+selfDmg, 'bleed');
        Sound.fail();
        playBanner('낭패...', 'luckbad');
        setBattleMsg(`${player.name}의 ${s.name}!`, selfDmg>0 ? `도박에 실패했다... MP ${staked}을(를) 잃고 반동으로 ${selfDmg}의 피해를 입었다.` : `도박에 실패했다... MP ${staked}을(를) 잃었지만 세계의 마지막 카드가 반동을 막아주었다.`);
        if(checkBattleEnd()) return;
        enemyTurn();
        return;
      }
    }

    if(s.type==='finalcard'){
      const missingRatio = 1 - (player.hp/player.maxhp);
      const fateChance = player.fateBoostChance||0, fateMult = player.fateBoostMult||0;
      if(fateChance || fateMult){ player.fateBoostChance=0; player.fateBoostMult=0; }
      const epicLuck = epicLuckPre(s);
      const chance = epicLuckApplyChance(Math.min(0.98, (s.baseChance||0.35) + missingRatio*((s.maxChance||0.95)-(s.baseChance||0.35)) + fateChance), epicLuck);
      const mult = (s.baseMult||2.0) + missingRatio*((s.maxMult||6.0)-(s.baseMult||2.0)) + fateMult;
      const success = Math.random() < chance;
      const magicBased = !!s.magic;
      if(!magicBased) consumeAtkBuff();
      const base = magicBased ? player.mag : effectiveAtk();
      const edef = getEffectiveEnemyDef(enemy.def);
      const defMitigation = magicBased ? Math.round(edef*0.5) : Math.round(edef*(1-(s.defPierce||0.2)));
      if(success){
        let dmg = Math.max(1, Math.round(base*mult) - defMitigation);
        dmg = applyOutgoingDamageMods(dmg, {type: magicBased?'magicskill':'physkill', mpCost, luck:true});
        const mod = applySkillModifiers(dmg, s);
        dmg = mod.value;
        enemy.hp = Math.max(0, enemy.hp-dmg);
        updateEnemyHpBar(); shakeEnemy(); popDamage('-'+dmg, 'crit');
        rogueRegisterHit(!magicBased);
        Sound.coin();
        playBanner('마지막 패!');
        let healed = 0;
        if(s.lifesteal){
          healed = Math.min(player.maxhp-player.hp, Math.round(dmg*s.lifesteal*epicLifestealMult()));
          player.hp = Math.min(player.maxhp, player.hp+healed);
        }
        epicLuckPost(true, epicLuck);
        renderStatus();
        let msg2 = `운명이 응답했다! ${enemy.name}에게 ${dmg}의 필멸의 피해를 입혔다.`;
        const dotLabels = applySkillDots(s);
        if(dotLabels) msg2 += ` ${dotLabels} 효과 부여!`;
        if(healed>0) msg2 += ` HP ${healed} 흡수.`;
        setBattleMsg(`${player.name}의 ${s.name}!`, msg2);
        if(checkBattleEnd()) return;
        enemyTurn();
        return;
      } else {
        epicLuckPost(false, epicLuck);
        const selfDmg = epicLuck.wasArmed ? 0 : Math.max(0, Math.min(player.hp-1, Math.round(player.maxhp*(s.failSelfRatio||0.08))));
        if(selfDmg>0) player.hp -= selfDmg;
        renderStatus();
        if(selfDmg>0) popDamageOnPlayerArea('-'+selfDmg, 'bleed');
        else popDamage('빗나감!', 'miss');
        Sound.fail();
        playBanner('패가 뒤집혔다...', 'luckbad');
        setBattleMsg(`${player.name}의 ${s.name}!`, selfDmg>0 ? `카드가 어긋났다... 반동으로 ${selfDmg}의 피해를 입었다.` : '카드가 어긋나 아무 일도 일어나지 않았다.');
        if(checkBattleEnd()) return;
        enemyTurn();
        return;
      }
    }

    // phys or magic damage skill
    const base = s.type==='magic' ? player.mag : effectiveAtk();
    const edef = getEffectiveEnemyDef(enemy.def);
    const defMitigation = s.type==='magic'
      ? Math.round(edef*0.5)
      : Math.round(edef*(1-(s.defPierce||0)));
    let dmg = Math.max(1, Math.round(base*s.mult) - defMitigation);
    dmg = applyOutgoingDamageMods(dmg, {type: s.type==='magic'?'magicskill':'physkill', mpCost});
    const mod = applySkillModifiers(dmg, s);
    dmg = mod.value;
    if(s.type==='phys') consumeAtkBuff();
    rogueRegisterHit(s.type==='phys');
    enemy.hp = Math.max(0, enemy.hp-dmg);
    updateEnemyHpBar(); shakeEnemy(); popDamage('-'+dmg, mod.triggered?'crit':undefined);
    if(s.type==='magic') Sound.magic(); else Sound.slash();
    let healed2 = 0;
    if(s.lifesteal){
      healed2 = Math.min(player.maxhp-player.hp, Math.round(dmg*s.lifesteal*epicLifestealMult()));
      player.hp = Math.min(player.maxhp, player.hp+healed2);
    }
    healed2 += applyPassiveLifesteal(dmg);
    renderStatus();
    let msg2 = `${enemy.name}에게 ${dmg}의 피해를 입혔다.`;
    if(mod.triggered) msg2 = '약점을 정확히 노렸다! '+msg2;
    const dotLabels3 = applySkillDots(s);
    if(dotLabels3) msg2 += ` ${dotLabels3} 효과 부여!`;
    if(healed2>0){ msg2 += ` HP ${healed2} 흡수.`; }
    setBattleMsg(`${player.name}은(는) ${s.name}을(를) 시전했다!`, msg2);
    if(checkBattleEnd()) return;
    enemyTurn();
  }

  function popDamageOnPlayerArea(text, cls){
    // simple feedback on enemy stage top for visibility (기본값은 기존 회복 연출과 동일)
    popDamage(text||'+HP', cls||'heal');
    playCastBurst(cls==='heal' || !cls ? 'heal' : undefined);
  }

  function playerItem(key){
    if(battleOver) return;
    if((player.inv[key]||0)<=0) return;
    if(hasRelicFlag('potionLocked')){
      setBattleMsg('저주가 목을 조여온다…', '물약을 마실 수 없다!');
      return;
    }
    setCommandsEnabled(false);
    player.inv[key]-=1;
    const potBoost = Math.max(0.2, 1 + getRelicSum('potionEffMult'));
    let msg='';
    if(key==='potion'){ const h=Math.round(40*potBoost); player.hp=Math.min(player.maxhp,player.hp+h); msg=`물약을 마셨다. HP ${h} 회복.`; }
    else if(key==='hipotion'){ const h=Math.round(110*potBoost); player.hp=Math.min(player.maxhp,player.hp+h); msg=`상급 물약을 마셨다. HP ${h} 회복.`; }
    else if(key==='ether'){ const m=Math.round(30*potBoost); player.mp=Math.min(player.maxmp,player.mp+m); msg=`에테르를 마셨다. MP ${m} 회복.`; }
    renderStatus();
    popDamage('+','heal');
    Sound.potion();
    setBattleMsg(`${player.name}은(는) 아이템을 사용했다.`, msg);
    if(checkBattleEnd()) return;
    enemyTurn();
  }

  function playerRun(){
    if(battleOver) return;
    setCommandsEnabled(false);
    const chance = Math.min(0.95, Math.max(0.2, 0.5 + (player.spd-enemy.spd)*0.03));
    if(Math.random() < chance){
      battleOver = true;
      const fledFrom = depth;
      depth = Math.max(1, depth-1);
      let ledgerMsg = '';
      if(hasRelicFlag('killAtkStack') && player.ledgerStack>0){
        player.atk = Math.max(1, player.atk - player.ledgerStack);
        player.ledgerStack = 0;
        ledgerMsg = ' 망자의 장부에 쌓인 힘이 모래처럼 흩어졌다.';
      }
      setBattleMsg('도망쳤다!', '');
      setTimeout(()=>{
        showScreen('explore');
        const retreatMsg = (depth < fledFrom
          ? '황급히 뒤로 물러나 한 층 위로 몸을 피했다.'
          : '황급히 뒤로 물러나 어둠 속으로 몸을 숨겼다.') + ledgerMsg;
        renderExplore([{text:retreatMsg, cls:'warn'}]);
        renderStatus();
        saveGame();
      }, 700);
    } else {
      setBattleMsg('도망칠 수 없었다!', '');
      enemyTurn();
    }
  }

  init();
})();
</script>
</body>
