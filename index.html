    background:linear-gradient(180deg,#221a13,#171009);
    border:1px solid #4a3a24;
    border-radius:6px;
    box-shadow:0 0 0 1px #08050280, 0 30px 70px -20px #000000cc, inset 0 0 60px #00000066;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  #app::before{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background:
      radial-gradient(circle at 15% 10%, #ffffff08 0%, transparent 30%),
      repeating-linear-gradient(0deg, #00000012 0 2px, transparent 2px 4px);
    mix-blend-mode:overlay;
    z-index:5;
  }
  h1,h2,h3{font-family:'Cinzel', serif; letter-spacing:0.03em; margin:0;}
  .title-font{font-family:'Cinzel Decorative', serif;}

  /* ---------- status bar ---------- */
  #statusbar{
    display:flex; align-items:center; gap:7px;
    padding:9px 44px 9px 10px;
    background:linear-gradient(180deg,#241b12,#1a130c);
    border-bottom:1px solid #4a3a24;
    font-size:13px;
    flex-shrink:0;
  }
  #statusbar .name{font-family:'Cinzel'; font-weight:700; color:var(--gold-bright); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  #statusbar .lvl{color:var(--parchment-dim); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  #statusbar .namewrap{flex-shrink:0; min-width:0; max-width:min(112px, 28vw); overflow:hidden;}
  .barwrap{flex:1; display:flex; flex-direction:column; gap:3px; min-width:80px;}
  .barrow{display:flex; align-items:center; gap:4px;}
  .barlabel{width:14px; flex-shrink:0; font-size:10.5px; color:var(--parchment-dim); font-family:'Cinzel';}
  .bar-outer{flex:1; min-width:22px; height:8px; background:#0f0b07; border:1px solid #4a3a24; border-radius:3px; overflow:hidden;}
  .bar-inner{height:100%; transition:width .4s ease;}
  .bar-hp{background:linear-gradient(90deg,var(--rust),var(--rust-bright));}
  .bar-mp{background:linear-gradient(90deg,#3d5c8c,#6f9adf);}
  .bar-exp{background:linear-gradient(90deg,var(--gold),var(--gold-bright));}
  .barval{font-size:10px; color:var(--parchment-dim); width:42px; flex-shrink:0; text-align:right;}
  #gold-display{color:var(--gold-bright); font-size:12px; white-space:nowrap; font-family:'Cinzel'; flex-shrink:0;}

  /* ---------- screens ---------- */
  .screen{display:none; flex-direction:column; flex:1; min-height:0;}
  .screen.active{display:flex; min-height:0;}

  /* ---------- title screen ---------- */
  #screen-title{
    align-items:center; justify-content:flex-start; text-align:center;
    padding:28px 24px 24px; gap:18px;
    overflow-y:auto;
    background:
      radial-gradient(ellipse at 50% 30%, #3a2c1c 0%, transparent 60%),
      var(--void);
    position:relative;
  }
  #screen-title > *{flex-shrink:0;}
  .torch-row{display:flex; gap:60px; margin-bottom:-10px;}

  #records-section{width:100%; max-width:380px; margin-top:4px;}
  .records-title{
    font-family:'Cinzel'; color:var(--gold); font-size:12.5px; letter-spacing:.05em;
    text-align:center; margin-bottom:6px; opacity:0.85;
  }
  #records-list{display:flex; flex-direction:column; gap:4px; max-height:150px; overflow-y:auto; padding:2px;}
  .record-row{
    display:flex; justify-content:space-between; gap:8px; align-items:center;
    background:#1e160dcc; border:1px solid #3a2c1c; border-radius:5px;
    padding:6px 10px; font-size:12px; color:var(--parchment-dim);
  }
  .record-row .rec-name{color:var(--parchment); font-family:'Cinzel'; font-weight:700; flex-shrink:0;}
  .record-row .rec-job{color:var(--gold-bright); flex-shrink:0;}
  .record-row .rec-stat{flex-shrink:0; white-space:nowrap;}
  .torch{width:14px; height:34px; position:relative;}
  .flame{
    width:14px; height:22px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 70%, #fff2c0, var(--ember) 55%, var(--rust) 90%);
    box-shadow:0 0 16px 4px #e0793a99, 0 0 40px 10px #d1543c44;
    animation:flicker 1.6s infinite ease-in-out;
    margin:0 auto;
  }
  .torch-stick{width:5px; height:16px; background:linear-gradient(#3a2c1c,#1d150d); margin:0 auto;}
  @keyframes flicker{
    0%,100%{transform:scaleY(1) scaleX(1) translateX(0); opacity:1;}
    25%{transform:scaleY(1.08) scaleX(0.94) translateX(-1px); opacity:.92;}
    50%{transform:scaleY(0.92) scaleX(1.05) translateX(1px); opacity:1;}
    75%{transform:scaleY(1.05) scaleX(0.97) translateX(-0.5px); opacity:.95;}
  }
  #screen-title h1{font-size:34px; color:var(--gold-bright); text-shadow:0 0 24px #e0793a55, 0 2px 0 #000; line-height:1.3;}
  #screen-title .subtitle{color:var(--parchment-dim); font-style:italic; font-size:15px; max-width:360px;}
  #name-input{
    font-family:'EB Garamond'; font-size:17px; text-align:center;
    background:#0f0b07; border:1px solid #5a4527; color:var(--parchment);
    padding:9px 14px; border-radius:3px; width:220px; outline:none;
    -webkit-user-select:text; user-select:text; -webkit-touch-callout:default;
  }
  #name-input:focus{border-color:var(--gold);}

  /* ---------- job select ----------
     직업 수가 늘어나도(예: 4개→5개) 줄 수가 그대로 유지되도록 3열로 배치한다.
     화면 전체(#screen-title)가 스크롤되므로 여기서는 별도 스크롤을 두지 않는다. */
  .job-select{
    display:flex; flex-wrap:wrap; justify-content:center; align-content:flex-start;
    gap:8px; width:100%; max-width:420px;
    flex-shrink:0;
  }
  .job-card{
    flex:0 0 calc((100% - 16px)/3);
    background:linear-gradient(180deg,#241b12,#1a130c);
    border:1px solid #4a3a24; border-radius:5px; padding:10px 6px;
    cursor:pointer; text-align:center; transition:all .12s;
  }
  .job-card:hover{border-color:var(--gold);}
  .job-card.selected{
    border-color:var(--gold-bright);
    box-shadow:0 0 0 1px var(--gold-bright), 0 0 16px #e6c34a44;
    background:linear-gradient(180deg,#3a2c1a,#241a0f);
  }
  .job-card .ji-icon{font-size:21px; line-height:1;}
  .job-card .ji-name{font-family:'Cinzel'; font-size:12.5px; color:var(--parchment); margin-top:5px; font-weight:600;}
  .job-card .ji-desc{font-size:9.5px; color:var(--parchment-dim); font-style:italic; margin-top:4px; line-height:1.35;}
  
  .job-card.locked{opacity:.4; cursor:not-allowed;}
.job-card.locked:hover{border-color:#4a3a24;}


  /* ---------- difficulty select ---------- */
  .difficulty-select{
    display:flex; gap:8px; width:100%; max-width:420px; flex-shrink:0;
  }
  .diff-card{
    flex:1; background:linear-gradient(180deg,#241b12,#1a130c);
    border:1px solid #4a3a24; border-radius:5px; padding:9px 6px;
    cursor:pointer; text-align:center; transition:all .12s;
  }
  .diff-card:hover{border-color:var(--gold);}
  .diff-card.selected{
    border-color:var(--gold-bright);
    box-shadow:0 0 0 1px var(--gold-bright), 0 0 16px #e6c34a44;
    background:linear-gradient(180deg,#3a2c1a,#241a0f);
  }
  .diff-card.locked{opacity:.45; cursor:pointer;}
  .diff-card.locked:hover{border-color:#4a3a24;}
  .diff-card .di-name{font-family:'Cinzel'; font-size:12.5px; color:var(--parchment); font-weight:600;}
  .diff-card .di-desc{font-size:9px; color:var(--parchment-dim); font-style:italic; margin-top:3px; line-height:1.3;}
  .diff-card.type-hardcore.selected{border-color:#ff6a5a; box-shadow:0 0 0 1px #ff6a5a, 0 0 16px #ff6a5a44;}

  /* ---------- buttons ---------- */
  .btn{
    font-family:'Cinzel'; font-size:14px; font-weight:600; letter-spacing:.02em;
    background:linear-gradient(180deg,#3a2c1a,#241a0f);
    border:1px solid #6b5230; color:var(--parchment);
    padding:12px 18px; border-radius:4px; cursor:pointer;
    box-shadow:inset 0 1px 0 #ffffff14, 0 3px 8px #00000055;
    transition:transform .12s, box-shadow .12s, border-color .12s, background .12s;
  }
  .btn:hover{border-color:var(--gold); background:linear-gradient(180deg,#4a3820,#2c2013); transform:translateY(-1px);}
  .btn:active{transform:translateY(1px); box-shadow:inset 0 1px 4px #00000066;}
  .btn:disabled{opacity:.35; cursor:not-allowed; transform:none;}
  .btn-primary{border-color:var(--gold); color:var(--gold-bright);}
  .btn-wide{width:100%;}
  .btn-danger{border-color:var(--rust-bright); color:#ffb9a3;}

  /* ---------- explore screen ---------- */
  #screen-explore{padding:20px; gap:16px; justify-content:flex-start; min-height:0;}
  .location-card{
    background:linear-gradient(180deg,#241b12,#1a130c);
    border:1px solid #4a3a24; border-radius:5px; padding:18px;
    text-align:center;
    flex-shrink:0;
  }
  .location-card .depth-tag{font-family:'Cinzel'; font-size:11px; color:var(--gold); letter-spacing:.1em; text-transform:uppercase;}
  .location-card h2{font-size:22px; color:var(--parchment); margin:6px 0 10px;}
  .location-card p{color:var(--parchment-dim); font-size:15px; line-height:1.6; font-style:italic; margin:0;}
  .explore-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; flex-shrink:0;}
  .explore-log{
    flex:1; min-height:0; background:#0f0b07aa; border:1px solid #3a2c1c;
    border-radius:4px; padding:12px 14px; font-size:14.5px; color:var(--parchment-dim);
    overflow-y:auto; line-height:1.7;
  }
  .explore-log .entry{margin-bottom:6px;}
  .explore-log .entry.gold{color:var(--gold-bright);}
  .explore-log .entry.warn{color:var(--rust-bright);}

  /* ---------- battle screen ---------- */
  #screen-battle{flex:1; min-height:0;}
  .archway{
  position:relative; margin:14px 16px 0; height:210px;
  background:
    radial-gradient(ellipse at 50% 30%, #3a2c1c66 0%, transparent 65%),
    linear-gradient(180deg, #00000000 55%, #171009cc 100%),
    url('images/backgrounds/dungeon1.png');
  background-size: cover, cover, cover;
  background-position: center, center, center;
  ...
    border:10px solid transparent;
    border-image:linear-gradient(180deg,#5a4527,#2c2013) 1;
    border-radius:110px 110px 8px 8px / 90px 90px 8px 8px;
    overflow:hidden;
    box-shadow:inset 0 0 50px #000000cc, inset 0 0 90px #000000aa;
  }
  .archway .torch-side{position:absolute; top:14px; width:12px; z-index:3;}
  .archway .torch-side.left{left:-2px;} .archway .torch-side.right{right:-2px;}
  .enemy-stage{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding-top:10px;
  }
  .enemy-stage svg, .enemy-stage img{width:120px; height:150px; filter:drop-shadow(0 8px 14px #00000099);}
   .enemy-stage.hit svg, .enemy-stage.hit img{animation:hitshake .32s;}
   .enemy-stage.dying svg, .enemy-stage.dying img{animation:diefade .6s forwards;}
  @keyframes hitshake{
    0%,100%{transform:translate(0,0);} 20%{transform:translate(-6px,2px) rotate(-2deg);}
    40%{transform:translate(5px,-2px) rotate(2deg);} 60%{transform:translate(-4px,1px);} 80%{transform:translate(3px,0);}
  }
  @keyframes diefade{ to{ transform:translateY(30px) scale(0.7); opacity:0; filter:brightness(0.2);} }
  .dmg-pop{
    position:absolute; left:50%; top:38%; transform:translate(-50%,0);
    font-family:'Cinzel'; font-weight:700; font-size:26px; color:var(--rust-bright);
    text-shadow:0 0 10px #000, 0 0 18px #d1543c88;
    animation:popup .8s ease-out forwards; pointer-events:none; z-index:4;
  }
  .dmg-pop.heal{color:var(--forest-bright); text-shadow:0 0 10px #000, 0 0 18px #6fae7688;}
  .dmg-pop.miss{color:var(--parchment-dim); font-style:italic; font-size:19px;}
  .dmg-pop.poison{color:#9dd66a; text-shadow:0 0 10px #000, 0 0 18px #9dd66a88;}
  .dmg-pop.burn{color:var(--ember); text-shadow:0 0 10px #000, 0 0 18px #e0793a88;}
  .dmg-pop.bleed{color:#ff6a5a; text-shadow:0 0 10px #000, 0 0 18px #ff6a5a88;}
  @keyframes popup{
    0%{transform:translate(-50%,10px) scale(0.7); opacity:0;}
    25%{transform:translate(-50%,-6px) scale(1.1); opacity:1;}
    100%{transform:translate(-50%,-46px) scale(1); opacity:0;}
  }
  .dmg-pop.counter{color:#8fb4e8; text-shadow:0 0 10px #000, 0 0 18px #8fb4e888;}
  .dmg-pop.crit{font-size:31px; color:#ffe08a; text-shadow:0 0 10px #000, 0 0 22px #ffe08acc;}
  .dmg-pop.rig{color:#8fd0ff; text-shadow:0 0 10px #000, 0 0 16px #8fd0ff88; font-size:22px;}

  /* ---------- 스킬 / 상태이상 이펙트 ---------- */
  .slash-mark{
    position:absolute; top:50%; left:50%; width:150px; height:6px;
    background:linear-gradient(90deg, transparent, #fff6d6 20%, #fff 50%, #fff6d6 80%, transparent);
    box-shadow:0 0 10px #fff, 0 0 20px #d1543c;
    pointer-events:none; z-index:5; opacity:0;
    animation:slashcut .32s ease-out forwards;
  }
  @keyframes slashcut{
    0%{opacity:0; transform:translate(-50%,-50%) rotate(var(--ang,-30deg)) scaleX(0.2);}
    35%{opacity:1; transform:translate(-50%,-50%) rotate(var(--ang,-30deg)) scaleX(1.15);}
    100%{opacity:0; transform:translate(-50%,-50%) rotate(var(--ang,-30deg)) scaleX(1.3);}
  }
  .combo-count{
    position:absolute; left:50%; top:64%; transform:translate(-50%,0);
    font-family:'Cinzel'; font-weight:700; font-size:22px; color:#ffe08a;
    text-shadow:0 0 8px #000, 0 0 16px #ffe08acc; letter-spacing:.04em;
    pointer-events:none; z-index:5; animation:combopop .7s ease-out forwards; white-space:nowrap;
  }
  @keyframes combopop{
    0%{opacity:0; transform:translate(-50%,10px) scale(0.6);}
    30%{opacity:1; transform:translate(-50%,0) scale(1.15);}
    80%{opacity:1;}
    100%{opacity:0; transform:translate(-50%,-16px) scale(1);}
  }
  .status-fx{position:absolute; inset:0; pointer-events:none; z-index:2; opacity:0;}
  .status-fx.play{animation:statusflash .55s ease-out;}
  @keyframes statusflash{ 0%{opacity:0;} 30%{opacity:1;} 100%{opacity:0;} }
  .status-fx.poison{background:radial-gradient(ellipse at 50% 55%, #7ee06655 0%, transparent 70%);}
  .status-fx.burn{background:radial-gradient(ellipse at 50% 55%, #ff8a3a66 0%, transparent 70%);}
  .status-fx.bleed{background:radial-gradient(ellipse at 50% 55%, #ff4a4a55 0%, transparent 70%);}
  .enemy-stage.dot-poison{animation:poisonpulse 1.1s ease-in-out infinite;}
  .enemy-stage.dot-burn{animation:burnpulse .9s ease-in-out infinite;}
  .enemy-stage.dot-bleed{animation:bleedpulse 1.3s ease-in-out infinite;}
  @keyframes poisonpulse{ 0%,100%{filter:drop-shadow(0 0 0 #9dd66a00);} 50%{filter:drop-shadow(0 0 16px #9dd66a99);} }
  @keyframes burnpulse{ 0%,100%{filter:drop-shadow(0 0 0 #e0793a00);} 50%{filter:drop-shadow(0 0 16px #e0793a99);} }
  @keyframes bleedpulse{ 0%,100%{filter:drop-shadow(0 0 0 #ff6a5a00);} 50%{filter:drop-shadow(0 0 14px #ff6a5a88);} }
  .enemy-stage.elite{animation:elitepulse 1.6s ease-in-out infinite;}
  @keyframes elitepulse{ 0%,100%{filter:drop-shadow(0 0 4px #e6c34a55);} 50%{filter:drop-shadow(0 0 22px #e6c34aee);} }
  .elite-tag{
    display:inline-block; font-family:'Cinzel'; font-size:10.5px; letter-spacing:.06em;
    color:#1a130c; background:linear-gradient(180deg,#ffe9a0,#e6c34a);
    border-radius:8px; padding:1px 7px; margin-right:6px; vertical-align:middle;
    box-shadow:0 0 8px #e6c34a99;
  }

  .cast-burst{
    position:absolute; top:50%; left:50%; width:20px; height:20px; margin:-10px 0 0 -10px;
    border-radius:50%; border:3px solid var(--gold-bright); pointer-events:none; z-index:5;
    animation:castburst .55s ease-out forwards;
  }
  .cast-burst.heal{border-color:var(--forest-bright);}
  .cast-burst.def{border-color:#8fb4e8;}
  @keyframes castburst{ 0%{opacity:.9; transform:scale(0.3);} 100%{opacity:0; transform:scale(6);} }

  .fx-banner{
    position:absolute; left:50%; top:20%; transform:translate(-50%,0);
    font-family:'Cinzel'; font-weight:700; font-size:16px; color:var(--gold-bright);
    background:#1a130ce0; border:1px solid var(--gold); border-radius:5px; padding:5px 12px;
    text-shadow:0 1px 3px #000; pointer-events:none; z-index:6; white-space:nowrap;
    animation:bannerpop 1.1s ease-out forwards;
  }
  .fx-banner.guardian{color:#8fb4e8; border-color:#8fb4e8;}
  .fx-banner.phoenix{color:#ffb15a; border-color:#ffb15a;}
  .fx-banner.dodge{color:var(--parchment-dim); border-color:var(--parchment-dim);}
  .fx-banner.luckbad{color:#ff6a5a; border-color:#ff6a5a;}
  .fx-banner.enrage{color:#ff4a3a; border-color:#ff4a3a; font-size:18px; text-shadow:0 0 12px #ff4a3aaa, 0 1px 3px #000;}
  @keyframes bannerpop{
    0%{opacity:0; transform:translate(-50%,8px) scale(0.8);}
    20%{opacity:1; transform:translate(-50%,0) scale(1.05);}
    80%{opacity:1;}
    100%{opacity:0; transform:translate(-50%,-10px) scale(1);}
  }

  .enemy-status-badges{
    position:absolute; top:50%; right:6px; transform:translateY(-50%);
    display:flex; flex-direction:column; align-items:flex-end; gap:5px;
    max-width:104px; z-index:4; pointer-events:none;
  }
  .player-status-badges{
  position:absolute; top:34px; left:6px;
  display:flex; flex-direction:column; align-items:flex-start; gap:4px;
  max-width:96px; z-index:4; pointer-events:none;
}
.player-status-badges .status-badge{
  font-size:9.5px; padding:2px 5px;
}
.status-badge.player-badge{
  color:var(--gold-bright); border-color:#e6c34a88;
}
 
  .status-badge{
    font-family:'Cinzel'; font-size:10px; padding:2px 6px; border-radius:9px;
    background:#1a130cd0; border:1px solid #4a3a24; color:var(--parchment-dim);
    white-space:nowrap; animation:badgein .25s ease-out;
  }
  .status-badge.poison{color:#9dd66a; border-color:#9dd66a88;}
  .status-badge.burn{color:var(--ember); border-color:#e0793a88;}
  .status-badge.bleed{color:#ff6a5a; border-color:#ff6a5a88;}
  .status-badge.expose{color:#8fd0ff; border-color:#8fd0ff88;}
  @keyframes badgein{ from{opacity:0; transform:translateY(-4px) scale(0.8);} to{opacity:1; transform:translateY(0) scale(1);} }

  .enemy-name-bar{
    position:absolute; top:8px; left:0; right:0; text-align:center; z-index:3;
  }
  .enemy-name-bar .ename{font-family:'Cinzel'; font-size:13.5px; color:var(--parchment); text-shadow:0 1px 3px #000; letter-spacing:.02em;}
  .enemy-hp-outer{
    width:130px; height:6px; margin:4px auto 0; background:#0f0b07; border:1px solid #4a3a24; border-radius:3px; overflow:hidden;
  }
  .enemy-hp-inner{height:100%; background:linear-gradient(90deg,var(--rust),var(--rust-bright)); transition:width .4s;}

  .battle-lower{padding:12px 14px 16px; display:flex; flex-direction:column; gap:10px; flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .msgbox{
  background:linear-gradient(180deg,#e9dcc0,#dccba0);
  color:var(--ink); border:2px solid #6b5230; border-radius:4px;
  padding:10px 14px; font-size:15px; min-height:48px; max-height:130px; line-height:1.5;
  box-shadow:inset 0 0 0 1px #ffffff40, 0 4px 10px #00000066;
  flex-shrink:0; overflow-y:auto;
}

  .msgbox .m-line{margin:0;}
  .msgbox .m-line + .m-line{margin-top:2px; opacity:.65; font-size:13.5px;}

 #bt-command-area{display:flex; flex-direction:column; flex:1; min-height:220px;}

  .cmd-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; flex-shrink:0;}
  .cmd-btn{
    font-family:'Cinzel'; font-size:14.5px; font-weight:600;
    background:linear-gradient(180deg,#3a2c1a,#241a0f); border:1px solid #6b5230;
    color:var(--parchment); border-radius:4px; padding:13px 10px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:all .12s; min-height:46px;
  }
  .cmd-btn:hover{border-color:var(--gold); background:linear-gradient(180deg,#4a3820,#2c2013);}
  .cmd-btn:disabled{opacity:.3; cursor:not-allowed;}
  .cmd-btn .icon{font-size:16px;}

  .sublist{display:flex; flex-direction:column; gap:6px; flex:1; min-height:96px; max-height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .sub-item{
    display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
    background:#1a130c; border:1px solid #3a2c1c; border-radius:4px;
    padding:9px 12px; cursor:pointer; font-size:14px; min-height:44px; flex-shrink:0;
  }
  .sub-item:hover{border-color:var(--gold);}
  .sub-item .si-info{flex:1; min-width:0;}
  .sub-item .si-name{font-family:'Cinzel'; font-size:13.5px; color:var(--parchment); display:block;}
  .sub-item .si-desc{color:var(--parchment-dim); font-size:12px; font-style:italic; display:block; margin-top:2px; white-space:normal; overflow-wrap:break-word; line-height:1.4;}
  .sub-item .si-cost{color:#8fb4e8; font-size:12px; flex-shrink:0; margin-left:8px; padding-top:1px;}
  .sub-item.disabled{opacity:.35; cursor:not-allowed;}
  /* ============================================================
   토글형 스킬(화염/빙결/번개계약, 혈서 등) 가로 배치용 CSS
   붙여넣을 위치: index.html의 <style> 안, 아래 두 규칙 바로 아래 아무 데나
   (예: 기존 .sub-item{...} 블록 바로 다음 줄) 추가하면 됩니다.
   ============================================================ */

.toggle-sticky-wrap{
  position:sticky; top:0; z-index:2;
  background:linear-gradient(180deg,#1f170e,#1a130c);
  padding:4px 2px 8px; margin:-4px -2px 4px;
  border-bottom:1px solid #3a2c1c;
}
.toggle-row-label{
  font-family:'Cinzel'; font-size:10px; color:var(--parchment-dim);
  letter-spacing:.03em; margin-bottom:4px; padding-left:2px;
}
.toggle-row{display:flex; gap:6px;}
.toggle-btn{
  flex:1; text-align:center; font-family:'Cinzel'; font-size:12px;
  background:#1a130c; border:1px solid #3a2c1c; border-radius:4px;
  padding:8px 4px; cursor:pointer; color:var(--parchment-dim);
  transition:all .12s;
}
.toggle-btn:hover{border-color:var(--gold);}
.toggle-btn.active{
  border-color:var(--gold-bright); color:var(--gold-bright);
  background:#2c2013; box-shadow:0 0 10px #e6c34a44;
}
  .back-row{display:flex; justify-content:flex-end; flex-shrink:0; padding-top:2px;}
  .link-btn{background:none; border:none; color:var(--parchment-dim); font-family:'Cinzel'; font-size:12.5px; cursor:pointer; text-decoration:underline; padding:4px;}
  .link-btn:hover{color:var(--gold-bright);}

  #sound-toggle{
    position:absolute; top:8px; right:8px; z-index:40;
    width:30px; height:30px; border-radius:50%;
    background:#1a130ccc; border:1px solid #4a3a24; color:var(--parchment-dim);
    font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(2px); transition:border-color .15s, color .15s;
  }
  #sound-toggle:hover{border-color:var(--gold); color:var(--gold-bright);}
  #sound-toggle.muted{color:#6b5b45;}

  /* ---------- shop ---------- */
  .shop-overlay{
    position:absolute; inset:0; background:#0a0705ee; z-index:20;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .shop-panel{
    width:100%; background:linear-gradient(180deg,#241b12,#170f08);
    border-top:2px solid #6b5230; border-radius:10px 10px 0 0;
    padding:18px; max-height:85%; overflow-y:auto;
  }
  .shop-panel h3{color:var(--gold-bright); text-align:center; margin-bottom:12px;}
  .shop-item{display:flex; justify-content:space-between; align-items:flex-start; padding:10px 6px; border-bottom:1px solid #3a2c1c; gap:10px;}
  .shop-item:last-of-type{border-bottom:none;}
  .shop-item .si-info{flex:1; min-width:0;}
  .shop-item .si-info .si-name{display:block;}
  .shop-item .si-info .si-desc{display:block; margin-top:2px;}
  .item-desc{
    margin-top:5px; font-size:11.5px; color:#a89a7a; line-height:1.5;
  }
  .item-desc-rare{
    margin-top:6px; padding:6px 8px; border-radius:4px;
    background:#7a5a9c14; border:1px solid #7a5a9c40;
    font-size:11.5px; color:#c9b3ea; line-height:1.55;
  }
  .item-desc-epic{
    margin-top:6px; padding:6px 8px; border-radius:4px;
    background:#ff7a3c18; border:1px solid #ff7a3c55;
    font-size:11.5px; color:#ffcba8; line-height:1.55;
  }
  .buy-btn{font-family:'Cinzel'; font-size:12.5px; background:#3a2c1a; border:1px solid var(--gold); color:var(--gold-bright); padding:6px 12px; border-radius:3px; cursor:pointer; flex-shrink:0;}
  .buy-btn:disabled{opacity:.3; cursor:not-allowed;}

  .relic-grid{display:flex; flex-direction:column; gap:10px;}
  .relic-card{
    display:flex; flex-direction:column; gap:4px; text-align:left;
    background:#1e160dcc; border:1px solid #4a3a24; border-radius:8px;
    padding:12px 14px; cursor:pointer; font-family:inherit; color:var(--parchment);
    transition:transform .12s ease, border-color .12s ease;
  }
  .relic-card:hover{transform:translateY(-2px); border-color:var(--gold-bright);}
  .relic-card:disabled{cursor:not-allowed; opacity:.55; transform:none;}
  .relic-card:disabled:hover{transform:none; border-color:#4a3a24;}
  .relic-lock-msg{
    text-align:center; color:var(--gold-bright); font-size:12px; font-family:'Cinzel';
    letter-spacing:.03em; margin:0 0 10px; animation:lockpulse 1.1s ease-in-out infinite;
  }
  @keyframes lockpulse{ 0%,100%{opacity:.55;} 50%{opacity:1;} }
  .relic-panel{ animation:relicIn .35s ease; }
  @keyframes relicIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .relic-card .relic-type{
    font-family:'Cinzel'; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    width:fit-content; padding:1px 8px; border-radius:8px; opacity:.9;
  }
  .relic-card.type-blessing .relic-type{color:#ffe9a8; background:#4a3a12;}
  .relic-card.type-contract .relic-type{color:#ffb98f; background:#4a2a12;}
  .relic-card.type-curse .relic-type{color:#d99fff; background:#2e1240;}
  .relic-card.type-wild .relic-type{color:#8fe8dd; background:#0f3a36;}
  .relic-card.type-blessing{border-color:#c99a3f; box-shadow:0 0 14px #c99a3f33;}
  .relic-card.type-contract{border-color:#b86a3f;}
  .relic-card.type-curse{border-color:#7a3fa8; box-shadow:0 0 14px #7a3fa833;}
  .relic-card.type-wild{border-color:#3fa89a;}
  .relic-card.type-mystery .relic-type{color:#c9c9d4; background:#2a2a32;}
  .relic-card.type-mystery{border-color:#6a6a78; border-style:dashed;}
  .relic-card.type-mystery .relic-name{color:#c9c9d4;}
  .relic-card .relic-name{font-family:'Cinzel'; font-weight:700; font-size:15px; color:var(--gold-bright);}
  .relic-card .relic-desc{font-size:13px; color:var(--parchment-dim);}
  .relic-card .relic-desc .relic-pos{color:#8fd66a;}
  .relic-card .relic-desc .relic-neg{color:#ff6a5a;}

  #relicdex-section{width:100%; max-width:380px; margin-top:4px;}
  #relicdex-list{display:flex; flex-direction:column; gap:4px; max-height:150px; overflow-y:auto; padding:2px;}
  .relicdex-row{
    display:flex; justify-content:space-between; gap:8px; align-items:center;
    background:#1e160dcc; border:1px solid #3a2c1c; border-radius:5px;
    padding:6px 10px; font-size:12px; color:var(--parchment-dim);
  }
  .relicdex-row.locked{opacity:.5; font-style:italic;}

  /* ---------- gameover / victory ---------- */
  #screen-gameover, #screen-levelup, #screen-ending{
    align-items:center; justify-content:center; text-align:center; gap:16px; padding:30px;
  }
  #screen-gameover h1{color:var(--rust-bright); font-size:28px;}
  #screen-gameover p{color:var(--parchment-dim); font-size:15px; line-height:1.7;}
  #screen-ending{
    background:radial-gradient(ellipse at 50% 20%, #3a2c1c 0%, transparent 65%), var(--void);
  }
  #screen-ending h1{color:var(--gold-bright); font-size:30px; text-shadow:0 0 26px #e6c34a66, 0 2px 0 #000;}
  #screen-ending p{color:var(--parchment-dim); font-size:15px; line-height:1.8; max-width:400px;}
  #screen-ending .ending-btns{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}

  .toast{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:#1a130ce8; border:1px solid var(--gold); border-radius:6px;
    padding:20px 28px; text-align:center; z-index:30; box-shadow:0 10px 40px #000000cc;
    animation:toastin .3s ease;
  }
  @keyframes toastin{from{opacity:0; transform:translate(-50%,-50%) scale(0.85);} to{opacity:1; transform:translate(-50%,-50%) scale(1);}}
  .toast h3{color:var(--gold-bright); margin-bottom:8px; font-size:19px;}
  .toast p{color:var(--parchment); margin:3px 0; font-size:14px;}
  .toast-epic{
    border:1px solid var(--epic); box-shadow:0 10px 40px #000000cc, 0 0 26px #ff7a3c55;
  }
  .set-progress-box{
    background:#3a1f0f22; border:1px solid var(--epic); border-radius:4px;
    padding:6px 8px; margin-bottom:6px; font-size:11.5px; color:var(--parchment-dim); line-height:1.6;
  }
  
  /* ============================================================
   원소 계약(계약술사) 연출용 CSS — index.html의 <style> 안에 추가하세요.
   붙여넣을 위치: 기존 `.status-fx.bleed{...}` 줄 바로 아래,
   그리고 `.fx-banner.enrage{...}` 줄 바로 아래(둘 다 아래에 함께 적어뒀습니다).
   ============================================================ */

/* --- 1) 화면 플래시: 기존 .status-fx.poison/.burn/.bleed 아래에 추가 --- */
.status-fx.pact-ice{background:radial-gradient(ellipse at 50% 55%, #7ad4ff66 0%, transparent 70%);}
.status-fx.pact-lightning{background:radial-gradient(ellipse at 50% 55%, #ffe98a77 0%, transparent 70%);}

/* --- 2) 배너 색상: 기존 .fx-banner.enrage 아래에 추가 --- */
.fx-banner.pact-fire{color:#ff9a4a; border-color:#ff8a3a; text-shadow:0 0 10px #ff8a3a88, 0 1px 3px #000;}
.fx-banner.pact-ice{color:#8fdcff; border-color:#7ad4ff; text-shadow:0 0 10px #7ad4ff88, 0 1px 3px #000;}
.fx-banner.pact-lightning{color:#ffe98a; border-color:#ffe06a; text-shadow:0 0 10px #ffe06a99, 0 1px 3px #000;}

.rig-slot svg{ width:100%; height:100%; }
.rig-slot-left{ left:8px; }
.rig-slot-right{ right:8px; }
.rig-slot{
  position:absolute; bottom:6px; width:70px; height:50px;
  z-index:3; display:none; pointer-events:none;
  filter:drop-shadow(0 2px 3px #00000088);
  transition:width .2s ease;
}
.rig-slot svg{ width:100%; height:100%; }
.rig-slot-left{ left:8px; }
.rig-slot-right{ right:8px; }
/* 오메가 유닛일 때만 자기 슬롯 안에서 폭이 넓어진다(왼쪽 슬롯은 오른쪽으로,
   오른쪽 슬롯은 왼쪽으로 확장 — "가운데를 향해 길게 뻗는" 인상을 주면서도
   반대편 슬롯의 다른 로봇은 가리지 않는다). */
.rig-slot.rig-wide{ width:130px; }
.rig-turns{
  position:absolute; bottom:-2px; left:50%; transform:translateX(-50%);
  font-family:'Cinzel'; font-size:9px; color:var(--parchment-dim);
  background:#1a130cd0; padding:1px 5px; border-radius:6px; white-space:nowrap;
}
.rig-fire{ animation:rigfire .35s ease-out; }
@keyframes rigfire{
  0%{ filter:drop-shadow(0 0 0 #fff0) brightness(1); }
  35%{ filter:drop-shadow(0 0 8px #ffe08acc) brightness(1.6); }
  100%{ filter:drop-shadow(0 2px 3px #00000088) brightness(1); }
}
 
  ::-webkit-scrollbar{width:7px;}
  ::-webkit-scrollbar-thumb{background:#4a3a24; border-radius:4px;}
  ::-webkit-scrollbar-track{background:#0f0b07;}
</style>
</head>
<body>
<div id="app">
  <button id="sound-toggle" title="음소거 켜기/끄기">🔊</button>

  <!-- STATUS BAR (hidden on title) -->
  <div id="statusbar" style="display:none;">
    <div class="namewrap">
      <div class="name" id="sb-name">용사</div>
      <div class="lvl" id="sb-lvl">Lv.1</div>
    </div>
    <div class="barwrap">
      <div class="barrow">
        <div class="barlabel">HP</div>
        <div class="bar-outer"><div class="bar-inner bar-hp" id="sb-hp-bar" style="width:100%;"></div></div>
        <div class="barval" id="sb-hp-val">30/30</div>
      </div>
      <div class="barrow">
        <div class="barlabel">MP</div>
        <div class="bar-outer"><div class="bar-inner bar-mp" id="sb-mp-bar" style="width:100%;"></div></div>
        <div class="barval" id="sb-mp-val">10/10</div>
      </div>
    </div>
    <div id="gold-display">💰 0</div>
  </div>

  <!-- TITLE -->
  <div id="screen-title" class="screen active">
    <div class="torch-row">
      <div class="torch"><div class="flame"></div><div class="torch-stick"></div></div>
      <div class="torch"><div class="flame" style="animation-delay:.4s;"></div><div class="torch-stick"></div></div>
    </div>
    <h1 class="title-font">어둠의 회랑</h1>
    <p class="subtitle">횃불이 꺼져가는 지하 회랑 깊은 곳, 무엇이 도사리고 있는지는 오직 발을 들인 자만이 안다.</p>
    <div id="continue-info" style="display:none; color:var(--parchment-dim); font-size:13px; margin-bottom:-8px;"></div>
    <button class="btn btn-primary" id="btn-continue" style="display:none;">이어서 하다</button>
    <input type="text" id="name-input" placeholder="그대의 이름은?" maxlength="10">
    <div class="job-select" id="job-select"></div>
    <div class="difficulty-select" id="difficulty-select"></div>
    <button class="btn" id="btn-start">새로 시작하다</button>
    <button class="link-btn" id="btn-delete-save" style="display:none;">저장 데이터 삭제</button>
    <button class="link-btn" id="btn-relicdex">📖 유물 도감</button>
    <div id="records-section" style="display:none;">
      <div class="records-title">이전 모험 기록</div>
      <div id="records-list"></div>
    </div>
  </div>

  <!-- EXPLORE -->
  <div id="screen-explore" class="screen">
    <div class="location-card">
      <div class="depth-tag" id="ex-depth-tag">깊이 0</div>
      <h2 id="ex-loc-name">마을 어귀</h2>
      <p id="ex-loc-desc">이곳에서 장비를 정비하고, 다시 어둠 속으로 나아갈 수 있다.</p>
    </div>
    <div class="explore-log" id="ex-log"></div>
    <div class="explore-grid">
      <button class="btn" id="btn-advance">➡ 나아가다</button>
      <button class="btn" id="btn-rest">🔥 휴식하다</button>
      <button class="btn" id="btn-shop">🛒 상점</button>
      <button class="btn" id="btn-equip">🎽 장비</button>
      <button class="btn" id="btn-relics">✦ 유물</button>
      <button class="btn btn-danger" id="btn-town">🏠 마을로 귀환</button>
      <button class="btn btn-danger" id="btn-bossden" style="display:none;">☠ 보스소굴</button>
    </div>
  </div>

  <!-- BATTLE -->
  <div id="screen-battle" class="screen">
    <div class="archway">
      <div class="torch-side left"><div class="flame" style="transform:scale(0.85);"></div></div>
      <div class="torch-side right"><div class="flame" style="transform:scale(0.85); animation-delay:.6s;"></div></div>
      <div class="enemy-name-bar">
        <div class="ename" id="bt-ename">???</div>
        <div class="enemy-hp-outer"><div class="enemy-hp-inner" id="bt-ehp-bar" style="width:100%;"></div></div>
      </div>
      <div class="enemy-stage" id="bt-stage"></div>
      <div class="enemy-status-badges" id="bt-status"></div>
      <div class="rig-slot rig-slot-left" id="bt-rig1"></div>
    <div class="rig-slot rig-slot-right" id="bt-rig2"></div>
       <div class="player-status-badges" id="bt-player-status"></div>
    </div>
    <div class="battle-lower">
      <div class="msgbox" id="bt-msgbox">
        <p class="m-line" id="bt-msg1">전투가 시작되었다!</p>
        <p class="m-line" id="bt-msg2"></p>
      </div>
      <div id="bt-command-area">
        <div class="cmd-grid" id="cmd-main">
          <button class="cmd-btn" id="cmd-attack"><span class="icon">⚔️</span>공격</button>
          <button class="cmd-btn" id="cmd-skill"><span class="icon">✨</span>스킬</button>
          <button class="cmd-btn" id="cmd-item"><span class="icon">🎒</span>아이템</button>
          <button class="cmd-btn" id="cmd-run"><span class="icon">💨</span>도망</button>
        </div>
        <div class="sublist" id="cmd-sub" style="display:none;"></div>
        <div class="back-row" id="cmd-back-row" style="display:none;">
          <button class="link-btn" id="cmd-back">← 뒤로</button>
        </div>
      </div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="screen-gameover" class="screen">
    <h1 class="title-font">쓰러지다…</h1>
    <p id="go-summary"></p>
    <button class="btn btn-primary" id="btn-restart">마을에서 다시 일어서다</button>
  </div>

  <!-- ENDING -->
  <div id="screen-ending" class="screen">
    <h1 class="title-font" id="ending-title">회랑의 새로운 파수꾼</h1>
    <p id="ending-summary"></p>
    <div class="ending-btns">
      <button class="btn btn-primary" id="btn-ending-title">메인화면으로</button>
    </div>
  </div>

</div>

<script src="js/sound.js"></script>
<script src="js/monster-visuals.js"></script>
<script src="js/data/monsters.js"></script>

<script src="js/ui/difficulty.js"></script>
<script src="js/data/jobs.js"></script>
<script src="js/data/equipment.js"></script>
<script src="js/relics.js"></script>
<script src="js/player.js"></script>
<script src="js/data/skills.js"></script>
<script src="js/records.js"></script>
<script src="js/bootstrap.js"></script>
<script src="js/explore.js"></script>

<script src="js/ui/equipment-ui.js"></script>
<script src="js/combat/battle-setup.js"></script>
<script src="js/combat/battle-fx.js"></script>
<script src="js/combat/battle-end.js"></script>
<script src="js/combat/job-advancement.js"></script>

<script src="js/combat/player-actions.js"></script>
<script src="js/main.js"></script>
</body>
